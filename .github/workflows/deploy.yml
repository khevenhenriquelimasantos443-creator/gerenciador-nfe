name: Deploy Finn → Cloudflare Workers

on:
  push:
    branches:
      - main
      - claude/finn-whatsapp-integration-sz61nv

# O GITHUB_TOKEN default vem com escopo de escrita no repositório. Este workflow
# só precisa ler o código pra buildar e publicar no Cloudflare, então restringe:
# se alguma action da cadeia for comprometida, ela não consegue commitar aqui.
permissions:
  contents: read

# PENDENTE (endurecimento de cadeia de suprimentos): as actions abaixo estão
# presas a tags (@v4, @v3), e tag é um ponteiro móvel — quem controla o
# repositório da action pode reapontá-la para outro commit, e esse commit passa
# a rodar aqui com acesso ao CLOUDFLARE_API_TOKEN. Fixar por SHA resolve.
#
# Não foi feito aqui porque exige o SHA real de cada tag, e esta sessão não tem
# acesso de rede ao github.com pra buscá-los — chutar quebraria o deploy.
# Para fazer:
#   1. Abra github.com/actions/checkout (idem setup-node, cloudflare/wrangler-action)
#   2. Releases → a release da tag em uso → copie o SHA completo do commit
#   3. Troque "actions/checkout@v4" por "actions/checkout@<sha>  # v4"
# Com o Dependabot ligado, ele passa a propor a atualização desses SHAs sozinho.

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy (app)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Worker (embed HTML)
        run: node finn-serve/build.js

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: finn-serve

  deploy-whatsapp-bot:
    runs-on: ubuntu-latest
    name: Deploy WhatsApp Bot
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: finn-worker
