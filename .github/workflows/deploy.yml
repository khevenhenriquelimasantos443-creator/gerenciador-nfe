name: Deploy Finn → Cloudflare Workers

on:
  push:
    branches:
      - main
      - claude/finn-whatsapp-integration-sz61nv

# O GITHUB_TOKEN default vem com escopo de escrita no repositório. Este workflow
# só precisa ler o código pra buildar e publicar no Cloudflare, então restringe:
# se alguma action da cadeia for comprometida, ela não consegue commitar aqui.
permissions:
  contents: read

# As actions abaixo estão presas por SHA de commit, não por tag. Tag é um
# ponteiro móvel: quem controla o repositório da action pode reapontar @v4 pra
# outro commit, e esse commit passaria a rodar aqui com acesso ao
# CLOUDFLARE_API_TOKEN. SHA não se move.
#
# O comentário "# v4" ao lado é só pra leitura humana — quem manda é o SHA.
# Pra atualizar quando sair uma versão nova:
#   git ls-remote --tags https://github.com/actions/checkout | grep 'refs/tags/v5$'
# Se a saída trouxer uma linha terminada em "^{}", use O SHA DESSA LINHA (a tag
# é anotada e o SHA da outra linha aponta pro objeto-tag, não pro commit — pinar
# nele quebra o workflow). Os três SHAs abaixo foram conferidos com
# `git cat-file -t` e são commits.
# Com o Dependabot ligado, ele passa a propor essas atualizações sozinho.

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy (app)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      - name: Build Worker (embed HTML)
        run: node finn-serve/build.js

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd  # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: finn-serve

  deploy-whatsapp-bot:
    runs-on: ubuntu-latest
    name: Deploy WhatsApp Bot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd  # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: finn-worker
