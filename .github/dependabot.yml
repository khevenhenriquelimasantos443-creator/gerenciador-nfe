version: 2
updates:
  # O projeto não tem package.json — as dependências que importam hoje são as
  # actions do workflow de deploy, que rodam com acesso aos secrets do Cloudflare.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
