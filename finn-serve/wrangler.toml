name = "finn-app"
main = "index.js"
compatibility_date = "2024-01-01"

[vars]
TT_PRIVACY_LEVEL = "SELF_ONLY"
# ↑ TikTok Content Posting API. Apps sem auditoria do TikTok só podem postar
#   como SELF_ONLY (só o próprio criador vê o vídeo). Depois que a auditoria
#   aprovar, troca pra "PUBLIC_TO_EVERYONE" e faz deploy — sem mudar código.

# Secrets are set via Cloudflare dashboard (encrypted):
# PLUGGY_CLIENT_ID, PLUGGY_CLIENT_SECRET
# VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, SUPABASE_SERVICE_KEY
# MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET
# RESEND_API_KEY — e-mail de boas-vindas do /beta/signup (resend.com, plano
#   grátis). Sem essa secret configurada, a inscrição continua funcionando
#   normalmente (grava no KV), só não manda o e-mail — falha silenciosa,
#   de propósito, pra nunca travar a inscrição de um tester por causa disso.
#
# IG_ACCESS_TOKEN / IG_BUSINESS_ACCOUNT_ID — publicação no Instagram.
#   A publicação AUTOMÁTICA está DESLIGADA (o alcance orgânico não
#   compensava: 230 visualizações em 30 dias). A rota manual
#   /admin/instagram-publish-next continua funcionando e ainda usa essas
#   duas secrets — só o gatilho diário por cron é que saiu. Existe um
#   agendamento pontual em [triggers] para 02/08 às 10:00 BRT.
#   Usa a "API do
#   Instagram com login do Instagram" (fluxo novo, sem precisar de Página
#   do Facebook) — os dois valores ficam na mesma tela do Meta Developer
#   Console (Casos de uso → API do Instagram → Configuração da API com
#   login do Instagram):
#     1. Conta do Instagram (@finn.finnance) precisa ser Business ou Creator.
#     2. Em "Permissões e recursos", adicionar instagram_business_basic +
#        instagram_business_content_publish (a publicação de mídia exige
#        essa segunda, que não vem marcada como obrigatória por padrão).
#     3. Em "Configuração da API com login do Instagram" → seção
#        "2. Gerar tokens de acesso": atribuir o papel de Testador do
#        Instagram à conta (aba Funções, precisa aceitar o convite no
#        app do Instagram), depois clicar em "Gerar token" — esse token
#        SÓ funciona em graph.instagram.com, não em graph.facebook.com.
#     4. O ID numérico da conta aparece do lado do nome dela, na mesma
#        linha de "Gerar token" — esse é o IG_BUSINESS_ACCOUNT_ID.
#   Sem os dois configurados, a publicação manual só faz log e não tenta nada.
#
# TT_CLIENT_KEY / TT_CLIENT_SECRET — publicação no TikTok (Content Posting
#   API). Diferente do Instagram, essas duas secrets NÃO publicam sozinhas —
#   são só a identidade do app. Depois de configuradas, um admin ainda
#   precisa autorizar a conta do TikTok uma vez (botão "Conectar" na aba
#   TikTok do admin do Finn, que abre /admin/tiktok-connect-url); só depois
#   disso é que /tiktok/callback recebe o access_token/refresh_token de
#   verdade e guarda no FINN_KV (chave 'tiktok_tokens'), renovados sozinhos.
#   Como obter as duas:
#     1. developers.tiktok.com → Manage apps → Create an app.
#     2. Privacy Policy URL: https://finn.dev.br/privacidade
#        Terms of Service URL: https://finn.dev.br/termos
#     3. Em Products, adicionar "Login Kit" e "Content Posting API".
#     4. Redirect URI: https://finn.dev.br/tiktok/callback
#     5. Scopes: user.info.basic, video.publish
#     6. wrangler secret put TT_CLIENT_KEY
#        wrangler secret put TT_CLIENT_SECRET
#   Sem as duas configuradas, a publicação (manual ou automática) só faz log
#   e não tenta nada — nunca derruba o resto do worker.
#   Apps recém-criados só postam como SELF_ONLY até passar pela auditoria do
#   TikTok — ver TT_PRIVACY_LEVEL em [vars] acima.
#
# PLANILHA_COPY_URL — link de cópia da Planilha Finn no Google Sheets.
#   É o caminho bom de entrega: um clique e quem comprou já tem a planilha
#   ONLINE na conta dele, com o Apps Script de sincronização junto (script
#   vinculado viaja no "fazer uma cópia").
#   Como obter:
#     1. Abra a SUA planilha-mestre no Google Sheets (a que tem o script)
#     2. Compartilhar → Acesso geral → "Qualquer pessoa com o link" → Leitor
#     3. Copie a URL e TROQUE o final "/edit..." por "/copy"
#        Ex.: https://docs.google.com/spreadsheets/d/ID_DA_PLANILHA/copy
#     4. wrangler secret put PLANILHA_COPY_URL
#   Sem essa secret, o app NÃO quebra: quem comprou continua vendo o download
#   do .xlsx, e some só o botão "Abrir no Google Sheets".
#   ATENÇÃO: quem tiver esse link consegue tirar uma cópia. É produto pago,
#   então o app só mostra pra quem comprou — mas link vaza. Se vazar, crie
#   outra planilha-mestre e troque a secret.
#
# BRAPI_TOKEN — screener de ações (GET /api/stocks/:ticker). Cotação e
#   indicadores públicos de empresas da B3, vindos da brapi.dev. São DADOS DE
#   MERCADO: não têm nenhuma relação com Open Finance, Pluggy ou a conta
#   bancária de ninguém — a própria resposta da rota carrega esse aviso.
#   Como obter:
#     1. Criar conta em brapi.dev (tem plano grátis).
#     2. Painel → "Meus tokens" → copiar o token.
#     3. wrangler secret put BRAPI_TOKEN  (ou dashboard da Cloudflare →
#        Workers & Pages → finn-app → Settings → Variables → Encrypt).
#   Sem essa secret configurada, a rota NÃO quebra: responde 503 com
#   { erro: { tipo: 'nao_configurado' } } dizendo que o screener não está
#   ligado neste ambiente. O resto do app segue normal — nenhuma outra rota
#   depende dela.
#   O token só existe no Worker, nunca no frontend: finn/index.html é servido
#   a qualquer um sem autenticação, então uma chave lá seria pública. E a CSP
#   do app só libera connect-src pra 'self', Supabase e jsdelivr, ou seja, o
#   navegador nem conseguiria falar com brapi.dev direto.
#   O plano grátis da brapi pode não liberar os módulos de fundamentos
#   (defaultKeyStatistics/financialData). Nesse caso a rota continua
#   respondendo com preço, nome e variação, e o campo
#   diagnostico.modulosAusentes diz o que faltou.
#
# META_ADS_TOKEN / META_AD_ACCOUNT_ID — painel de anúncios (GET /admin/meta-ads).
#   SOMENTE LEITURA de propósito: campanha, gasto, impressões, cliques, CTR,
#   CPC dos últimos 30 dias. Não cria, edita nem pausa campanha — decisão que
#   gasta dinheiro de verdade fica fora daqui até virar um pedido explícito,
#   com um fluxo de "mostrar antes de executar".
#   Como obter:
#     1. business.facebook.com → Configurações do Business → Usuários →
#        Usuários do sistema → criar um novo (ex: "Finn Ads Bot").
#     2. Atribuir esse usuário à conta de anúncios, com acesso de gerenciar.
#     3. Gerar token de acesso pra ele com o escopo ads_read (leitura basta —
#        esta rota nunca escreve).
#     4. O ID da conta de anúncios aparece no topo do Gerenciador de Anúncios,
#        formato act_XXXXXXXXXX (o "act_" pode vir com ou sem, a rota aceita
#        os dois).
#     5. wrangler secret put META_ADS_TOKEN
#        wrangler secret put META_AD_ACCOUNT_ID
#   Sem as duas configuradas, a rota NÃO quebra: responde 503 com
#   { erro: { tipo: 'nao_configurado' } }. O resto do app segue normal.
#   graph.facebook.com estava bloqueado no sandbox onde isso foi escrito — os
#   nomes de campo (spend/impressions/clicks/ctr/cpc/reach) são os
#   documentados publicamente pela Marketing API, mas não foram confirmados
#   contra uma resposta real. Primeira chamada de verdade é que vai validar.

# ─────────────────────────────────────────────
#  Notificações push / assinaturas:
#  - "0 12 * * *"  → 09:00 BRT — contas fixas perto do vencimento + checagem
#                    de assinaturas vencidas (rede de segurança pro caso de
#                    webhook do Mercado Pago perdido).
#  - "0 23 * * 1"  → resumo semanal de gastos, domingo às 20:00 BRT
#    (no cron da Cloudflare, dia da semana vai de 1=domingo a 7=sábado)
#
#  - "0 13,21 * * *" → posts do Instagram, 10:00 e 18:00 BRT (13:00 e 21:00
#                    UTC; o Brasil não tem mais horário de verão desde 2019,
#                    então é sempre UTC-3). UMA entrada de cron cobrindo os
#                    dois horários — a lista com vírgula é um trigger só, o que
#                    importa porque o limite de 5 crons é DA CONTA inteira.
#                    Substituiu o agendamento pontual de 02/08, que já passou.
#
#  - "25 13,21 * * *" → Stories, 25 min depois de cada post (10:25 e 18:25
#                    BRT). Cron PRÓPRIO, e não pendurado no fluxo do post, por
#                    dois motivos: é o intervalo pedido, e o jeito antigo
#                    (promise solta dentro da execução do post) não funciona no
#                    Cloudflare — o isolate encerra quando o post termina e
#                    mata o story no meio, que ainda espera até 20s a Meta
#                    baixar a imagem. Era por isso que o post saía e o story
#                    não.
#
#  ATENÇÃO: são 4 crons aqui + 1 no finn-worker = 5, que é o limite da CONTA.
#  Não sobra slot. Pra agendar mais alguma coisa, junte horários numa entrada
#  só com vírgula (como "13,21" acima) em vez de criar entrada nova.
#
#  (histórico) "0 13 2 8 *" → post ÚNICO no Instagram, 02/08 às 10:00 BRT (13:00 UTC;
#                    o Brasil não tem mais horário de verão desde 2019, então
#                    é sempre UTC-3). Publica o PRÓXIMO post da fila.
#                    ATENÇÃO: cron da Cloudflare é sempre recorrente — este
#                    dispararia de novo em 02/08/2027. O handler tem guard de
#                    ano (só vale em 2026) e guard de KV (não publica duas
#                    vezes), então em 2027 ele não faz nada; mesmo assim,
#                    REMOVER esta linha depois que o post sair, porque o slot
#                    continua ocupado.
#
#  Os crons "0 15 * * *" e "0 21 * * *" foram REMOVIDOS: existiam só pros
#  posts automáticos do Instagram, que foram desligados. Como o limite de
#  cron trigger é DA CONTA inteira (5 no total, e o finn-worker do bot usa
#  1), sobra 1 slot livre com o agendamento acima.
# ─────────────────────────────────────────────
[triggers]
crons = ["0 12 * * *", "0 23 * * 1", "0 13,21 * * *", "25 13,21 * * *"]

# ─────────────────────────────────────────────
#  KV Namespace (armazena as inscrições de push)
#  Como criar:
#    1. dash.cloudflare.com → Workers & Pages → KV
#    2. "Create namespace", nome: finn-push-kv
#    3. Copie o "Namespace ID" e cole abaixo
#  (se você já tem um namespace FINN_KV de outro worker, pode reusar o mesmo ID)
# ─────────────────────────────────────────────
[[kv_namespaces]]
binding = "FINN_KV"
id = "47c375c30cb94e7686218d7bdd3e3e1a"
