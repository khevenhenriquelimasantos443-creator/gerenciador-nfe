name = "melivista-worker"
main = "index.js"
compatibility_date = "2024-11-01"
account_id = "8cd9feaaea37b443866c2b6e22bbd4db"

# ─────────────────────────────────────────────
#  KV — sessões, tokens criptografados e auditoria
#  Namespace "melivista-kv", já criado no dashboard.
# ─────────────────────────────────────────────
[[kv_namespaces]]
binding = "MV_KV"
id = "b7379f2c41464ac3a5be4cecf9c80445"

# ─────────────────────────────────────────────
#  VARIÁVEIS NÃO-SECRETAS
#  APP_URL         — para onde o callback do OAuth volta
#  ALLOWED_ORIGINS — origens autorizadas a chamar a API (sem barra no fim,
#                    separadas por vírgula). Curinga "*" NÃO é aceito.
# ─────────────────────────────────────────────
[vars]
APP_URL = "https://khevenhenriquelimasantos443-creator.github.io/gerenciador-nfe/melivista/"
ALLOWED_ORIGINS = "https://khevenhenriquelimasantos443-creator.github.io"

# ─────────────────────────────────────────────
#  SEGREDOS — nunca ficam neste arquivo nem no repositório.
#  Adicione via terminal depois do deploy:
#
#  wrangler secret put ML_CLIENT_ID
#  wrangler secret put ML_CLIENT_SECRET
#  wrangler secret put MP_CLIENT_ID
#  wrangler secret put MP_CLIENT_SECRET
#
#  wrangler secret put SESSION_SECRET
#    → string aleatória longa. Gere com:
#      openssl rand -base64 48
#
#  wrangler secret put TOKEN_KEY
#    → 32 bytes em base64url (criptografa os tokens no KV). Gere com:
#      openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
# ─────────────────────────────────────────────
