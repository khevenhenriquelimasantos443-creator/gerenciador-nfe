// Lista fixa de 15 papéis líquidos da B3, cobrindo setores diferentes (bancos,
// energia, varejo, saúde, commodities, locação) e incluindo 2 FIIs de
// propósito — são justamente eles que mostram onde a nota de ação não vale
// (ver screenerEhFundo). É lista fixa e não busca livre porque cada papel é
// uma cotação a mais na cota do provedor: busca aberta viraria rate limit na
// primeira digitação.
//
// ESTA LISTA É ESPELHO da SCREENER_TICKERS de finn-serve/build.js — conferida
// papel a papel. Mexer aqui sem mexer lá faz o papel voltar como erro
// permanente na tabela (já aconteceu com RDOR3 e HAPV3). A rota de lote
// devolve o ticker de cada papel, então uma divergência futura aparece na tela
// em vez de sumir: ver screenerAplicaLote.
var SCREENER_TICKERS = ["ITUB4","BBAS3","BBDC4","PETR4","VALE3","TAEE11","ELET3","MGLU3","LREN3","WEGE3","RDOR3","HAPV3","MXRF11","HGLG11","RENT3"];
// Fundos imobiliários da lista, em código. É rede de segurança: se o backend
// não mandar o tipo do papel, mesmo assim não damos nota de ação pra fundo.
// Terminar em 11 não serve de teste — TAEE11 é unit de uma empresa normal.
var SCREENER_FUNDOS = ["MXRF11","HGLG11"];
// Concorrência do CAMINHO DE FALLBACK (um papel por requisição). O caminho
// normal hoje é uma chamada só em GET /api/stocks; isto aqui só roda quando o
// servidor publicado ainda não tem a rota de lote.
var SCREENER_LOTE = 4;

// Colunas da tabela. "dir" é o sentido em que a coluna abre no primeiro
// clique: P/L e dívida são "quanto menor melhor", então abrem em asc; nota,
// DY, ROE e margem abrem em desc. Abrir tudo em asc faria o primeiro clique
// em "Nota" mostrar as piores empresas no topo.
var SCREENER_COLS = [
  { key: "ticker", label: "Papel", num: false, dir: "asc" },
  { key: "preco", label: "Preço", num: true, dir: "desc" },
  { key: "pl", label: "P/L", num: true, dir: "asc" },
  { key: "dy", label: "DY", num: true, dir: "desc" },
  { key: "roe", label: "ROE", num: true, dir: "desc" },
  { key: "dividaEbitda", label: "Dív/EBITDA", num: true, dir: "asc" },
  { key: "margem", label: "Margem", num: true, dir: "desc" },
  { key: "score", label: "Nota", num: true, dir: "desc" }
];

// Os apelidos existem porque o backend do screener está sendo escrito em
// paralelo: se ele chamar o campo de "margemLiquida" em vez de "margem", a
// coluna some da tela sem erro nenhum e ninguém percebe. "leitura" é o texto
// fixo que explica a direção do indicador — aparece no detalhe mesmo quando o
// backend não manda a faixa.
//
// "escalaPadrao" é o contrato escrito do backend (indicadores.escala:
// "dy, roe e margem em FRAÇÃO; pl e dividaEbitda em número puro"). Serve pra
// tela PARAR DE ADIVINHAR escala por limiar: cada detalhe da nota já vem com
// "escala" própria, e quando ele não vier vale o contrato — não o chute.
var SCREENER_INDICADORES = [
  { key: "pl", label: "P/L", curto: "P/L", fmt: "num", escalaPadrao: "numero",
    leitura: "Quanto menor, menos você paga por cada real de lucro. P/L negativo quer dizer prejuízo nos últimos 12 meses.",
    aliases: ["pl","p_l","precoLucro","preco_lucro","precoSobreLucro","priceEarnings","pe"] },
  { key: "dy", label: "Dividend yield", curto: "DY", fmt: "pct", escalaPadrao: "fracao",
    leitura: "Quanto maior, mais dividendo por real investido — mas yield muito alto costuma ser preço despencando ou provento extraordinário, não empresa boa.",
    aliases: ["dy","dividendYield","dividend_yield","dividendyield","yield"] },
  { key: "roe", label: "ROE", curto: "ROE", fmt: "pct", escalaPadrao: "fracao",
    leitura: "Retorno sobre o patrimônio dos sócios. Quanto maior, melhor: abaixo do juro básico, o risco de ação não se paga.",
    aliases: ["roe","returnOnEquity","return_on_equity","retornoPatrimonio","retorno_patrimonio"] },
  { key: "dividaEbitda", label: "Dívida líquida / EBITDA", curto: "Dív/EBITDA", fmt: "mult", escalaPadrao: "numero",
    leitura: "Quantos anos de geração de caixa pagariam a dívida. Quanto menor, melhor; negativo quer dizer mais caixa do que dívida.",
    aliases: ["dividaEbitda","divida_ebitda","dividaLiquidaEbitda","divida_liquida_ebitda","dividaLiquidaSobreEbitda","debtToEbitda","debt_to_ebitda","netDebtToEbitda","divEbitda"] },
  { key: "margem", label: "Margem líquida", curto: "Margem", fmt: "pct", escalaPadrao: "fracao",
    leitura: "Quanto sobra de lucro em cada real vendido. Quanto maior, mais folga a empresa tem pra aguentar aumento de custo.",
    aliases: ["margem","margemLiquida","margem_liquida","margemliquida","profitMargins","profitMargin","netMargin","net_margin"] }
];

// Os "flag" do backend são apelidos curtos ('extremo', 'armadilha'), não frase
// pra usuário: imprimir o apelido cru daria "Atenção: nao_operacional". Aqui
// cada um vira a frase que explica o que aquilo quer dizer. Flag desconhecida
// cai no texto cru mesmo (escapado) — melhor mostrar algo do que engolir.
var SCREENER_FLAGS = {
  extremo: "número fora de qualquer faixa plausível. Não sai da conta: pontua zero, porque dado absurdo não é dado faltando.",
  suspeito: "número suspeito — costuma ser lucro não recorrente inflando o índice.",
  armadilha: "possível armadilha de yield: dividendo muito alto costuma ser preço despencando ou provento extraordinário.",
  inflado: "índice inflado por patrimônio pequeno — parece melhor do que é.",
  // Chave SEM underscore de propósito: screenerFlagTexto normaliza a flag com
  // scrChaveNorm, que remove tudo que não é [a-z0-9]. Com "nao_operacional" aqui,
  // a busca por "naooperacional" não achava e a tela imprimia o slug cru.
  naooperacional: "resultado provavelmente não operacional (venda de ativo, evento único)."
};

// hasOwnProperty em vez de acesso direto pelo mesmo motivo de catColor(): um
// campo herdado do Object.prototype ("constructor", "toString") devolveria uma
// função em vez de undefined e o fallback nunca dispararia.
function scrPick(obj, names){
  if(!obj || typeof obj !== "object") return undefined;
  for(var i = 0; i < names.length; i++){
    if(Object.prototype.hasOwnProperty.call(obj, names[i])){
      var v = obj[names[i]];
      if(v !== undefined && v !== null) return v;
    }
  }
  return undefined;
}

// O corpo pode vir chapado ({symbol, preco, ...}) ou embrulhado
// ({ok:true, data:{...}}). Procurar nos dois níveis custa três linhas e evita
// a tela inteira aparecer vazia só porque o outro lado embrulhou a resposta.
function scrCampo(body, names){
  var v = scrPick(body, names);
  if(v !== undefined) return v;
  var dentro = scrPick(body, ["data","dados","acao","ativo","stock","resultado","result","quote"]);
  if(dentro && typeof dentro === "object" && !Array.isArray(dentro)) return scrPick(dentro, names);
  return undefined;
}

// Converte o que vier em número. Já vi API financeira devolver número puro,
// string "38,42", string "28.5%" e objeto {raw, fmt} — aceitar os quatro é
// mais barato que descobrir em produção que a coluna inteira virou "—".
function scrNum(v){
  if(v === null || v === undefined) return null;
  if(typeof v === "object") return scrNum(scrPick(v, ["valor","value","raw","num"]));
  if(typeof v === "string"){
    var s = v.replace(/[R$%\s]/g, "");
    if(!s) return null;
    // "1.234,56" (pt-BR) x "1234.56" (en-US): só trata como pt-BR quando tem
    // vírgula, senão "38.42" viraria 3842.
    if(s.indexOf(",") >= 0) s = s.replace(/\./g, "").replace(",", ".");
    v = parseFloat(s);
  }
  if(typeof v !== "number" || !isFinite(v)) return null;
  return v;
}

// Primeiro campo da lista que seja texto de verdade. O padrão
// {error:true, message:"..."} é comum em API financeira: pegar o "error"
// booleano deixaria a linha com a mensagem genérica em vez do motivo real.
//
// Desce um nível quando o campo é OBJETO porque o backend manda o erro
// aninhado: { erro: { tipo, mensagem } }. Lendo só campo chapado, toda frase
// escrita com cuidado do outro lado ("Não achamos o papel ITUB4 na B3 agora")
// era jogada fora e a tela mostrava "Não consegui buscar (erro 404)".
function screenerPrimeiroTexto(body, names){
  for(var i = 0; i < names.length; i++){
    var v = scrCampo(body, [names[i]]);
    if(typeof v === "string" && v) return v;
    if(v && typeof v === "object" && !Array.isArray(v)){
      var dentro = scrPick(v, ["mensagem","message","texto","detalhe","detail","descricao","motivo","erro","error"]);
      if(typeof dentro === "string" && dentro) return dentro;
    }
  }
  return "";
}

function scrChaveNorm(s){
  return String(s === null || s === undefined ? "" : s).toLowerCase().replace(/[^a-z0-9]/g, "");
}

function scrBateChave(chave, aliases){
  var alvo = scrChaveNorm(chave);
  if(!alvo) return false;
  for(var i = 0; i < aliases.length; i++){
    if(scrChaveNorm(aliases[i]) === alvo) return true;
  }
  return false;
}

function screenerFmtDec(v){
  return v.toFixed(2).replace(".", ",");
}

// A ESCALA VEM DO BACKEND, não é mais adivinhada. Cada detalhe da nota traz
// "escala" ('fracao' | 'percentual' | 'numero') e o contrato da resposta diz
// que dy/roe/margem saem em fração — é o que escalaPadrao guarda.
//
// O limiar fixo de 1,5 que existia aqui só sobrou como último recurso, pra
// resposta de servidor antigo que não manda escala nenhuma. Ele ERRA em
// margem derivada: lucro 500 sobre receita 100 dá margem 5 (500%), e o limiar
// lia isso como "já está em percentual" e mostrava 5,0% — uma das melhores
// margens da lista virava a pior da tabela.
function screenerFmtPct(v, escala){
  var pct;
  if(escala === "fracao") pct = v * 100;
  else if(escala === "percentual") pct = v;
  else pct = Math.abs(v) <= 1.5 ? v * 100 : v;
  return pct.toFixed(1).replace(".", ",") + "%";
}

function screenerFmtValor(meta, ind){
  if(ind && ind.texto) return ind.texto;
  var v = ind ? ind.valor : null;
  if(v === null || v === undefined) return "—";
  if(meta.fmt === "pct") return screenerFmtPct(v, (ind && ind.escala) || meta.escalaPadrao);
  if(meta.fmt === "mult") return screenerFmtDec(v) + "x";
  return screenerFmtDec(v);
}

// Flag em frase de gente. Desconhecida volta como veio (quem imprime escapa).
function screenerFlagTexto(flag){
  if(!flag) return "";
  var k = scrChaveNorm(flag);
  if(Object.prototype.hasOwnProperty.call(SCREENER_FLAGS, k)) return SCREENER_FLAGS[k];
  return String(flag);
}

// Idade do dado guardado em texto curto pro selo da linha. Arredonda pra baixo
// de propósito: prometer "1h" num dado de 1h59 é mentir a favor do app.
function screenerIdadeTexto(seg){
  if(seg === null || seg === undefined || !isFinite(seg) || seg < 0) return "";
  // Só entra aqui quando a linha está marcada como dado guardado. Nesse caso
  // "agora há pouco" contradiz o próprio aviso de dado velho — e acontece de
  // verdade: o backend converte idade desconhecida (null) em 0. Sem idade
  // confiável, o honesto é dizer "dado guardado" e não inventar um relógio.
  if(seg < 90) return "dado guardado";
  var min = Math.floor(seg / 60);
  if(min < 60) return min + " min atrás";
  var h = Math.floor(min / 60);
  return h + "h atrás";
}

function screenerFmtPontos(n){
  if(n === null || n === undefined) return "—";
  return n === Math.round(n) ? String(n) : n.toFixed(1).replace(".", ",");
}

// Mesmo semáforo que os limites de gasto já usam (renderLimitList): verde bom,
// âmbar em cima da linha, vermelho ruim. Nenhuma cor nova entra no app por
// causa do screener.
function screenerCor(pct){
  return pct >= 70 ? "var(--fs)" : (pct >= 40 ? "var(--fa)" : "var(--fe)");
}

function screenerRotuloPontos(p, max){
  if(p === null || p === undefined || !max) return "";
  var r = p / max;
  if(r >= 0.9) return "ótimo";
  if(r >= 0.7) return "bom";
  if(r >= 0.5) return "na média";
  if(r >= 0.3) return "fraco";
  if(r > 0) return "ruim";
  return "pior faixa";
}

function screenerEhFundo(linha){
  if(linha.tipo === "fii") return true;
  return SCREENER_FUNDOS.indexOf(linha.ticker) >= 0;
}

function screenerLinhaVazia(ticker){
  return {
    ticker: ticker, estado: "pendente", nome: "", preco: null, tipo: "acao",
    ind: {}, score: null, scoreMax: 25, cobertura: null,
    coberturaTotal: SCREENER_INDICADORES.length, aviso: "", erro: null, tokenMissing: false,
    // Por que a nota não saiu (texto do backend) — sem isso a coluna Nota é um
    // traço mudo, e traço mudo o usuário lê como "empresa ruim".
    notaMotivo: "", notaMinimo: null,
    // Nota que a conta de ações daria, guardada só pra explicar por que ela
    // NÃO vale em fundo imobiliário.
    notaBruta: null,
    // Indicadores cuja escala foi decidida pelo conjunto dos 15, não pelo
    // próprio papel (diagnostico.escalaPorLote).
    escalaPorLote: [],
    // Preço/indicador podem vir de dado guardado de até 6 h. Sem marcar isso a
    // tela mistura número de agora com número de 6 h atrás sem avisar.
    cacheStale: false, cacheIdade: null, cacheMotivo: ""
  };
}

// "Token não configurado" é problema de configuração do worker, não da conta
// do usuário — merece tela própria em vez de virar "não consegui carregar".
//
// A checagem por contrato vem PRIMEIRO: o backend responde 503 com
// configurado:false e erro.tipo:'nao_configurado'. A caça a palavra em texto
// continua embaixo só como rede pra servidor antigo — era só ela que existia
// aqui, e ela não enxergava o 503 real (o campo vinha aninhado em "erro"),
// então a tela dedicada era código morto. "token inválido" de propósito não
// cai aqui (exige também uma palavra de ausência).
function screenerTokenAusente(status, body){
  if(!body || typeof body !== "object" || Array.isArray(body)) return false;
  if(body.configurado === false) return true;
  var erroObj = scrCampo(body, ["erro","error"]);
  if(erroObj && typeof erroObj === "object" && !Array.isArray(erroObj)){
    var tipo = scrPick(erroObj, ["tipo","type","codigo","code"]);
    if(typeof tipo === "string" && scrChaveNorm(tipo) === "naoconfigurado") return true;
  }
  var codigo = screenerPrimeiroTexto(body, ["code","codigo","error_code","erro_code"]);
  var msg = screenerPrimeiroTexto(body, ["error","erro","message","mensagem","detail","detalhe","motivo"]);
  var alvo = (codigo + " " + msg).toLowerCase();
  if(alvo.indexOf("brapi_token") >= 0 || alvo.indexOf("token_missing") >= 0 || alvo.indexOf("missing_token") >= 0) return true;
  if(alvo.indexOf("token") < 0) return false;
  return alvo.indexOf("configurad") >= 0 || alvo.indexOf("ausente") >= 0 ||
    alvo.indexOf("faltando") >= 0 || alvo.indexOf("missing") >= 0 || alvo.indexOf("não definido") >= 0;
}

// Lê um indicador aceitando as três formas plausíveis: objeto indexado por
// chave, array de {chave, valor, pontos, faixa}, ou o valor solto no topo da
// resposta. Campo que falta vira null e sai da conta — nunca vira 0, que é a
// pior nota e distorceria o ranking inteiro.
function screenerLeIndicador(fonte, meta, body){
  var bruto;
  if(Array.isArray(fonte)){
    for(var i = 0; i < fonte.length; i++){
      var it = fonte[i];
      if(!it || typeof it !== "object") continue;
      var k = scrPick(it, ["chave","key","id","indicador","nome","name","campo"]);
      if(scrBateChave(k, meta.aliases)){ bruto = it; break; }
    }
  } else if(fonte && typeof fonte === "object"){
    bruto = scrPick(fonte, meta.aliases);
  }
  if(bruto === undefined && body) bruto = scrCampo(body, meta.aliases);
  var ind = {
    valor: null, texto: "", pontos: null, pontosMax: null,
    faixa: "", motivo: "", flag: "", escala: "",
    // achou = "esta fonte tem alguma coisa a dizer sobre este indicador".
    // Diferente de "tem valor": o detalhe de um indicador ausente é justamente
    // a fonte que explica POR QUE ele está ausente.
    achou: false, disponivel: null
  };
  if(bruto === undefined || bruto === null) return ind;
  ind.achou = true;
  if(typeof bruto === "object" && !Array.isArray(bruto)){
    ind.valor = scrNum(scrPick(bruto, ["valor","value","v","num","raw"]));
    var texto = scrPick(bruto, ["texto","formatado","label","fmt","exibicao"]);
    ind.texto = typeof texto === "string" ? texto : "";
    ind.pontos = scrNum(scrPick(bruto, ["pontos","score","points","nota"]));
    ind.pontosMax = scrNum(scrPick(bruto, ["pontosMaximos","pontos_maximos","pontosMax","maxPontos","max"]));
    // "faixa" e "motivo" são coisas DIFERENTES no backend e antes caíam no
    // mesmo campo, com o primeiro apagando o outro: faixa diz em que trecho da
    // régua o valor caiu ("P/L entre 6 e 10"); motivo diz por que o indicador
    // ficou fora da conta ("fundo imobiliário — ROE de empresa não se aplica").
    var faixa = scrPick(bruto, ["faixa","explicacao","descricao","justificativa","criterio","range"]);
    ind.faixa = typeof faixa === "string" ? faixa : "";
    var motivo = scrPick(bruto, ["motivo","razao","porque"]);
    ind.motivo = typeof motivo === "string" ? motivo : "";
    var flag = scrPick(bruto, ["flag","aviso","observacao","alerta"]);
    ind.flag = typeof flag === "string" ? flag : "";
    var escala = scrPick(bruto, ["escala","scale","unidade"]);
    ind.escala = typeof escala === "string" ? escala : "";
    var disp = scrPick(bruto, ["disponivel","available"]);
    if(typeof disp === "boolean") ind.disponivel = disp;
  } else {
    ind.valor = scrNum(bruto);
  }
  return ind;
}

// Transforma a resposta crua de um papel na linha que a tela sabe desenhar.
// Toda a defesa contra formato inesperado mora aqui: a partir daqui o render
// só lida com números, strings e null.
function screenerLinha(ticker, status, body){
  var linha = screenerLinhaVazia(ticker);
  linha.estado = "erro";

  if(screenerTokenAusente(status, body)){
    linha.tokenMissing = true;
    linha.erro = "Chave do provedor de cotações não configurada no servidor.";
    return linha;
  }
  if(status === 401 || status === 403){
    linha.erro = "Acesso negado. Desbloqueie o painel de admin de novo em Configurações.";
    return linha;
  }
  if(status === 429){
    linha.erro = "O provedor limitou as consultas agora. Tente de novo em alguns minutos.";
    return linha;
  }
  if(!body || typeof body !== "object" || Array.isArray(body)){
    // Resposta que não é JSON de objeto normalmente é página de erro de proxy
    // ou rota que ainda não existe — vale dizer isso em vez de "erro".
    linha.erro = status === 200 ? "O servidor respondeu num formato que não sei ler." : ("Não consegui buscar (erro " + status + ").");
    return linha;
  }

  var erroCampo = scrCampo(body, ["error","erro"]);
  var msgErro = screenerPrimeiroTexto(body, ["error","erro","message","mensagem","detail","detalhe","motivo"]);
  var falhou = status !== 200 || body.ok === false || erroCampo === true || (typeof erroCampo === "string" && erroCampo !== "");
  if(falhou){
    linha.erro = msgErro || (status === 200 ? "O servidor não conseguiu buscar este papel." : ("Não consegui buscar (erro " + status + ")."));
    return linha;
  }

  // Casar a resposta com o pedido pelo símbolo, nunca pela ordem de chegada:
  // se vier outro papel, é melhor marcar erro do que exibir o número da VALE3
  // na linha da PETR4 — num app de investimento esse é o pior bug possível.
  var symbol = scrCampo(body, ["symbol","ticker","simbolo","codigo","papel"]);
  if(typeof symbol === "string" && symbol && symbol.toUpperCase() !== ticker.toUpperCase()){
    linha.erro = "O servidor respondeu com outro papel (" + symbol + ").";
    return linha;
  }

  var nome = scrCampo(body, ["shortName","short_name","nome","name","longName","long_name","empresa"]);
  linha.nome = typeof nome === "string" ? nome : "";
  linha.preco = scrNum(scrCampo(body, ["preco","price","regularMarketPrice","preco_atual","precoAtual","cotacao"]));
  var aviso = scrCampo(body, ["aviso","disclaimer","aviso_dados","avisoDados","observacao"]);
  linha.aviso = typeof aviso === "string" ? aviso : "";

  var tipo = scrCampo(body, ["tipo","type","categoria","classe"]);
  if(typeof tipo === "string" && /fii|fundo|fund|imobili/i.test(tipo)) linha.tipo = "fii";

  var fonteScore = scrCampo(body, ["nota","score","pontuacao"]);
  var ehObjScore = fonteScore !== undefined && fonteScore !== null && typeof fonteScore === "object" && !Array.isArray(fonteScore);
  // A LISTA DE DETALHES É A FONTE PRINCIPAL, o objeto chapado é só complemento.
  // Só nota.detalhes traz pontos, faixa, flag e o motivo da ausência — que é
  // exatamente o que o painel "Como a nota foi montada" existe pra mostrar.
  // Lendo body.indicadores primeiro, o painel escrevia cinco vezes "o servidor
  // não mandou os pontos" com a resposta certa na mão.
  var detalhes = ehObjScore ? scrPick(fonteScore, ["detalhes","detalhe","itens","breakdown","componentes"]) : undefined;
  var fonteInd = scrCampo(body, ["indicadores","indicators","metricas","metrics","fundamentos"]);
  if(detalhes === undefined && ehObjScore) detalhes = scrPick(fonteScore, ["indicadores"]);
  if(!fonteInd && !detalhes) fonteInd = scrCampo(body, ["detalhe","detalhes"]);

  if(ehObjScore){
    linha.score = scrNum(scrPick(fonteScore, ["total","valor","score","pontos","nota"]));
  } else {
    linha.score = scrNum(fonteScore);
  }
  if(linha.score === null) linha.score = scrNum(scrCampo(body, ["score_total","scoreTotal","nota_total","notaTotal","pontos"]));
  // "escalaMaxima" é o nome que o backend usa de verdade. Sem ele aqui, o dia
  // em que alguém mexer em SCORE_PESOS a tela passa a dividir por 25 uma nota
  // que vai até 30: barra saturada em 100% e rótulo "27/25".
  var max = scrNum(scrCampo(body, ["escalaMaxima","escala_maxima","scoreMax","score_max","maxScore","notaMax","nota_max","total_possivel"]));
  if(max === null && ehObjScore) max = scrNum(scrPick(fonteScore, ["escalaMaxima","escala_maxima","max","total_possivel","maximo"]));
  if(max !== null && max > 0) linha.scoreMax = max;

  // Por que a nota não saiu, nas palavras do backend.
  if(ehObjScore){
    var motivoNota = scrPick(fonteScore, ["motivo","razao","explicacao"]);
    linha.notaMotivo = typeof motivoNota === "string" ? motivoNota : "";
    linha.notaMinimo = scrNum(scrPick(fonteScore, ["minimoIndicadores","minimo_indicadores","minimo"]));
    // Quanto a conta de AÇÃO daria neste papel. Só serve pra explicar, no
    // detalhe do FII, qual é o número que estamos nos recusando a dar.
    var brutos = scrNum(scrPick(fonteScore, ["pontosBrutos","pontos_brutos"]));
    var maximos = scrNum(scrPick(fonteScore, ["pontosMaximos","pontos_maximos"]));
    if(brutos !== null && maximos !== null && maximos > 0){
      linha.notaBruta = Math.round(brutos / maximos * linha.scoreMax * 10) / 10;
    }
  }

  var disponiveis = 0;
  SCREENER_INDICADORES.forEach(function(meta){
    var ind = screenerLeIndicador(detalhes, meta, null);
    if(!ind.achou){
      ind = screenerLeIndicador(fonteInd, meta, body);
    } else if(ind.valor === null && ind.disponivel !== false){
      // Detalhe existe mas sem o número (formato antigo, ou valor só no objeto
      // chapado): completa o VALOR e mantém pontos/faixa/motivo do detalhe.
      // Quando disponivel === false não completa de propósito — aquele valor é
      // justamente o que a nota DESCARTOU, e exibi-lo faria a coluna mostrar
      // "45,00x" para um indicador que não entrou em conta nenhuma.
      var extra = screenerLeIndicador(fonteInd, meta, body);
      if(extra.valor !== null){ ind.valor = extra.valor; if(!ind.texto) ind.texto = extra.texto; }
    }
    if(!ind.escala) ind.escala = meta.escalaPadrao || "";
    linha.ind[meta.key] = ind;
    if(ind.disponivel === true || (ind.disponivel === null && (ind.valor !== null || ind.pontos !== null))) disponiveis++;
  });

  // Cobertura pode vir como número (4), objeto ({disponiveis, total}) ou texto
  // ("4 de 5"). Se não vier nada, conta na mão o que chegou — dizer quantos
  // indicadores a nota enxergou é o que separa um screener honesto de um que
  // parece preciso e não é.
  //
  // A COBERTURA DA NOTA VEM PRIMEIRO. Recontar aqui a partir do objeto chapado
  // dá o número errado: ele ainda tem o valor que a nota descartou, e a tela
  // dizia "5 de 5, a nota viu tudo" com a nota tendo visto 4.
  var cob = ehObjScore ? scrPick(fonteScore, ["cobertura","coverage","disponiveis"]) : undefined;
  if(cob === undefined) cob = scrCampo(body, ["cobertura","coverage","indicadores_disponiveis"]);
  if(ehObjScore){
    var totalNota = scrNum(scrPick(fonteScore, ["totalIndicadores","total_indicadores"]));
    if(totalNota !== null && totalNota > 0) linha.coberturaTotal = totalNota;
  }
  if(cob !== undefined && typeof cob === "object"){
    linha.cobertura = scrNum(scrPick(cob, ["disponiveis","disponivel","count","n","valor","total"]));
    var totalCob = scrNum(scrPick(cob, ["total","de","max","maximo"]));
    if(totalCob !== null && totalCob > 0) linha.coberturaTotal = totalCob;
  } else if(typeof cob === "string"){
    var m = cob.match(/(\d+)\D+(\d+)/);
    if(m){ linha.cobertura = Number(m[1]); linha.coberturaTotal = Number(m[2]); }
    else linha.cobertura = scrNum(cob);
  } else if(cob !== undefined){
    linha.cobertura = scrNum(cob);
  }
  if(linha.cobertura === null || linha.cobertura === undefined) linha.cobertura = disponiveis;

  // Dado guardado: o servidor serve registro de até 6 h quando a fonte cai ou
  // o limite estoura. Preço velho sem marca, num app de investimento, é pior
  // que preço ausente — o usuário compara papéis achando que é tudo do mesmo
  // instante. O backend estampa a idade justamente pra ela ser mostrada.
  var cache = scrCampo(body, ["cache"]);
  if(cache && typeof cache === "object" && !Array.isArray(cache)){
    linha.cacheStale = scrPick(cache, ["stale","vencido"]) === true;
    linha.cacheIdade = scrNum(scrPick(cache, ["idadeSegundos","idade_segundos","idade","ageSeconds"]));
    var motivoCache = scrPick(cache, ["motivo","razao","reason"]);
    linha.cacheMotivo = typeof motivoCache === "string" ? motivoCache : "";
  }

  // Indicadores cuja escala (fração x percentual) só foi resolvida porque os
  // 15 papéis vieram juntos. A nota é confiável; o usuário só merece saber que
  // a escala foi inferida do conjunto e não confirmada no próprio papel.
  var diag = scrCampo(body, ["diagnostico","diagnostics"]);
  var porLote = diag && typeof diag === "object" ? scrPick(diag, ["escalaPorLote","escala_por_lote"]) : undefined;
  if(Array.isArray(porLote)){
    linha.escalaPorLote = porLote.filter(function(k){ return typeof k === "string"; });
  }

  linha.estado = "ok";
  return linha;
}

// O indicador teve a escala decidida pelo conjunto, e não pelo próprio papel?
function screenerEscalaDoLote(linha, meta){
  var lista = linha.escalaPorLote || [];
  for(var i = 0; i < lista.length; i++){
    if(scrBateChave(lista[i], meta.aliases)) return true;
  }
  return false;
}

// Uma promessa por papel que NUNCA rejeita: um ticker que falha vira linha com
// erro na tabela, e os outros 14 continuam aparecendo.
function screenerBuscaTicker(ticker){
  return fetch("/api/stocks/" + encodeURIComponent(ticker), { headers: adminHeaders() })
    .then(function(r){
      // Lê como texto e faz o parse aqui: se a rota ainda não existir ou um
      // proxy devolver HTML, o r.json() lançaria e derrubaria o lote inteiro.
      return r.text().then(function(t){
        var corpo = null;
        try { corpo = JSON.parse(t); } catch(e){ corpo = null; }
        return { status: r.status, body: corpo };
      });
    })
    .then(function(res){ return screenerLinha(ticker, res.status, res.body); })
    .catch(function(){
      var linha = screenerLinhaVazia(ticker);
      linha.estado = "erro";
      linha.erro = "Falha de conexão.";
      return linha;
    });
}

// Só redesenha se o usuário ainda estiver no screener: as 15 respostas chegam
// espalhadas no tempo e um render() fora da aba recriaria o DOM de outra tela
// no meio de uma digitação (mesmo motivo do isTypingInForm nos loads de fundo).
function screenerRender(){
  if(state.tab === "screener") render();
}

// Transforma a resposta do LOTE nas 15 linhas da tela.
//
// Casa por TICKER, nunca por posição: o servidor pode devolver em outra ordem,
// e trocar a posição faria a linha da PETR4 exibir os números da VALE3 — o
// pior bug possível num app de investimento. Papel da nossa lista que não veio
// vira erro na própria linha; papel que veio e não está na nossa lista entra
// no fim, pra divergência entre as duas listas APARECER em vez de sumir (foi
// exatamente assim que RDOR3 e HAPV3 ficaram meses em vermelho).
function screenerAplicaLote(papeis){
  var porTicker = {};
  for(var i = 0; i < papeis.length; i++){
    var p = papeis[i];
    if(!p || typeof p !== "object") continue;
    var t = scrCampo(p, ["ticker","symbol","simbolo","codigo","papel"]);
    // Mesmo formato que o backend exige na allowlist dele. Não é defesa contra
    // XSS (todo ticker sai escapado), é defesa de layout: um "ticker" de 5 mil
    // caracteres viraria uma linha que empurra a tabela inteira pra fora.
    if(typeof t !== "string" || !/^[A-Z0-9]{4,6}$/.test(t.toUpperCase())) continue;
    porTicker[t.toUpperCase()] = p;
  }

  var linhas = SCREENER_TICKERS.map(function(ticker){
    if(!Object.prototype.hasOwnProperty.call(porTicker, ticker)){
      var vazia = screenerLinhaVazia(ticker);
      vazia.estado = "erro";
      vazia.erro = "O servidor não devolveu este papel na lista.";
      return vazia;
    }
    var corpo = porTicker[ticker];
    delete porTicker[ticker];
    // status 200 porque o lote já respondeu 200: o que diz se este papel deu
    // certo é o ok/erro DELE, e screenerLinha já sabe ler os dois.
    return screenerLinha(ticker, 200, corpo);
  });

  Object.keys(porTicker).forEach(function(extra){
    linhas.push(screenerLinha(extra, 200, porTicker[extra]));
  });
  return linhas;
}

// Uma chamada só, em GET /api/stocks. NUNCA rejeita: devolve o que deu.
function screenerBuscaLote(){
  return fetch("/api/stocks", { headers: adminHeaders() })
    .then(function(r){
      // Texto + parse na mão: rota inexistente ou proxy devolvendo HTML faria
      // r.json() lançar e derrubar a tela inteira.
      return r.text().then(function(t){
        var corpo = null;
        try { corpo = JSON.parse(t); } catch(e){ corpo = null; }
        return { status: r.status, body: corpo };
      });
    })
    .catch(function(){ return { status: 0, body: null }; });
}

// Carrega a lista inteira numa requisição só.
//
// O motivo é de CORREÇÃO, não de desempenho: a escala fração-vs-percentual da
// fonte não tem como ser resolvida com um papel só na mão. Com os 15 juntos, a
// mediana de cada campo decide a escala; papel a papel, três indicadores caem
// por "escala ambígua" e a maioria da lista fica SEM NOTA. Por isso a rota de
// lote é o caminho normal, e a busca papel a papel só sobra como fallback pra
// servidor publicado antes dela existir.
function loadScreener(){
  if(state.screenerLoading) return;
  state.screenerLoading = true;
  state.screenerError = null;
  state.screenerTokenMissing = false;
  // Mesmo sendo uma chamada só, o estado de progresso continua: a resposta
  // demora os mesmos segundos (são 15 cotações do outro lado) e tela parada
  // sem nada escrito é indistinguível de tela quebrada.
  state.screenerProgress = { feitos: 0, total: SCREENER_TICKERS.length, lote: true };
  state.screenerData = SCREENER_TICKERS.map(function(t){ return screenerLinhaVazia(t); });
  screenerRender();

  screenerBuscaLote().then(function(res){
    var body = res.body;

    // Servidor publicado sem a rota de lote: cai pro caminho antigo em vez de
    // deixar a tela vazia.
    if(res.status === 404 || res.status === 405){
      state.screenerProgress = { feitos: 0, total: SCREENER_TICKERS.length, lote: false };
      screenerRender();
      screenerCarregaUmPorUm();
      return;
    }

    if(screenerTokenAusente(res.status, body)){
      state.screenerTokenMissing = true;
      state.screenerLoading = false;
      state.screenerProgress = null;
      screenerRender();
      return;
    }

    var papeis = body && typeof body === "object" ? scrCampo(body, ["papeis","papéis","itens","resultados","acoes","lista"]) : undefined;
    if(res.status !== 200 || !body || typeof body !== "object" || body.ok === false || !Array.isArray(papeis)){
      // Preferir SEMPRE a frase que o backend escreveu: ela diz o que fazer
      // ("os indicadores completos precisam de um plano de dados que ainda não
      // temos"), e "erro 503" não diz nada.
      var msg = body && typeof body === "object" ? screenerPrimeiroTexto(body, ["erro","error","message","mensagem","detail","detalhe","motivo"]) : "";
      // 401/403 é sessão de admin vencida, não falha de mercado: o texto do
      // servidor ("unauthorized") não diz ao usuário o que fazer.
      if(res.status === 401 || res.status === 403) msg = "Acesso negado. Desbloqueie o painel de admin de novo em Configurações.";
      else if(res.status === 429 && !msg) msg = "O provedor limitou as consultas agora. Tente de novo em alguns minutos.";
      if(!msg && res.status === 0) msg = "Falha de conexão ao buscar a lista.";
      if(!msg && res.status === 200) msg = "O servidor respondeu num formato que não sei ler.";
      if(!msg) msg = "Não consegui carregar a lista (erro " + res.status + ").";
      state.screenerError = msg;
      state.screenerData = null;
      state.screenerLoading = false;
      state.screenerProgress = null;
      screenerRender();
      return;
    }

    // Um papel que falhou não derruba os outros: cada um vira a sua linha, com
    // erro ou com número.
    state.screenerData = screenerAplicaLote(papeis);
    var falhas = 0;
    state.screenerData.forEach(function(l){
      if(l.tokenMissing) state.screenerTokenMissing = true;
      if(l.erro) falhas++;
    });
    state.screenerLoading = false;
    state.screenerProgress = null;
    if(state.screenerData.length && falhas >= state.screenerData.length && !state.screenerTokenMissing){
      state.screenerError = "Nenhum papel carregou. Pode ser o provedor de cotações fora do ar.";
    }
    screenerRender();
  }).catch(function(e){
    // .catch OBRIGATÓRIO: screenerLoading só era desligado dentro do .then, e o
    // callback chama render(), que redesenha o APP INTEIRO — uma exceção em
    // QUALQUER outra tela deixaria o screener preso em "carregando" até
    // recarregar a página. É exatamente o bug que já travou o botão de código
    // do WhatsApp em "Gerando código…".
    state.screenerLoading = false;
    state.screenerProgress = null;
    state.screenerError = "Algo quebrou ao montar a tela: " + ((e && e.message) || e);
    screenerRender();
  });
}

// FALLBACK: um papel por requisição, em lotes de SCREENER_LOTE. Só roda quando
// GET /api/stocks não existe no servidor publicado. Sem a visão do conjunto, a
// escala de dy/roe/margem pode ficar ambígua e vários papéis saem sem nota —
// é o preço de rodar contra um deploy antigo, e o motivo aparece na coluna.
function screenerCarregaUmPorUm(){
  var proximo = 0;
  var feitos = 0;
  var falhas = 0;

  function dispara(){
    if(proximo >= SCREENER_TICKERS.length) return;
    var indice = proximo;
    proximo++;
    screenerBuscaTicker(SCREENER_TICKERS[indice]).then(function(linha){
      // Grava pelo índice do pedido, não pela ordem de chegada: os lotes
      // terminam fora de ordem e trocar a posição faria uma linha exibir os
      // números de outro papel.
      if(state.screenerData && state.screenerData[indice]) state.screenerData[indice] = linha;
      if(linha.tokenMissing) state.screenerTokenMissing = true;
      if(linha.erro) falhas++;
      feitos++;
      if(state.screenerProgress) state.screenerProgress.feitos = feitos;
      if(feitos >= SCREENER_TICKERS.length){
        state.screenerLoading = false;
        state.screenerProgress = null;
        if(falhas >= SCREENER_TICKERS.length && !state.screenerTokenMissing){
          state.screenerError = "Nenhum papel carregou. Pode ser o provedor de cotações fora do ar ou a rota /api/stocks ainda não estar publicada.";
        }
      }
      screenerRender();
      dispara();
    });
  }

  var lote = Math.min(SCREENER_LOTE, SCREENER_TICKERS.length);
  for(var i = 0; i < lote; i++) dispara();
}

function screenerValorOrdenacao(linha, chave){
  if(chave === "preco") return linha.preco;
  if(chave === "score") return screenerEhFundo(linha) ? null : linha.score;
  var ind = linha.ind && linha.ind[chave];
  return ind ? ind.valor : null;
}

function screenerCompara(a, b){
  var chave = state.screenerSort;
  var dir = state.screenerSortDir === "asc" ? 1 : -1;
  if(chave === "ticker"){
    return a.ticker < b.ticker ? -dir : (a.ticker > b.ticker ? dir : 0);
  }
  var va = screenerValorOrdenacao(a, chave);
  var vb = screenerValorOrdenacao(b, chave);
  // Linha sem o dado vai sempre pro fim, nos dois sentidos: ordenar por P/L
  // não pode fazer quem não tem P/L "ganhar" o topo só por estar vazio.
  if(va === null && vb === null) return a.ticker < b.ticker ? -1 : 1;
  if(va === null) return 1;
  if(vb === null) return -1;
  return va < vb ? -dir : (va > vb ? dir : 0);
}

// Escala máxima da nota vinda do servidor. Lê a primeira linha que de fato tem
// nota: linhas[0] muda com a ordenação e uma linha de erro nunca chega a ler
// nota.escalaMaxima — nasce com o padrão 25 e faria o cabeçalho mentir se os
// pesos mudassem.
function screenerEscalaMaxima(linhas){
  for(var i = 0; i < (linhas || []).length; i++){
    if(linhas[i] && linhas[i].score !== null && linhas[i].score !== undefined && linhas[i].scoreMax) return linhas[i].scoreMax;
  }
  return (linhas && linhas[0] && linhas[0].scoreMax) || 25;
}

function screenerOrdenarPor(chave){
  var col = null;
  for(var i = 0; i < SCREENER_COLS.length; i++){
    if(SCREENER_COLS[i].key === chave) col = SCREENER_COLS[i];
  }
  if(!col) return;
  if(state.screenerSort === chave){
    state.screenerSortDir = state.screenerSortDir === "asc" ? "desc" : "asc";
  } else {
    state.screenerSort = chave;
    state.screenerSortDir = col.dir;
  }
  render();
}

function screenerAlternarDetalhe(ticker){
  state.screenerExpandedTicker = state.screenerExpandedTicker === ticker ? null : ticker;
  render();
}

function screenerAvisosHtml(){
  return '<div class="scr-note"><b>De onde vêm esses números:</b> são dados públicos de mercado da B3, buscados num provedor de cotações. Não têm nenhuma relação com o Open Finance nem com a sua conta bancária — o Finn não olha o seu dinheiro para montar esta lista.</div>' +
    '<div class="scr-note"><b>Isto é apoio, não é recomendação:</b> a nota é uma conta simples em cima de 5 indicadores públicos. Serve para você comparar papéis e saber o que pesquisar — não para decidir por você. Nada aqui é indicação de compra ou venda.</div>';
}

// Resumo curto de por que a nota não saiu, pra caber na célula. O texto
// completo do backend fica no detalhe — aqui só o suficiente pra separar
// "faltou dado" de "empresa ruim".
function screenerMotivoCurto(linha){
  // Cobertura incompleta é o caso comum e o mais informativo. Só vale quando
  // é MENOR que o total: escrever "só 5 de 5" seria confissão de que a tela
  // não sabe o motivo, disfarçada de explicação.
  if(linha.cobertura !== null && linha.cobertura !== undefined &&
     linha.coberturaTotal && linha.cobertura < linha.coberturaTotal){
    var falta = linha.notaMinimo !== null && linha.notaMinimo !== undefined ? (" (mínimo " + screenerFmtPontos(linha.notaMinimo) + ")") : "";
    return "só " + screenerFmtPontos(linha.cobertura) + " de " + screenerFmtPontos(linha.coberturaTotal) + " indicadores" + falta;
  }
  return linha.notaMotivo || "";
}

function screenerScoreHtml(linha){
  if(screenerEhFundo(linha)){
    return '<span class="scr-na" style="font-size:11.5px;font-weight:700">sem nota</span>' +
      '<div class="scr-name">fundo imobiliário</div>';
  }
  // Traço seco é a pior resposta possível: num screener o usuário lê "—" como
  // "empresa ruim" ou "app quebrado". O backend escreve o motivo em português
  // (nota.motivo) — mesmo padrão que o FII já usa logo acima.
  if(linha.score === null){
    var curto = screenerMotivoCurto(linha);
    // Sem nenhuma explicação vinda do servidor, o traço seco continua sendo a
    // resposta honesta — inventar um motivo seria pior que não dizer nada.
    if(!curto) return '<span class="scr-na">—</span>';
    return '<span class="scr-na" style="font-size:11.5px;font-weight:700">sem nota</span>' +
      '<div class="scr-name" title="' + escapeHtml(linha.notaMotivo || curto) + '">' + escapeHtml(curto) + '</div>';
  }
  var max = linha.scoreMax > 0 ? linha.scoreMax : 25;
  var pct = Math.max(0, Math.min(100, Math.round(linha.score / max * 100)));
  return '<span class="scr-scoreval">' + screenerFmtPontos(linha.score) + '/' + screenerFmtPontos(max) + '</span>' +
    '<div class="bar"><i style="width:' + Math.max(3, pct) + '%;background:' + screenerCor(pct) + '"></i></div>';
}

function screenerDetalheHtml(linha){
  if(linha.estado === "erro"){
    return '<div class="ai-error" style="margin-top:12px">' + escapeHtml(linha.erro || "Não consegui buscar este papel.") + '</div>';
  }
  if(linha.estado !== "ok"){
    return '<div class="scr-det-cob">Buscando os dados deste papel…</div>';
  }
  // Divisão igual só vale enquanto todos os indicadores pesam o mesmo. Quando
  // o backend manda pontosMaximos por indicador (que é o caso), é ele que
  // manda — senão um peso diferente faria a barra e o rótulo mentirem.
  var maxPadrao = (linha.scoreMax > 0 ? linha.scoreMax : 25) / SCREENER_INDICADORES.length;
  var html = '<div class="import-summary" style="margin-top:12px">Como a nota foi montada</div>';

  if(screenerEhFundo(linha)){
    html += '<div class="scr-note" style="margin-top:0"><b>Isto é um fundo imobiliário, não uma empresa.</b> Fundo não tem P/L, ROE nem margem no sentido de uma companhia: ele quase não tem dívida e a margem dele é perto de 100% por construção. Aplicar a nota de ações aqui daria pontuação alta de graça, por dois indicadores que o fundo ganha sem mérito nenhum. Por isso não damos nota — olhe o dividend yield e, quando existir, o P/VP.' +
      // O número existe (o backend calcula e só depois se recusa a publicá-lo
      // como nota) e mostrá-lo é o ponto: é ele que não vale.
      // NÃO exibir aqui uma "nota que daria": num FII, roe/margem/dívida são
      // zerados pelo backend, então a conta sobraria em cima de P/L e DY —
      // exatamente os dois que NÃO inflam a nota de fundo. Seria um número
      // fabricado numa tela de investimento, e contradiz o motivo de o fundo
      // não receber nota. O honesto é mostrar os indicadores e parar aí.
      '' +
    '</div>';
  } else if(linha.score === null && linha.notaMotivo){
    // Sem nota, o detalhe é o lugar de dizer o porquê por extenso.
    html += '<div class="scr-note neutro" style="margin-top:0"><b>Sem nota neste papel.</b> ' + escapeHtml(linha.notaMotivo) + '</div>';
  }

  SCREENER_INDICADORES.forEach(function(meta){
    var ind = linha.ind[meta.key] || {};
    var temPontos = ind.pontos !== null && ind.pontos !== undefined;
    var maxInd = (ind.pontosMax !== null && ind.pontosMax !== undefined && ind.pontosMax > 0) ? ind.pontosMax : maxPadrao;
    var pct = temPontos && maxInd > 0 ? Math.max(0, Math.min(100, Math.round(ind.pontos / maxInd * 100))) : 0;
    var porque;
    if(temPontos){
      porque = screenerFmtPontos(ind.pontos) + " de " + screenerFmtPontos(maxInd) + " pontos (" + screenerRotuloPontos(ind.pontos, maxInd) + ")";
      if(ind.faixa) porque += " · " + ind.faixa;
    } else if(ind.motivo){
      // O motivo do backend é o que separa "faltou dado" de "não se aplica a
      // este setor" — a frase mais útil do painel inteiro.
      porque = "Fora da conta da nota: " + ind.motivo;
    } else if(ind.valor === null || ind.valor === undefined){
      porque = "Sem dado — este indicador fica fora da conta da nota.";
    } else {
      porque = "O servidor não mandou os pontos deste indicador.";
    }
    if(ind.flag) porque += " · Atenção: " + screenerFlagTexto(ind.flag);
    // Discreto de propósito: a nota é confiável, isto só registra que a escala
    // saiu da mediana dos 15 e não foi confirmada no próprio papel.
    // Só quando o indicador TEM valor: o aviso de escala num indicador sem dado
    // ("fica fora da conta da nota · escala lida do conjunto…") é contraditório —
    // não há valor nenhum cuja escala tenha sido lida.
    if(ind.valor !== null && ind.valor !== undefined && screenerEscalaDoLote(linha, meta)) porque += " · escala lida do conjunto dos papéis, não deste papel sozinho.";
    html += '<div class="scr-det-item">' +
      '<div class="scr-det-head"><span class="scr-det-name">' + escapeHtml(meta.label) + '</span>' +
        '<span class="scr-det-val">' + escapeHtml(screenerFmtValor(meta, ind)) + '</span></div>' +
      '<div class="bar"><i style="width:' + (temPontos ? Math.max(3, pct) : 0) + '%;background:' + (temPontos ? screenerCor(pct) : "var(--fb)") + '"></i></div>' +
      '<div class="scr-det-why">' + escapeHtml(porque) + '</div>' +
      '<div class="scr-det-hint">' + escapeHtml(meta.leitura) + '</div>' +
    '</div>';
  });

  var cob = linha.cobertura === null ? 0 : linha.cobertura;
  html += '<div class="scr-det-cob">Cobertura: ' + escapeHtml(screenerFmtPontos(cob)) + ' de ' + escapeHtml(screenerFmtPontos(linha.coberturaTotal)) + ' indicadores entraram na conta. ' +
    (cob >= linha.coberturaTotal ? 'A nota viu tudo.' : 'O que faltou fica fora da conta — não conta como zero, mas a nota enxergou menos coisa.') + '</div>';

  if(linha.cacheStale){
    var idade = screenerIdadeTexto(linha.cacheIdade);
    html += '<div class="scr-note neutro"><b>Este número não é do momento.</b> É o último dado guardado' +
      (idade ? ', de ' + escapeHtml(idade) : '') + '.' +
      (linha.cacheMotivo ? ' Motivo: ' + escapeHtml(linha.cacheMotivo) + '.' : '') + '</div>';
  }

  if(linha.aviso) html += '<div class="scr-note neutro">' + escapeHtml(linha.aviso) + '</div>';
  return html;
}

function screenerTagHtml(linha){
  var tags = screenerEhFundo(linha) ? '<span class="scr-tag fundo">FII</span>' : "";
  // Preço de dado guardado (até 6 h) desenhado igual a preço de agora faz o
  // usuário comparar papéis achando que é tudo do mesmo instante. O selo com a
  // idade é o mínimo — o motivo completo fica no detalhe.
  if(linha.cacheStale){
    var idade = screenerIdadeTexto(linha.cacheIdade);
    tags += '<span class="scr-tag" title="' + escapeHtml(linha.cacheMotivo || "último dado guardado") + '">' +
      escapeHtml(idade || "dado guardado") + '</span>';
  }
  return tags;
}

function screenerTabelaHtml(linhas){
  var cabecalho = SCREENER_COLS.map(function(c){
    var ativa = state.screenerSort === c.key;
    return '<th class="' + (c.num ? "num" : "") + (ativa ? " on" : "") + '" data-scrsort="' + escapeHtml(c.key) + '">' +
      escapeHtml(c.label) +
      (ativa ? '<span class="scr-arrow">' + (state.screenerSortDir === "asc" ? "▲" : "▼") + '</span>' : '') +
    '</th>';
  }).join("");

  var corpo = linhas.map(function(l){
    var aberta = state.screenerExpandedTicker === l.ticker;
    var celulaPapel = '<td><span class="scr-tick">' + escapeHtml(l.ticker) + '</span>' + screenerTagHtml(l) +
      (l.nome ? '<div class="scr-name">' + escapeHtml(l.nome) + '</div>' : '') + '</td>';
    var tr = '<tr class="scr-row' + (aberta ? " on" : "") + '" data-scrticker="' + escapeHtml(l.ticker) + '">' + celulaPapel;
    if(l.estado === "erro"){
      tr += '<td class="scr-erro" colspan="' + (SCREENER_COLS.length - 1) + '">' + escapeHtml(l.erro || "Não consegui buscar este papel.") + '</td>';
    } else if(l.estado !== "ok"){
      tr += '<td class="scr-na" colspan="' + (SCREENER_COLS.length - 1) + '">buscando…</td>';
    } else {
      tr += '<td class="num">' + (l.preco === null ? '<span class="scr-na">—</span>' : escapeHtml(fmtMoney(l.preco))) + '</td>';
      SCREENER_INDICADORES.forEach(function(meta){
        var ind = l.ind[meta.key] || {};
        var texto = screenerFmtValor(meta, ind);
        tr += '<td class="num' + (texto === "—" ? " scr-na" : "") + '">' + escapeHtml(texto) + '</td>';
      });
      tr += '<td class="num scr-scorewrap">' + screenerScoreHtml(l) + '</td>';
    }
    tr += '</tr>';
    if(aberta){
      tr += '<tr class="scr-detrow"><td colspan="' + SCREENER_COLS.length + '">' + screenerDetalheHtml(l) + '</td></tr>';
    }
    return tr;
  }).join("");

  return '<table class="scr-table"><thead><tr>' + cabecalho + '</tr></thead><tbody>' + corpo + '</tbody></table>';
}

    } else if(l.estado !== "ok"){

      h += '<div class="scr-card-grid">' + SCREENER_INDICADORES.map(function(meta){

function renderScreener(){
  if(!isMasterUser() || !state.adminUnlocked) return "";

  var html = '<div class="card">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:2px">' +
      '<div class="eyebrow" style="margin:0">Screener de ações</div>' +
      '<button type="button" class="btn-ghost" id="btnScreenerRefresh" style="padding:6px 12px;font-size:11.5px"' + (state.screenerLoading ? " disabled" : "") + '>' + (state.screenerLoading ? "Atualizando…" : "Atualizar agora") + '</button>' +
    '</div>' +
    '<div style="font-size:11.5px;color:var(--fm)">' + SCREENER_TICKERS.length + ' papéis da B3. Toque num papel para ver de onde saiu cada ponto da nota.</div>' +
    screenerAvisosHtml() +
  '</div>';

  if(state.screenerProgress){
    var feitos = state.screenerProgress.feitos;
    var total = state.screenerProgress.total;
    // No caminho de lote é uma requisição só: não há "N de 15" honesto pra
    // mostrar, e inventar um contador que anda sozinho seria pior que dizer a
    // verdade. A barra fica indeterminada (um terço) só pra tela não parecer
    // travada — são segundos de espera.
    var emLote = state.screenerProgress.lote === true;
    var pctProg = emLote ? 33 : (total > 0 ? Math.round(feitos / total * 100) : 0);
    html += '<div class="card">' +
      '<div class="scr-progress">' + (emLote ? ('Carregando os ' + total + ' papéis numa consulta só…') : ('Carregando ' + feitos + ' de ' + total + ' papéis…')) + '</div>' +
      '<div class="bar"><i style="width:' + Math.max(3, pctProg) + '%"></i></div>' +
    '</div>';
  }

  // Sem a chave do provedor nenhum papel carrega, então mostrar a tabela toda
  // vermelha só repetiria 15 vezes o mesmo recado.
  if(state.screenerTokenMissing){
    html += '<div class="card"><div class="eyebrow">Falta configurar o BRAPI_TOKEN</div>' +
      '<div class="ai-error" style="margin-top:0">O servidor respondeu que a chave do provedor de cotações não está configurada. Sem ela não dá pra buscar preço nem indicador nenhum.</div>' +
      '<div style="font-size:12px;color:var(--fm);margin-top:10px">Isso é configuração do worker (finn-serve), não é problema da sua conta: cadastre o segredo <b>BRAPI_TOKEN</b> e tente de novo.</div>' +
      '<button type="button" class="btn-submit" id="btnScreenerRetry" style="margin-top:10px">Tentar de novo</button></div>';
    return html;
  }

  if(!state.screenerData){
    if(state.screenerError){
      html += '<div class="card"><div class="ai-error" style="margin-top:0">' + escapeHtml(state.screenerError) + '</div>' +
        '<button type="button" class="btn-submit" id="btnScreenerRetry" style="margin-top:10px">Tentar de novo</button></div>';
    } else {
      html += '<div class="card"><div style="font-size:12.5px;color:var(--fm);margin-bottom:10px">Uma consulta só, com os ' + SCREENER_TICKERS.length + ' papéis juntos — carrega em poucos segundos. Vir tudo junto não é detalhe de velocidade: é o que permite decidir a escala de cada indicador comparando os papéis entre si.</div>' +
        '<button type="button" class="btn-submit" id="btnScreenerLoad">Carregar screener</button></div>';
    }
    return html;
  }

  if(!state.screenerData.length){
    html += '<div class="card"><div class="empty-state">Nenhum papel na lista do screener.</div></div>';
    return html;
  }

  // Erro global (nenhum papel carregou) aparece acima da tabela, mas não
  // substitui a tela: a linha de cada papel ainda diz o que aconteceu com ele.
  if(state.screenerError){
    html += '<div class="card"><div class="ai-error" style="margin-top:0">' + escapeHtml(state.screenerError) + '</div>' +
      '<button type="button" class="btn-submit" id="btnScreenerRetry" style="margin-top:10px">Tentar de novo</button></div>';
  }

  var linhas = state.screenerData.slice().sort(screenerCompara);
  var temFundo = false;
  var temVelho = false;
  linhas.forEach(function(l){
    if(screenerEhFundo(l)) temFundo = true;
    if(l.cacheStale) temVelho = true;
  });

  html += '<div class="card">' +
    '<p style="font-size:14px;font-weight:800;margin:0 0 2px">Comparativo</p>' +
    '<p style="font-size:12px;color:var(--fm);margin:0 0 12px">Nota de 0 a ' + escapeHtml(screenerFmtPontos(screenerEscalaMaxima(linhas))) + ', somando 5 indicadores. Toque no papel para abrir o detalhe.</p>' +
    // Aviso de dado velho ANTES da tabela: depois dela o usuário já comparou.
    (temVelho ? '<div class="scr-note neutro" style="margin-top:0;margin-bottom:12px"><b>Parte destes números não é do momento.</b> Os papéis marcados com a idade ao lado do código vêm do último dado guardado — a fonte de cotações não respondeu agora. Abra o papel para ver o motivo.</div>' : '') +
    screenerSortbarHtml() +
    '<div class="scr-tablewrap">' + screenerTabelaHtml(linhas) + '</div>' +
    screenerCardsHtml(linhas) +
    (temFundo ? '<div class="scr-note neutro"><b>Sobre os FII da lista:</b> MXRF11 e HGLG11 são fundos imobiliários e aparecem sem nota de propósito. Não é nota baixa — é que P/L, ROE e margem não querem dizer nada num fundo, e a conta de ações premiaria os dois de graça por não terem dívida. Para fundo, olhe o dividend yield.</div>' : '') +
    // O aviso completo está no topo da aba, a 200px de rolagem no celular —
    // e é aqui, ao lado das barras coloridas, que a tela mais parece dar uma
    // indicação. Por isso a versão curta se repete junto da nota.
    '<div class="scr-note"><b>Nota é comparação, não indicação:</b> ela ordena papéis por 5 indicadores públicos e não diz nada sobre comprar ou vender.</div>' +
  '</div>';

  return html;
}

// Exclui só os lançamentos DE UM MÊS — pedido explícito, porque antes só
// existia apagar um lançamento por vez ou "Excluir todos" (Configurações,
// função abaixo). Mesmo padrão de dupla confirmação da exclusão total.
//
// Filtra pelos IDS já carregados no cliente, não por intervalo de data no
// servidor: db() usa URLSearchParams.set(), que só guarda UM valor por
// chave — "date gte X" e "date lt Y" na mesma chave "date" se
// sobrescreveriam. Com os ids em mãos (state.txs já tem o mês inteiro
// carregado), um filtro id=in.(...) resolve com uma chave só.
function deleteMonthTransactions(ym){
  var alvo = txsOfMonth(ym);
  if(!alvo.length) return;
  var label = ym.split("-").reverse().join("/");
  if(!window.confirm("Isso vai apagar os " + alvo.length + " lançamento(s) de " + label + " (receitas e despesas). Essa ação não pode ser desfeita. Continuar?")) return;
  if(!window.confirm("Tem certeza mesmo? Não tem como recuperar depois.")) return;
  var ids = alvo.map(function(t){ return t.id; });
  var receiptPaths = alvo.map(function(t){ return t.receipt_path; }).filter(Boolean);
  // Fatiado em lotes: os ids vao na QUERY STRING, e o URLSearchParams
  // percent-encoda cada virgula (%2C), dando ~39 bytes por lancamento. Quem
  // importa o extrato do banco fecha o mes com centenas de lancamentos — 250
  // ja passam de 10 KB de URL e o gateway do Supabase devolve 414 antes de
  // chegar no PostgREST. Ou seja: justamente quem mais precisa do "excluir o
  // mes" era quem nao conseguia usar.
  var LOTE = 100;
  var lotes = [];
  for(var i = 0; i < ids.length; i += LOTE) lotes.push(ids.slice(i, i + LOTE));
  lotes.reduce(function(cadeia, lote){
    return cadeia.then(function(){
      return db("transactions", "DELETE", null, { id: "in.(" + lote.join(",") + ")", user_id: "eq." + uid() });
    });
  }, Promise.resolve()).then(function(){
    state.txs = state.txs.filter(function(t){ return ids.indexOf(t.id) === -1; });
    state.txSaveError = null;
    render();
    receiptPaths.forEach(deleteReceiptObject);
  }).catch(function(err){
    state.txSaveError = "Não consegui apagar os lançamentos de " + label + " (" + (err && err.message ? err.message : "erro") + "). Tenta de novo.";
    render();
  });
}

  if(!window.confirm("Tem certeza mesmo? Não tem como recuperar depois.")) return;

/* ── render dispatch ── */
var lastRenderedTab = null;
function render(){
  document.querySelectorAll(".tab-btn").forEach(function(btn){
    btn.classList.toggle("active", btn.dataset.tab === state.tab);
  });
  // No modo admin as abas de finança pessoal saem do menu — a conta master
  // está ali pra gerir o produto, não pra lançar o próprio mercado. O botão
  // "Voltar pro Finn normal" traz tudo de volta.
  var emAdmin = adminModeAtivo();
  document.querySelectorAll(".nav-menu .tab-btn").forEach(function(btn){
    btn.style.display = emAdmin ? "none" : "";
  });
  // As telas de gestão só aparecem no modo admin (antes bastava estar
  // desbloqueado, e elas ficavam penduradas no menu normal).
  ["btnAdminHomeNav","btnAdminAnalyticsNav","btnScreenerNav","btnBetaAdminNav","btnMetaAdsNav","btnConteudoNav"].forEach(function(id){
    var b = document.getElementById(id);
    if(b) b.style.display = emAdmin ? "" : "none";
  });
  // O botão de alternar aparece pra master desbloqueada nos DOIS modos —
  // é a única porta de entrada e de saída.
  var btnToggleAdminMode = document.getElementById("btnToggleAdminMode");
  if(btnToggleAdminMode){
    var podeAlternar = isMasterUser() && state.adminUnlocked;
    btnToggleAdminMode.style.display = podeAlternar ? "" : "none";
    btnToggleAdminMode.textContent = emAdmin ? "Voltar pro Finn normal" : "Ir pro modo admin";
  }
  var btnGuiaNav = document.getElementById("btnGuiaNav");
  if(btnGuiaNav) btnGuiaNav.style.display = emAdmin ? "none" : "";
  var content = document.getElementById("content");
  if(state.loading){
    content.innerHTML = '<div class="empty-state">Carregando…</div>';
    return;
  }
  if(state.loadError){
    content.innerHTML = '<div class="card"><div class="ai-error">Não consegui carregar seus dados (' + escapeHtml(state.loadError) + ').</div>' +
      '<button type="button" class="btn-submit" id="btnRetryLoad" style="margin-top:10px">Tentar de novo</button></div>';
    var retry = document.getElementById("btnRetryLoad");
    if(retry) retry.addEventListener("click", function(){ loadData(); });
    return;
  }
  // Só reanima a troca de tela quando a aba muda de verdade — se animasse a
  // cada render() (também disparado por editar um lançamento, marcar uma
  // categoria etc.), o conteúdo ficaria piscando de opacidade a cada clique
  // dentro da mesma aba, que é o oposto de "mais leve".
  var tabChanged = state.tab !== lastRenderedTab;
  lastRenderedTab = state.tab;
  if(state.tab === "dashboard") content.innerHTML = renderDashboard();
  else if(state.tab === "adicionar") content.innerHTML = renderAdicionar();
  else if(state.tab === "analises") content.innerHTML = renderAnalises();
  else if(state.tab === "lancamentos") content.innerHTML = renderLancamentos();
  else if(state.tab === "limites") content.innerHTML = renderLimites();
  else if(state.tab === "metas") content.innerHTML = renderMetas();
  else if(state.tab === "fixas") content.innerHTML = renderFixas();
  else if(state.tab === "cartoes") content.innerHTML = renderCartoes();
  else if(state.tab === "dividas") content.innerHTML = renderDividas();
  else if(state.tab === "racha") content.innerHTML = renderRacha();
  else if(state.tab === "ia") content.innerHTML = renderIA();
  else if(state.tab === "adminHome") content.innerHTML = renderAdminHome();
  else if(state.tab === "conteudo") content.innerHTML = renderConteudo();
  else if(state.tab === "adminAnalytics") content.innerHTML = renderAdminAnalytics();
  else if(state.tab === "screener") content.innerHTML = renderScreener();
  else if(state.tab === "adminBeta") content.innerHTML = renderAdminBeta();
  else if(state.tab === "metaAds") content.innerHTML = renderMetaAds();
  else content.innerHTML = renderConfig();
  if(tabChanged){
    window.scrollTo(0, 0);
    content.classList.remove("view-enter");
    void content.offsetWidth;
    content.classList.add("view-enter");
  }
  bindContentEvents();
}

function bindTxRowEvents(scope){
  scope.querySelectorAll("[data-edit]").forEach(function(btn){
    btn.addEventListener("click", function(){ startEdit(btn.dataset.edit); });
  });
  scope.querySelectorAll("[data-del]").forEach(function(btn){

  });
  scope.querySelectorAll("[data-receipt-trigger]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = btn.dataset.receiptTrigger;
      var t = state.txs.filter(function(x){ return x.id === id; })[0];
      if(t && t.receipt_path){
        viewReceipt(t.receipt_path);
      } else {
        var input = scope.querySelector('[data-receipt-input="' + id + '"]');
        if(input) input.click();
      }
    });
  });
  scope.querySelectorAll("[data-receipt-input]").forEach(function(input){
    input.addEventListener("change", function(){
      var file = input.files[0];
      if(file) uploadReceipt(file, input.dataset.receiptInput);
    });
  });
}

/* ── transaction CRUD ── */
function saveTransaction(){
  var value = parseFloat(formState.value);
  // Chama render() mesmo saindo cedo — sem isso, o botão desabilitado no
  // clique (pra evitar duplo-envio) ficava travado pra sempre num valor
  // inválido, já que nenhum outro render() aconteceria depois.
  if(!value || value <= 0){ render(); return; }
  var fields = {
    type: formState.type,
    category: formState.category,
    description: formState.description || formState.category,
    value: value,
    date: formState.date
  };
  if(state.cards.length) fields.card_id = formState.type === "despesa" ? (formState.cardId || null) : null;
  state.txSaveError = null;
  if(formState.editingId){
    var id = formState.editingId;
    var original = state.txs.filter(function(t){ return t.id === id; })[0];
    var categoryChanged = original && original.category !== fields.category;
    db("transactions", "PATCH", fields, { id: "eq." + id, user_id: "eq." + uid() }).then(function(rows){
      var updated = (rows && rows[0]) ? rows[0] : null;
      state.txs = state.txs.map(function(t){
        return t.id === id ? (updated || Object.assign({}, t, fields)) : t;
      });
      sortTxs(); resetForm(); state.tab = "lancamentos";
      if(categoryChanged){
        var siblings = state.txs.filter(function(t){
          return t.id !== id && t.type === fields.type && normDesc(t.description) === normDesc(fields.description) && t.category !== fields.category;
        });
        if(siblings.length){
          state.bulkCatPrompt = { ids: siblings.map(function(t){ return t.id; }), description: fields.description, category: fields.category };
        }
      }
      checkPriceAnomaly(fields.type, fields.description, fields.value, id);
      render();
    }).catch(function(err){
      state.txSaveError = (err && err.message) || "Erro desconhecido";
      render();
    });
  } else {
    var payload = Object.assign({ user_id: uid() }, fields);
    db("transactions", "POST", payload).then(function(rows){
      if(rows && rows[0]) state.txs.unshift(rows[0]);
      sortTxs();
      formState.value = ""; formState.description = "";
      checkPriceAnomaly(fields.type, fields.description, fields.value, rows && rows[0] && rows[0].id);
      render();
    }).catch(function(err){
      state.txSaveError = (err && err.message) || "Erro desconhecido";
      render();
    });
  }
}

function fixInvestmentCategories(){
  var ids = [];
  state.txs.forEach(function(t){
    if(t.category === "Investimento") return;
    var guessed = guessCategory(t.description || "");
    if(guessed === "Investimento") ids.push(t.id);
  });
  if(!ids.length){
    state.configMsg = "Nenhum lançamento precisava de correção. Já está tudo certo.";
    render();
    return;
  }
  state.txs = state.txs.map(function(t){
    return ids.indexOf(t.id) !== -1 ? Object.assign({}, t, { category: "Investimento" }) : t;
  });
  state.configMsg = "Corrigindo " + ids.length + " lançamento(s)...";
  render();
  db("transactions", "PATCH", { category: "Investimento" }, { id: "in.(" + ids.join(",") + ")", user_id: "eq." + uid() }).then(function(){
    state.configMsg = ids.length + " lançamento(s) reclassificado(s) como Investimento.";
    render();
  }).catch(function(err){
    state.configMsg = "Reclassifiquei localmente, mas não consegui salvar tudo no banco (" + (err && err.message ? err.message : "erro") + "). Tenta de novo.";
    render();
  });
}

function applyBulkCategory(){
  var prompt = state.bulkCatPrompt;
  if(!prompt) return;
  var ids = prompt.ids;
  state.txs = state.txs.map(function(t){
    return ids.indexOf(t.id) !== -1 ? Object.assign({}, t, { category: prompt.category }) : t;
  });
  state.bulkCatPrompt = null;
  render();
  db("transactions", "PATCH", { category: prompt.category }, { id: "in.(" + ids.join(",") + ")", user_id: "eq." + uid() });
}

function startEdit(id){
  var t = state.txs.filter(function(x){ return x.id === id; })[0];
  if(!t) return;
  formState = {
    editingId: id, type: t.type, category: t.category,
    description: t.description || "", value: String(t.value), date: t.date, cardId: t.card_id || ""
  };
  state.tab = "adicionar";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function deleteTransaction(id){
  var existing = state.txs.filter(function(t){ return t.id === id; })[0];
  if(!existing) return;
  if(existing.type === "despesa") incMaosDeTesoura();
  var receiptPath = existing.receipt_path;
  state.txs = state.txs.filter(function(t){ return t.id !== id; });
  if(formState.editingId === id) resetForm();
  render();
  db("transactions", "DELETE", null, { id: "eq." + id, user_id: "eq." + uid() }).then(function(){
    if(receiptPath) deleteReceiptObject(receiptPath);
  }).catch(function(err){
    state.txs.push(existing);
    sortTxs();
    // Desfaz tambem o contador do "Maos de tesoura": ele era incrementado
    // antes do DELETE e nao voltava atras, entao clicar em excluir sem rede
    // cinco vezes desbloqueava a conquista secreta sem nenhuma exclusao ter
    // acontecido de verdade.

function addToGoal(id, amountStr, direction){
  var amount = parseFloat(amountStr);
  if(!amount || amount <= 0) return;
  var goal = state.goals.filter(function(g){ return g.id === id; })[0];
  if(!goal) return;
  var sub = direction === "sub";
  var delta = sub ? -amount : amount;
  var newSaved = Math.max(0, Number(goal.saved) + delta);
  var movedAmount = Math.abs(newSaved - Number(goal.saved));
  goal.saved = newSaved;
  render();
  db("goals", "PATCH", { saved: newSaved }, { id: "eq." + id, user_id: "eq." + uid() });
  if(movedAmount > 0){
    var mov = { user_id: uid(), goal_id: id, amount: movedAmount, type: sub ? "retirada" : "deposito", date: todayStr() };
    db("goal_movements", "POST", mov).then(function(rows){

      render();

  }
}

// Busca todas as páginas: o limite de 1000 por requisição (padrão do
// PostgREST) cortava lançamentos antigos quando a conta passava de
// 1000 transações, sumindo com meses inteiros sem aviso nenhum.
function dbAll(table, query){
  var pageSize = 1000;
  var all = [];
  function fetchPage(offset){
    var q = Object.assign({}, query, { limit: String(pageSize), offset: String(offset) });
    return db(table, "GET", null, q).then(function(rows){
      rows = rows || [];
      all = all.concat(rows);
      if(rows.length === pageSize) return fetchPage(offset + pageSize);
      return all;
    });
  }
  return fetchPage(0);
}

/* ── one-time purge of leftover service workers from old deploys ──
   A stale SW from a previous version could keep intercepting fetches
   (incl. the update-check below) forever. This now runs only once per
   browser (gated by localStorage) so a SW registered afterwards for
   push notifications isn't immediately killed on the next page load. */
if ("serviceWorker" in navigator && !localStorage.getItem("finn_sw_purge_v1")) {
  var wasSwControlled = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(reg){ reg.unregister(); });
    localStorage.setItem("finn_sw_purge_v1", "1");
    if (wasSwControlled && !sessionStorage.getItem("finn_sw_cleanup_done")) {
      sessionStorage.setItem("finn_sw_cleanup_done", "1");
      window.location.reload();
    }
  });
}
if (window.caches) {
  caches.keys().then(function(keys){
    keys.forEach(function(k){ caches.delete(k); });
  });
}

// Registro do service worker era feito só dentro do fluxo de ativar push —
// então quem nunca clicou em "Ativar notificações" nunca tinha um SW
// instalado, e o "Nova versão disponível" (avisado via postMessage do SW
// quando uma nova versão assume) nunca tinha chance de disparar. Registra
// incondicionalmente, além de deixar o app instalável/offline de verdade.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(function(){});
  navigator.serviceWorker.addEventListener("message", function(e){
    if (e.data && e.data.type === "SW_UPDATED") {
      document.getElementById("updateBanner").classList.add("show");
    }
  });
}

/* ── push notifications ── */
function urlBase64ToUint8Array(base64String){
  var padding = "=".repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  var rawData = atob(base64);
  var out = new Uint8Array(rawData.length);
  for(var i = 0; i < rawData.length; i++) out[i] = rawData.charCodeAt(i);
  return out;
}

function arrayBufferToBase64Url(buffer){
  var bytes = new Uint8Array(buffer);
  var bin = "";
  for(var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function enablePushNotifications(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window)){
    state.pushStatus = "Seu navegador não suporta notificações push.";
    render();
    return;
  }
  state.pushStatus = "Ativando…";
  render();
  navigator.serviceWorker.register("/sw.js").then(function(reg){
    return Notification.requestPermission().then(function(perm){
      if(perm !== "granted") throw new Error("Permissão de notificações negada.");
      return reg.pushManager.getSubscription().then(function(existing){
        return existing || reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
      });
    });
  }).then(function(sub){
    return fetch("/push/subscribe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        endpoint: sub.endpoint,
        keys: {
          p256dh: arrayBufferToBase64Url(sub.getKey("p256dh")),
          auth: arrayBufferToBase64Url(sub.getKey("auth"))
        },
        access_token: currentSession && currentSession.access_token
      })
    });
  }).then(function(r){ return r.json(); }).then(function(j){
    state.pushStatus = (j && j.ok) ? "Notificações ativadas! Você vai receber avisos de contas fixas vencendo." : "Não foi possível ativar agora. Tente de novo.";
    render();
  }).catch(function(err){
    state.pushStatus = "Erro: " + err.message;
    render();
  });
}

var knownETag = null;
function checkForUpdate(){
  // cache:"no-store" só controla o cache HTTP do próprio navegador — um CDN/
  // proxy no meio do caminho (ex: domínio próprio atrás do Cloudflare) podia
  // servir uma resposta antiga e o ETag nunca parecia mudar. O parâmetro
  // aleatório força cada checagem a ser uma URL nova, sem chance de cache.
  var bustedUrl = window.location.pathname + "?_swcheck=" + Date.now();
  fetch(bustedUrl, { method: "HEAD", cache: "no-store" }).then(function(r){
    var et = r.headers.get("ETag");
    if(!et) return;
    if(knownETag === null){ knownETag = et; return; }
    if(et !== knownETag){
      document.getElementById("updateBanner").classList.add("show");
    }
  }).catch(function(){});
}
checkForUpdate();
setInterval(checkForUpdate, 5 * 60 * 1000);
document.addEventListener("visibilitychange", function(){
  if(!document.hidden) checkForUpdate();
});

  document.getElementById("navMenu").classList.remove("open");
  if(entrando && !state.analyticsData && !state.analyticsLoading) loadAdminAnalytics();
});
document.getElementById("btnAdminAnalyticsNav").addEventListener("click", function(){
  state.tab = "adminAnalytics";
  render();
  document.getElementById("navMenu").classList.remove("open");
  loadAdminAnalytics();
});
document.getElementById("btnScreenerNav").addEventListener("click", function(){
  state.tab = "screener";
  render();
  document.getElementById("navMenu").classList.remove("open");
  // Só carrega se ainda não tiver nada: são 15 chamadas de cotação por visita,
  // e voltar pro screener pra reler a tabela não precisa gastar tudo de novo.
  // Pra forçar, existe o "Atualizar agora" no topo da tela.
  if(!state.screenerData) loadScreener();
});
document.getElementById("btnBetaAdminNav").addEventListener("click", function(){
  state.tab = "adminBeta";
  render();
  document.getElementById("navMenu").classList.remove("open");
  loadAdminBeta();
});
document.getElementById("btnMetaAdsNav").addEventListener("click", function(){
  state.tab = "metaAds";
  render();
  document.getElementById("navMenu").classList.remove("open");
  loadMetaAds();
});
document.getElementById("btnLogoutNav").addEventListener("click", function(){
  Auth.logout(currentSession.access_token).then(function(){
    currentSession = null;
    showLogin();
  });
  document.getElementById("navMenu").classList.remove("open");
});
document.querySelectorAll(".tab-btn").forEach(function(btn){
  btn.addEventListener("click", function(){
    // Sair de Lançamentos com uma edição em andamento (sem salvar/cancelar)
    // cancela a edição — senão o formState.editingId ficava "vazando" pra
    // outras abas e um lançamento rápido em outro lugar acabava dando PATCH
    // na transação antiga em vez de criar uma nova.
    if(formState.editingId && btn.dataset.tab !== "adicionar") resetForm();
    state.tab = btn.dataset.tab;
    render();
    document.getElementById("navMenu").classList.remove("open");
  });
});
document.getElementById("btnMenu").addEventListener("click", function(e){
  e.stopPropagation();
  document.getElementById("navMenu").classList.toggle("open");
});
document.addEventListener("click", function(e){
  var navMenu = document.getElementById("navMenu");
  if(!navMenu.classList.contains("open")) return;
  if(navMenu.contains(e.target) || e.target === document.getElementById("btnMenu")) return;
  navMenu.classList.remove("open");
});

Auth.initSession().then(function(session){
  if(session){
    currentSession = session;
    showApp();
  } else {
    showLogin();
  }
});

})();
</script>
</body>
</html>
