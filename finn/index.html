function renderAnalises(){
  var txs = analysisTxs();
  var periodHtml = '<div class="an-period">' + ANALYSIS_PERIODS.map(function(p){
    return '<button type="button" class="an-period-btn' + (state.analysisPeriod === p.key ? " active" : "") + '" data-period="' + p.key + '">' + p.label + '</button>';
  }).join("") + '</div>';

  if(!txs.length){
    return '<div class="card"><div class="eyebrow">Análises financeiras</div>' + periodHtml +
      '<div class="empty-state">Nenhum lançamento nesse período.</div></div>';
  }

  var receitas = txs.filter(function(t){ return t.type === "receita" && isFlowTx(t); });
  var despesas = txs.filter(function(t){ return t.type === "despesa" && isFlowTx(t); });
  var totalReceita = receitas.reduce(function(s,t){ return s + Number(t.value); }, 0);
  var totalDespesa = despesas.reduce(function(s,t){ return s + Number(t.value); }, 0);
  var saldo = totalReceita - totalDespesa;

  var dates = txs.map(function(t){ return t.date; }).filter(Boolean).sort();
  var spanDays = Math.max(1, daysBetween(dates[0], dates[dates.length-1]) + 1);
  var avgDespesaDia = totalDespesa / spanDays;
  var avgReceitaDia = totalReceita / spanDays;
  var razao = totalReceita > 0 ? totalDespesa / totalReceita : (totalDespesa > 0 ? null : 0);

  var jurosTotal = despesas.filter(function(t){ return /juro|i\.?o\.?f\.?/i.test(t.description || ""); })
    .reduce(function(s,t){ return s + Number(t.value); }, 0);

  var despesaCats = breakdownByCat(despesas);
  var receitaCats = breakdownByCat(receitas);
  var despesasSorted = despesas.slice().sort(function(a,b){ return Number(b.value) - Number(a.value); });
  var receitasSorted = receitas.slice().sort(function(a,b){ return Number(b.value) - Number(a.value); });
  var topDespesas = despesasSorted.slice(0, 5);
  var topReceitas = receitasSorted.slice(0, 5);

  // Recomendações de "revise esse gasto" / "crie um limite" só fazem sentido
  // pra despesa variável — sugerir isso pra categoria de uma conta fixa
  // (ex.: Moradia por causa do aluguel) não ajuda em nada, já que é um
  // valor comprometido todo mês. Usa as categorias já marcadas em "Fixas"
  // pra achar a maior categoria só entre os gastos que dá pra cortar.
  var fixedDespesaCats = {};
  state.fixed.forEach(function(f){ if(f.type === "despesa") fixedDespesaCats[f.category] = true; });
  var discretionaryDespesas = despesas.filter(function(t){ return !fixedDespesaCats[t.category]; });
  var topDiscretionaryCat = breakdownByCat(discretionaryDespesas)[0];

  var stats = { saldo: saldo, totalReceita: totalReceita, totalDespesa: totalDespesa, jurosTotal: jurosTotal, topDespesaCat: topDiscretionaryCat, avgDespesaDia: avgDespesaDia, avgReceitaDia: avgReceitaDia, razao: razao, despesaCats: despesaCats };
  var recos = buildRecommendations(stats);

  var healthClass = saldo < 0 ? "bad" : (totalDespesa > totalReceita * 0.85 ? "warn" : "good");

  var html = '<div class="card"><div class="eyebrow">Análises financeiras</div>' + periodHtml +
    '<div class="totals-grid">' +
      '<div class="total-box"><div class="lbl">Entradas</div><div class="val" style="color:var(--fs)">' + fmtMoney(totalReceita) + '</div></div>' +
      '<div class="total-box"><div class="lbl">Saídas</div><div class="val" style="color:var(--fe)">' + fmtMoney(totalDespesa) + '</div></div>' +
      '<div class="total-box"><div class="lbl">Saldo</div><div class="val" style="color:' + (saldo>=0?"var(--fs)":"var(--fe)") + '">' + fmtMoney(saldo) + '</div></div>' +
    '</div>' +
    '<div class="metrics-grid" style="margin-top:8px">' +
      '<div class="total-box"><div class="lbl">Transações</div><div class="val">' + txs.length + '</div></div>' +
      '<div class="total-box"><div class="lbl">Gasto médio/dia</div><div class="val">' + fmtMoney(avgDespesaDia) + '</div></div>' +
      '<div class="total-box"><div class="lbl">Entrada média/dia</div><div class="val">' + fmtMoney(avgReceitaDia) + '</div></div>' +
      '<div class="total-box"><div class="lbl">Saída/Entrada</div><div class="val">' + (razao === null ? "—" : razao.toFixed(2) + "x") + '</div></div>' +
    '</div>' +
    anaCardToggle("totals") +
    anaCardBody("totals", function(){ return renderDailyBreakdownRows(txs); }) +
  '</div>';

  html += '<div class="health-card ' + healthClass + '">' +
    '<div class="eyebrow" style="margin-bottom:10px">' + (healthClass==="good"?"Saúde financeira":(healthClass==="warn"?"Atenção necessária":"Saúde financeira")) + '</div>' +
    '<div class="health-row"><span>Saldo ' + (saldo>=0?"positivo":"negativo") + ' de ' + fmtMoney(Math.abs(saldo)) + '</span></div>' +
    // "abaixo de" + "as receitas" concatenava em "abaixo de as receitas".
    // A frase inteira por ramo evita esse tipo de costura errada.
    '<div class="health-row"><span>' + (totalDespesa>totalReceita ? "Despesas superam as receitas" : "Despesas abaixo das receitas") + '</span></div>' +
    (jurosTotal > 0 ? '<div class="health-row"><span>Pagou ' + fmtMoney(jurosTotal) + ' em juros/IOF</span></div>' : '') +
    (despesaCats[0] ? '<div class="health-row"><span>Maior gasto: ' + escapeHtml(despesaCats[0].cat) + ' (' + despesaCats[0].pct.toFixed(0) + '%)</span></div>' : '') +
    anaCardToggle("health") +
    anaCardBody("health", function(){ return renderHealthDetailRows(stats); }) +
  '</div>';

  var chartsPreview = isMasterUser() && state.adminUnlocked;
  var previewTag = chartsPreview ? '<span class="admin-preview-tag">preview</span>' : '';
  html += '<div class="card"><div class="eyebrow">Distribuição de despesas' + previewTag + '</div>' +
    (chartsPreview ? renderAnimatedDonut(despesaCats, despesas, "despesa") : renderDonut(despesaCats, despesas, "despesa")) + '</div>';
  html += '<div class="card"><div class="eyebrow">Despesas por categoria' + previewTag + '</div>' +
    (chartsPreview ? renderAnimatedCatBars(despesaCats, despesas, "despesa") : renderCatBars(despesaCats, despesas, "despesa")) + '</div>';
  if(receitaCats.length) html += '<div class="card"><div class="eyebrow">Entradas por categoria' + previewTag + '</div>' +
    (chartsPreview ? renderAnimatedCatBars(receitaCats, receitas, "receita") : renderCatBars(receitaCats, receitas, "receita")) + '</div>';

  html += renderBalanceEvolution(txs);
  html += renderTxBuckets(txs);

  if(topDespesas.length){
    var topDespesasOpen = state.expandedAnalysisCard === "topdespesas";
    html += '<div class="card"><div class="eyebrow">Maiores saídas</div>' + renderTopTxList(topDespesasOpen ? despesasSorted : topDespesas, "var(--fe)") +
      (despesasSorted.length > 5 ? anaCardToggleLabel("topdespesas", topDespesasOpen ? "ver top 5" : "ver todas (" + despesasSorted.length + ")") : "") +
    '</div>';
  }
  if(topReceitas.length){
    var topReceitasOpen = state.expandedAnalysisCard === "topreceitas";
    html += '<div class="card"><div class="eyebrow">Maiores entradas</div>' + renderTopTxList(topReceitasOpen ? receitasSorted : topReceitas, "var(--fs)") +
      (receitasSorted.length > 5 ? anaCardToggleLabel("topreceitas", topReceitasOpen ? "ver top 5" : "ver todas (" + receitasSorted.length + ")") : "") +
    '</div>';
  }

  html += '<div class="card"><div class="eyebrow">Recomendações</div><div class="reco-list">' +
    recos.map(function(r){ return '<div class="reco-item"><span>' + r.text + '</span></div>'; }).join("") +
  '</div></div>';

  return html;
}

function downloadCSV(rows, filename){
  var header = "Data,Tipo,Categoria,Descrição,Valor";
  var lines = rows.map(function(t){
    var desc = '"' + String(t.description || "").replace(/"/g, '""') + '"';
    return [t.date, t.type, t.category, desc, Number(t.value).toFixed(2)].join(",");
  });
  var csv = [header].concat(lines).join("\n");
  var blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ── Importar arquivo (CSV/TXT/XLSX/PDF) ── */
/* ── Detector de importação suspeita ──
   O leitor genérico de PDF falha em SILÊNCIO: quando não reconhece o layout do
   banco, não dá erro — produz lançamentos com cara de válidos. Foi assim que um
   extrato do BB entrou com o cabeçalho da tabela na descrição e tudo marcado
   como receita, e nada avisou antes de salvar.

   Isto não bloqueia a importação (pode existir arquivo legítimo só de receita).
   Só levanta a mão quando os números não fecham com o que um extrato de banco
   costuma ser, pra você conferir o preview antes de confirmar. */
function checaImportacaoSuspeita(rows){
  if(!rows || rows.length < 6) return null;
  var motivos = [];

  // Extrato com 100% de um tipo só é quase sempre erro de leitura de sinal —
  // foi exatamente o sintoma do caso do BB (tudo receita).
  var tipos = {};
  rows.forEach(function(r){ tipos[r.type] = (tipos[r.type] || 0) + 1; });
  if(Object.keys(tipos).length === 1){
    motivos.push("todos os " + rows.length + " lançamentos são do mesmo tipo (" +
      (rows[0].type === "receita" ? "receita" : "despesa") + ")");
  }

  // Cabeçalho de tabela ou linha de saldo na descrição = o parser leu a
  // estrutura do documento como se fosse dado.
  var comCabecalho = rows.filter(function(r){
    return /Lan[çc]amentos|Documento|Hist[óo]rico|Extrato de Conta|Saldo\s+(Anterior|do dia)|S A L D O/i.test(r.description || "");
  }).length;
  if(comCabecalho) motivos.push(comCabecalho + " com cabeçalho ou saldo na descrição");

  // Descrição sem nenhuma letra costuma ser número de documento solto.
  var semTexto = rows.filter(function(r){ return !/[A-Za-zÀ-ÿ]/.test(r.description || ""); }).length;
  if(semTexto > rows.length * 0.2) motivos.push(semTexto + " sem texto na descrição");

  // Data única, ou a data de hoje na maioria, indica que o parser não achou a
  // data de cada lançamento e caiu no padrão.
  var datas = {};
  rows.forEach(function(r){ datas[r.date] = (datas[r.date] || 0) + 1; });
  var distintas = Object.keys(datas).length;
  if(distintas === 1) motivos.push("todos na mesma data");
  var hoje = new Date().toISOString().slice(0, 10);
  if(distintas > 1 && (datas[hoje] || 0) > rows.length * 0.5) motivos.push("maioria com a data de hoje");

  return motivos.length ? motivos : null;
}

// Hash do conteúdo exato de cada biblioteca (sha384 do arquivo publicado no
// npm, que é o mesmo byte a byte que o jsDelivr serve em /npm/<pkg>@<versao>/).
// Sem isso, um comprometimento do CDN — ou do pacote no npm — entrega
// JavaScript arbitrário rodando na origem do Finn, com acesso ao token de
// sessão no localStorage e a todos os dados financeiros. O navegador recusa o
// script se o conteúdo não bater com o hash.
var SRI = {
  "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js":
    "sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw",
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js":
    "sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e",
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js":

// Qual variável global cada biblioteca cria. É por ela que se sabe se o
// script REALMENTE carregou — a tag existir no DOM não prova nada.
var GLOBAL_DA_LIB = {
  "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js": "XLSX",
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js": "pdfjsLib"
};
var _scriptsEmVoo = {};

function loadScript(src){
  var nomeGlobal = GLOBAL_DA_LIB[src];
  // Já carregado de verdade: a global existe.
  if(nomeGlobal && window[nomeGlobal]) return Promise.resolve();
  // Carregamento em andamento: reaproveita, pra dois cliques não baixarem
  // a biblioteca duas vezes.
  if(_scriptsEmVoo[src]) return _scriptsEmVoo[src];

  var pendente = new Promise(function(resolve, reject){
    // Uma tentativa anterior que FALHOU deixa a tag no DOM. Antes o código
    // via a tag e resolvia na hora — a biblioteca nunca tinha carregado, e
    // a chamada seguinte estourava com "XLSX is not defined", uma mensagem
    // que não diz nada pra quem está tentando importar um extrato.
    // Limpar a tag velha faz de uma nova tentativa uma tentativa de verdade.
    var antigas = document.querySelectorAll('script[src="' + src + '"]');
    for(var i = 0; i < antigas.length; i++) antigas[i].remove();

    var s = document.createElement("script");
    s.src = src;
    if(SRI[src]){
      s.integrity = SRI[src];
      s.crossOrigin = "anonymous"; // exigido pro navegador conseguir validar o hash
    }
    s.onload = function(){
      // Carregou a tag mas não criou a global: arquivo servido errado, ou
      // conteúdo trocado. Falhar aqui é melhor que estourar depois num
      // ReferenceError sem contexto.
      if(nomeGlobal && !window[nomeGlobal]){
        s.remove();
        reject(new Error("A biblioteca de leitura de arquivo carregou incompleta. Tente de novo; se persistir, exporte o extrato em CSV ou OFX, que o Finn lê sem depender dela."));
        return;
      }
      resolve();
    };
    // onerror também dispara quando o hash SRI não bate. A mensagem sugere o
    // caminho que funciona sem biblioteca nenhuma, em vez de deixar a pessoa
    // sem saída.
    s.onerror = function(){
      s.remove();
      reject(new Error("Não consegui carregar a biblioteca de leitura de arquivo. Verifique sua conexão — ou exporte o extrato em CSV ou OFX, que o Finn lê sem precisar dela."));
    };
    document.head.appendChild(s);
  });

  // Sai do cache quando termina: falhou, a próxima tentativa recomeça.
  pendente.catch(function(){}).then(function(){ delete _scriptsEmVoo[src]; });
  _scriptsEmVoo[src] = pendente;
  return pendente;
}

// Guarda contra a CVE-2023-30533 do SheetJS (poluição de Object.prototype).
// A versão corrigida (>= 0.19.3) só existe no CDN próprio do SheetJS, que saiu
// do npm — enquanto a migração não acontece, isto contém o estrago: tira um
// retrato das chaves de Object.prototype antes de abrir o arquivo, e depois
// remove qualquer coisa que a planilha tenha enxertado lá.
//
// Importa porque o app monta TODA a interface por concatenação de string; uma
// propriedade injetada no protótipo passa a aparecer em toda leitura de chave
// inexistente, e várias dessas são interpoladas em HTML sem escape justamente
// por serem "sempre internas".
function withPrototypeGuard(fn){
  var antes = Object.getOwnPropertyNames(Object.prototype);
  try {
    return fn();
  } finally {
    Object.getOwnPropertyNames(Object.prototype).forEach(function(k){
      if(antes.indexOf(k) === -1){
        try { delete Object.prototype[k]; } catch(e){}
      }
    });
  }
}

function parseMoneyStr(s){
  if(s == null) return null;
  s = String(s).trim();
  if(!s) return null;
  // Alguns extratos (ex.: PicPay) tipografam o sinal de negativo com o
  // caractere matemático "−" (U+2212) ou um travessão, não o hífen comum —
  // sem essa normalização o valor nunca era reconhecido como negativo.
  s = s.replace(/[−–—]/g, "-");
  var neg = /^-|\(.*\)$/.test(s);
  s = s.replace(/[^\d,.\-]/g, "");
  if(!s) return null;
  if(s.indexOf(",") !== -1 && s.indexOf(".") !== -1){
    s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  } else if(s.indexOf(",") !== -1){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(s.indexOf(".") !== -1){
    // Só ponto, sem vírgula: ambíguo entre decimal ("45.90") e milhar ("1.234").
    // 1-2 dígitos depois do último ponto = decimal; senão é separador de milhar.
    var afterDot = s.length - s.lastIndexOf(".") - 1;
    if(afterDot > 2) s = s.replace(/\./g, "");
  }
  var n = parseFloat(s);
  if(isNaN(n)) return null;
  return neg && n > 0 ? -n : n;
}

function parseDateStr(s){
  if(!s) return null;
  s = String(s).trim();
  var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1] + "-" + m[2] + "-" + m[3];
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){
    var d = m[1].padStart(2,"0"), mo = m[2].padStart(2,"0"), y = m[3];
    if(y.length === 2) y = "20" + y;
    if(d === "00" || mo === "00") return null;
    return y + "-" + mo + "-" + d;
  }
  return null;
}

function splitDelimLine(l, delim){
  var out = [], cur = "", inQ = false;
  for(var i = 0; i < l.length; i++){
    var c = l[i];
    if(c === '"'){ inQ = !inQ; continue; }
    if(c === delim && !inQ){ out.push(cur); cur = ""; continue; }
    cur += c;
  }
  out.push(cur);
  return out;
}

var CATEGORY_KEYWORDS = [
  ["Alimentação", /supermerc|mercado|mercadinho|padaria|panifica|ifood|ifd\*|restaurante|lanchonete|lanches|a[cç]a[ií]|pizza|hambur|burguer|cantina|emp[oó]rio|caf[eé]|\bp[aã]o\b/i],
  ["Transporte", /\buber(?!\s*eats)|99app|99\*|t[aá]xi|\bposto\b|combust[ií]vel|gasolina|estacionamento|metr[oô]|[oô]nibus|trip help|blablacar|cabify|indriver/i],
  ["Moradia", /aluguel|condom[ií]nio|\benergia\b|\bluz\b|\b[aá]gua\b|sabesp|\benel\b|cemig|\blight\b|copel|\binternet\b|\bclaro\b|\btim\b|\bvivo\b|\boi\b/i],
  ["Saúde", /farm[aá]cia|drogaria|\braia\b|hospital|cl[ií]nica|laborat[oó]rio|unimed|dentista|seguro de vida/i],
  ["Educação", /\bescola\b|faculdade|\bcurso\b|livraria|mensalidade/i],
  ["Lazer", /cinema|ingresso|shopping|spotify|netflix|steam|drinks|balada|boate|viagem|\bhotel\b/i],
  ["Investimento", INVEST_RE],
  ["Salário", /sal[aá]rio|folha de pagamento|holerite/i]
];

function guessCategory(desc){
  for(var i = 0; i < CATEGORY_KEYWORDS.length; i++){
    if(CATEGORY_KEYWORDS[i][1].test(desc)) return CATEGORY_KEYWORDS[i][0];
  }
  return null;
}

function parseDelimited(text){
  var lines = text.split(/\r?\n/).filter(function(l){ return l.trim().length; });
  if(!lines.length) return [];
  var delim = lines[0].split(";").length >= lines[0].split(",").length ?
    (lines[0].indexOf(";") !== -1 ? ";" : (lines[0].indexOf("\t") !== -1 ? "\t" : ",")) : ",";
  var header = splitDelimLine(lines[0], delim).map(function(h){ return h.trim().toLowerCase(); });
  var idx = {
    date: header.findIndex(function(h){ return /data|date/.test(h); }),
    type: header.findIndex(function(h){ return /tipo|type/.test(h); }),
    category: header.findIndex(function(h){ return /categ/.test(h); }),
    description: header.findIndex(function(h){ return /descri|desc|hist/.test(h); }),
    detail: header.findIndex(function(h){ return /detal|observ/.test(h); }),
    value: header.findIndex(function(h){ return /valor|value|montante|amount/.test(h); })
  };
  var hasHeader = idx.date !== -1 || idx.value !== -1;
  // Fatura de cartão (ex.: export "date,title,amount" do Nubank) usa o
  // sinal ao contrário de um extrato de conta: o valor vem POSITIVO pra
  // uma compra (é despesa) e NEGATIVO só num pagamento/estorno (é receita).
  // Sem esse caso especial, toda compra do cartão virava "receita".
  var isCardInvoiceCsv = hasHeader && header.length === 3 && header[0] === "date" && header[1] === "title" && header[2] === "amount";
  var dataLines = hasHeader ? lines.slice(1) : lines;
  var rows = [];
  dataLines.forEach(function(l){
    var cols = splitDelimLine(l, delim);
    if(!cols.length || cols.every(function(c){ return !c.trim(); })) return;
    var rawDate = hasHeader && idx.date !== -1 ? cols[idx.date] : cols[0];
    var rawDesc = hasHeader && idx.description !== -1 ? cols[idx.description] : (cols[1] || "");
    var rawVal = hasHeader && idx.value !== -1 ? cols[idx.value] : cols[cols.length - 1];
    var rawType = hasHeader && idx.type !== -1 ? cols[idx.type] : "";
    var rawCat = (hasHeader && idx.category !== -1 ? cols[idx.category] : "") || "";
    var rawDetail = hasHeader && idx.detail !== -1 ? cols[idx.detail] : "";
    var descTrim = (rawDesc || "").trim();
    if(/^saldo\b/i.test(descTrim) || /^s\s*a\s*l\s*d\s*o\s*$/i.test(descTrim)) return;
    var value = parseMoneyStr(rawVal);
    if(value === null || value === 0) return;
    var date = parseDateStr(rawDate);
    if(!date){
      if(hasHeader && idx.date !== -1) return;
      date = todayStr();
    }
    var type = /receita|income|credito|cr[eé]dito|entrada/i.test(rawType) ? "receita" :
      (/despesa|expense|d[eé]bito|saida|saída/i.test(rawType) ? "despesa" :
        (isCardInvoiceCsv ? (value < 0 ? "receita" : "despesa") : (value < 0 ? "despesa" : "receita")));
    var detailClean = (rawDetail || "").trim()
      .replace(/^\d{1,2}\/\d{1,2}\s+\d{1,2}:\d{2}\s*/, "")
      .replace(/^\d{6,}\s*/, "")
      .trim();
    var finalDesc = detailClean || descTrim;
    var category = allCategories().indexOf(rawCat.trim()) !== -1 ? rawCat.trim() : (guessCategory(descTrim + " " + detailClean) || "Outros");
    rows.push({ date: date, type: type, category: category, description: finalDesc || category, value: Math.abs(value), include: true });
  });
  return rows;
}

function parseXLSX(arrayBuffer){
  return loadScript("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js").then(function(){
    // Tudo que toca o conteúdo da planilha roda dentro do guarda — é durante o
    // parse que a CVE-2023-30533 enxerta propriedade no Object.prototype.
    return withPrototypeGuard(function(){
      var wb = XLSX.read(arrayBuffer, { type: "array" });
      var sheet = wb.Sheets[wb.SheetNames[0]];
      var csv = XLSX.utils.sheet_to_csv(sheet);
      return parseDelimited(csv);
    });
  });
}

function parseStatementText(text){
  var rows = [];
  // Muitos extratos de banco tradicional (Itaú, Bradesco, Santander, BB,
  // Caixa) não usam sinal de menos — mostram o valor sempre positivo e
  // marcam a direção com um "D" (débito) ou "C" (crédito) logo depois,
  // às vezes entre parênteses. Sem reconhecer isso, todo lançamento virava
  // "receita" (nunca havia um "-" pra detectar despesa).
  var re = /(\d{2}\/\d{2}\/\d{4}|\d{4}-\d{2}-\d{2})\s+([^\n]{3,80}?)\s+([-−–—]?R?\$?\s?[-−–—]?\d{1,3}(?:\.\d{3})*,\d{2}|[-−–—]?\d+\.\d{2})\s*\(?([DC])?\)?(?=\s|$)/gi;
  var m;
  while((m = re.exec(text))){
    var date = parseDateStr(m[1]);
    var value = parseMoneyStr(m[3]);
    if(date && value !== null && value !== 0){
      var desc = m[2].trim().slice(0,80) || "Importado";
      var hasExplicitSign = /^[-−–—]/.test(String(m[3]).trim());
      var dcFlag = m[4] ? m[4].toUpperCase() : null;
      var type = hasExplicitSign ? (value < 0 ? "despesa" : "receita") :
        (dcFlag === "D" ? "despesa" : (dcFlag === "C" ? "receita" : (value < 0 ? "despesa" : "receita")));
      rows.push({ date: date, type: type, category: guessCategory(desc) || "Outros", description: desc, value: Math.abs(value), include: true });
    }
  }
  return rows;
}

// OFX (Open Financial Exchange) — formato estruturado que Itaú, Bradesco,
// Santander, Caixa, BB e outros oferecem como export "oficial" do extrato.
// Muito mais confiável que ler texto de PDF: cada lançamento já vem com
// data, valor (com sinal, sempre em ponto decimal por especificação) e
// descrição em tags previsíveis, sem depender do layout visual do banco.
function parseOFX(text){
  var rows = [];
  var blocks = text.split(/<STMTTRN>/i).slice(1);
  blocks.forEach(function(block){
    var dtMatch = block.match(/<DTPOSTED>\s*(\d{8})/i);
    var amtMatch = block.match(/<TRNAMT>\s*(-?[\d.,]+)/i);
    if(!dtMatch || !amtMatch) return;
    var date = dtMatch[1].slice(0,4) + "-" + dtMatch[1].slice(4,6) + "-" + dtMatch[1].slice(6,8);
    var value = parseFloat(amtMatch[1].replace(",", "."));
    if(isNaN(value) || value === 0) return;
    var memoMatch = block.match(/<MEMO>([^\r\n<]+)/i);
    var nameMatch = block.match(/<NAME>([^\r\n<]+)/i);
    var desc = ((memoMatch && memoMatch[1]) || (nameMatch && nameMatch[1]) || "Importado").trim().slice(0, 80);
    rows.push({ date: date, type: value < 0 ? "despesa" : "receita", category: guessCategory(desc) || "Outros", description: desc, value: Math.abs(value), include: true });
  });
  return rows;
}

var MONTHS_PT = {"janeiro":"01","fevereiro":"02","março":"03","marco":"03","abril":"04","maio":"05","junho":"06","julho":"07","agosto":"08","setembro":"09","outubro":"10","novembro":"11","dezembro":"12"};

// Formato "PicPay" (e outras carteiras digitais): a data aparece uma vez por
// dia como cabeçalho por extenso ("13 de julho 2026 Saldo ao final do dia:
// ..."), e cada lançamento abaixo só tem hora ("11:31 Pix enviado −R$ 65,34
// ..."), sem nenhuma data dd/mm/aaaa na própria linha — por isso o regex
// genérico de parseStatementText (que exige a data colada no lançamento)
// nunca encontrava nada nesse tipo de extrato.
function parseDayGroupedStatement(text){
  var dateHeaderRe = /(\d{1,2})\s+de\s+([a-zçãáéíóú]+)\s+(\d{4})(?!\s+de\b)/gi;
  var headers = [];
  var hm;
  while((hm = dateHeaderRe.exec(text))){
    var mo = MONTHS_PT[hm[2].toLowerCase()];
    if(!mo) continue;
    headers.push({ index: hm.index, date: hm[3] + "-" + mo + "-" + hm[1].padStart(2, "0") });
  }
  if(!headers.length) return [];

  var TYPE_PREFIX_RE = /^(Pix enviado|Pix recebido|Pix devolvido|Compra realizada|Compra estornada|Pagamento realizado|Valor recebido|Tarifa de cadastro cobrada|Seguro Carteira Digital)\s*/i;
  var MONEY_TOKEN_RE = /[+\-−–—]?R?\$?\s?\d{1,3}(?:\.\d{3})*,\d{2}/g;
  var rows = [];
  for(var h = 0; h < headers.length; h++){
    var sectionStart = headers[h].index;
    var sectionEnd = h + 1 < headers.length ? headers[h + 1].index : text.length;
    var section = text.slice(sectionStart, sectionEnd);

    var timeRe = /\d{2}:\d{2}/g;
    var times = [];
    var tm;
    while((tm = timeRe.exec(section))) times.push(tm.index);

    for(var i = 0; i < times.length; i++){
      var chunkStart = times[i];
      var chunkEnd = i + 1 < times.length ? times[i + 1] : section.length;
      var chunk = section.slice(chunkStart, chunkEnd);

      var moneyTokens = chunk.match(MONEY_TOKEN_RE);
      if(!moneyTokens || !moneyTokens.length) continue;
      var rawVal = moneyTokens[moneyTokens.length - 1];
      var value = parseMoneyStr(rawVal);
      if(value === null || value === 0) continue;

      var valIdx = chunk.lastIndexOf(rawVal);
      var desc = chunk.slice(5, valIdx) + " " + chunk.slice(valIdx + rawVal.length);
      // Quando o último lançamento do dia não tem contraparte, o trecho vai
      // até o próximo cabeçalho de data — se isso cruzar uma quebra de
      // página, o cabeçalho repetido (nome/CPF/agência) ou o rodapé do PDF
      // acabam grudados na descrição. Corta tudo a partir desse ruído.
      var noiseMatch = desc.match(/([A-ZÀ-Ÿ][\wÀ-ÿ]*(?:\s+[A-ZÀ-Ÿ][\wÀ-ÿ]*){1,6}\s+)?(?:CPF:|Ag[eê]ncia:|Documento emitido em:|D[uú]vidas\?)/i);
      if(noiseMatch) desc = desc.slice(0, noiseMatch.index);
      desc = desc
        .replace(TYPE_PREFIX_RE, "")
        .replace(/\bCom\s+(saldo\s*\+\s*cart[aã]o|saldo|cart[aã]o)\b/gi, "")
        .replace(/\s+/g, " ").trim();
      if(!desc){
        var typeMatch = chunk.slice(5).trim().match(TYPE_PREFIX_RE);
        desc = typeMatch ? typeMatch[1] : "Importado";
      }

      rows.push({
        date: headers[h].date,
        type: value < 0 ? "despesa" : "receita",
        category: guessCategory(desc) || "Outros",
        description: desc.slice(0, 80),
        value: Math.abs(value),
        include: true
      });
    }
  }
  return rows;
}

function parsePDF(arrayBuffer){
  return loadScript("https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js").then(function(){
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    // isEvalSupported:false fecha a CVE-2024-4367 do pdf.js 3.x — sem isso, um
    // PDF forjado (com FontMatrix manipulado) executa JavaScript na origem do
    // Finn ao ser importado, com acesso ao token de sessão no localStorage.
    // Basta a pessoa importar um "extrato.pdf" recebido de terceiro.
    return window.pdfjsLib.getDocument({ data: arrayBuffer, isEvalSupported: false }).promise;
  }).then(function(pdf){
    var pagePromises = [];
    for(var i = 1; i <= pdf.numPages; i++){
      pagePromises.push(pdf.getPage(i).then(function(page){
        return page.getTextContent().then(function(tc){
          // Reconstrói as LINHAS do PDF pela coordenada Y de cada pedaço de
          // texto. Antes isso juntava tudo com espaço, num blob só — e a
          // fronteira entre um lançamento e o seguinte é justamente a quebra
          // de linha. Sem ela o parser colava o cabeçalho da tabela na
          // descrição, casava valor de uma linha com data de outra, e o
          // extrato inteiro entrava errado.
          var porLinha = {};
          tc.items.forEach(function(it){
            if(!it.str || !it.str.trim()) return;
            // transform[5] é o Y do item. Arredonda pra tolerar variação
            // sub-pixel entre pedaços da mesma linha.
            var y = Math.round((it.transform && it.transform[5]) || 0);
            (porLinha[y] = porLinha[y] || []).push({ x: (it.transform && it.transform[4]) || 0, s: it.str });
          });
          // Y cresce de baixo pra cima no PDF, então ordena decrescente pra
          // ler de cima pra baixo; dentro da linha, ordena por X.
          return Object.keys(porLinha)
            .map(Number).sort(function(a, b){ return b - a; })
            .map(function(y){
              return porLinha[y].sort(function(a, b){ return a.x - b.x; })
                .map(function(p){ return p.s; }).join(" ").replace(/\s+/g, " ").trim();
            })
            .filter(Boolean).join("\n");
        });
      }));
    }
    return Promise.all(pagePromises);
  }).then(function(pageTexts){
    var text = pageTexts.join("\n");
    // Ordem importa: do formato mais específico pro mais genérico. O
    // parseStatementText é o último recurso justamente por ser o mais solto —
    // se ele rodar primeiro, casa qualquer coisa e produz lixo.
    var rows = parseBancoBrasilStatement(text);
    if(rows.length) return rows;
    rows = parseDayGroupedStatement(text);
    return rows.length ? rows : parseStatementText(text);
  });
}

// Extrato do Banco do Brasil (e parecidos). O layout real, depois da
// reconstrução de linhas, é assim:
//
//   Pix - Recebido                                          <- o TIPO vem antes
//   01/07/2026 14397 11905037333921 01/07 19:05 ... ANA MARIA S I 500,00 (+)
//   Compra com Cartão
//   01/07/2026 99008 172131 24,00 (-)
//   01/07 20:02 AlexandrePauloDa                            <- contraparte depois
//   Saldo do dia 289,64 (-)                                 <- não é lançamento
//
// Três detalhes que quebram quem tenta adivinhar: o tipo fica na linha
// ANTERIOR, o valor e o sinal ficam no FIM da linha (não logo após a data), e
// a contraparte às vezes cai na linha seguinte. Os dois parsers que já
// existiam não davam conta — um espera cabeçalho "15 de julho 2026" (estilo
// Nubank), o outro espera o marcador D/C, que aqui não aparece.
var BB_LINHA_LANCAMENTO = /^(\d{2}\/\d{2}\/\d{4})\s+(.+?)\s+(\d{1,3}(?:\.\d{3})*,\d{2})\s*\(([+-])\)\s*$/;
// Saldo não é lançamento — entra no extrato só como referência. Sem filtrar,
// o "Saldo do dia" de cada dia virava uma transação inventada.
var BB_SALDO = /saldo\s+(anterior|do\s+dia|bloqueado)|^s\s*a\s*l\s*d\s*o\b/i;
// Cabeçalho que se repete em toda página.
var BB_RUIDO = /^(extrato de conta|cliente\b|ag[êe]ncia:|lan[çc]amentos\s*$|dia\s+lote|dia\s+documento|per[íi]odo:|informa[çc][õo]es|folha\b|banco do brasil|ouvidoria|sac\b|total\s+aplica|sujeitos a confirma|\*\s*saldos por dia)/i;
// O que caracteriza a linha de TIPO. Precisa ser por palavra-chave: sobra de
// nome cortado ("AZEVE", "ALIMEN", "VA") também é linha solta com letras, e
// sem isso viraria o "tipo" do lançamento seguinte.
var BB_TIPO = /^(pix\b|pix-|compra\b|cobran[çc]a|transfer[êe]ncia|pagamento|saque|dep[óo]sito|tarifa|estorno|rendimento|juros\b|iof\b|d[ée]bito|cr[ée]dito|resgate|aplica[çc])/i;

function parseBancoBrasilStatement(text){
  var linhas = String(text || "").split(/\r?\n/)
    .map(function(l){ return l.trim(); }).filter(Boolean);
  var rows = [];
  var tipo = "";

  for(var i = 0; i < linhas.length; i++){
    var linha = linhas[i];
    if(BB_RUIDO.test(linha)){ tipo = ""; continue; }

    var m = linha.match(BB_LINHA_LANCAMENTO);
    if(!m){
      // Guarda como tipo do PRÓXIMO lançamento. Fica com o último que
      // aparecer antes dele, que é o correto quando o banco intercala
      // linhas de detalhe ("Juros Saldo Devedor Conta").
      if(BB_TIPO.test(linha) && !BB_SALDO.test(linha)) tipo = linha;
      continue;
    }

    var meio = m[2];
    if(BB_SALDO.test(meio)){ tipo = ""; continue; }

    var d = parseDateStr(m[1]);
    var v = parseMoneyStr(m[3]);
    if(!d || v === null || v === 0){ tipo = ""; continue; }

    var quem = limpaMeioBB(meio);
    // Contraparte pode ter caído na linha seguinte ("01/07 20:02 Fulano").
    if(!quem && i + 1 < linhas.length && /^\d{2}\/\d{2}\s+\d{2}:\d{2}\b/.test(linhas[i + 1])){
      quem = limpaMeioBB(linhas[i + 1]);
      i++;
    }

    var desc = [tipo, quem].filter(Boolean).join(" · ") || "Importado";
    rows.push({
      date: d,
      type: m[4] === "-" ? "despesa" : "receita",
      category: guessCategory(desc) || "Outros",
      description: desc.slice(0, 80),
      value: Math.abs(v),
      include: true
    });
    tipo = "";
  }
  return rows;
}

// Do miolo da linha sobra o que interessa: com quem foi. Lote, documento,
// chave Pix e a data/hora repetida só ocupam espaço na descrição.
function limpaMeioBB(s){
  var txt = String(s || "")
    .replace(/\b\d{2}\/\d{2}\s+\d{2}:\d{2}\b/g, " ")  // "01/07 19:05"
    .replace(/\b\d{7,}\b/g, " ")                       // documento / chave Pix
    .replace(/\b\d{3,6}\b/g, " ")                      // lote e sequencial
    .replace(/\s{2,}/g, " ")
    .trim();
  return /[A-Za-zÀ-ÿ]/.test(txt) ? txt : "";
}

function decodeText(buffer){
  var utf8 = new TextDecoder("utf-8").decode(buffer);
  if((utf8.match(/�/g) || []).length > 0){
    try { return new TextDecoder("windows-1252").decode(buffer); } catch(e){ return utf8; }
  }
  return utf8;
}

function handleImportFile(file){
  state.importPreview = []; state.importError = null; state.importDone = null; state.importAviso = null; state.importParsing = true;
  render();
  var name = file.name.toLowerCase();
  var ext = name.slice(name.lastIndexOf(".") + 1);
  var reader = new FileReader();
  reader.onload = function(e){
    var result;
    if(ext === "ofx" || ext === "qfx") result = Promise.resolve(parseOFX(decodeText(e.target.result)));
    else if(ext === "csv" || ext === "txt") result = Promise.resolve(parseDelimited(decodeText(e.target.result)));
    else if(ext === "xlsx") result = parseXLSX(e.target.result);
    else if(ext === "pdf") result = parsePDF(e.target.result);
    else result = Promise.reject(new Error("Formato não suportado"));
    result.then(function(rows){
      state.importParsing = false;
      if(!rows.length){
        state.importError = "Não encontrei lançamentos nesse arquivo. Confere o conteúdo ou tenta outro formato.";
        render();
        return;
      }
      state.importPreview = rows;
      state.importAviso = checaImportacaoSuspeita(rows);
      render();
    }).catch(function(err){
      state.importParsing = false;
      state.importError = "Não consegui ler esse arquivo (" + (err && err.message ? err.message : "erro desconhecido") + ").";
      render();
    });
  };
  reader.onerror = function(){
    state.importParsing = false;
    state.importError = "Falha ao ler o arquivo.";
    render();
  };
  reader.readAsArrayBuffer(file);
}

function updateImportSummary(){
  var el = document.querySelector(".import-summary");

function confirmImport(){
  var selected = state.importPreview.filter(function(r){ return r.include; });
  if(!selected.length) return;
  var payloads = selected.map(function(r){
    var value = parseFloat(r.value);
    return {
      user_id: uid(), type: r.type === "receita" ? "receita" : "despesa",
      category: allCategories().indexOf(r.category) !== -1 ? r.category : "Outros",
      description: r.description || "Importado", value: isNaN(value) ? 0 : Math.abs(value),
      date: r.date || todayStr()
    };
  }).filter(function(p){ return p.value > 0; });
  if(!payloads.length) return;
  var chunks = [];
  for(var i = 0; i < payloads.length; i += 200) chunks.push(payloads.slice(i, i + 200));
  var inserted = [];
  function next(){
    if(!chunks.length){
      inserted.forEach(function(t){ state.txs.unshift(t); });
      sortTxs();
      state.importPreview = [];
      state.filterMonth = "";
      state.filterCategory = "all";
      state.importDone = inserted.length + " lançamento(s) importado(s) com sucesso. Mostrando todos os meses.";
      render();
      return null;
    }
    var batch = chunks.shift();
    return db("transactions", "POST", batch).then(function(rows){
      if(Array.isArray(rows)) inserted = inserted.concat(rows);
      return next();
    });
  }
  next().catch(function(err){
    // Falha no meio: registra o que JÁ entrou para não sumir silenciosamente
    // e avisa exatamente quantos faltaram, para reimportar só o restante.
    inserted.forEach(function(t){ state.txs.unshift(t); });
    if(inserted.length) sortTxs();
    var faltam = payloads.length - inserted.length;
    state.importError = "Não consegui importar tudo (" + (err && err.message ? err.message : "erro desconhecido") + "). " +
      inserted.length + " de " + payloads.length + " foram salvos; faltaram " + faltam + ". " +
      "Recarregue a página e reimporte para concluir.";
    render();
  });
}

function goalProjection(g){
  var remaining = Number(g.target) - Number(g.saved);
  if(remaining <= 0) return null;
  var movs = state.goalMovements.filter(function(m){ return m.goal_id === g.id; });
  if(!movs.length) return { hasRate: false };
  var sorted = movs.slice().sort(function(a,b){ return (a.date||"") < (b.date||"") ? -1 : 1; });
  var monthsElapsed = Math.max(1, daysBetween(sorted[0].date, todayStr()) / 30);
  var net = movs.reduce(function(s,m){ return s + (m.type === "deposito" ? Number(m.amount) : -Number(m.amount)); }, 0);
  var avgMonthly = net / monthsElapsed;
  if(avgMonthly <= 0) return { hasRate: false };
  var monthsToGo = Math.ceil(remaining / avgMonthly);
  var projDate = new Date();
  projDate.setMonth(projDate.getMonth() + monthsToGo);
  return { hasRate: true, avgMonthly: avgMonthly, monthsToGo: monthsToGo, projDate: projDate };
}

function renderGoalProjection(g){
  var p = goalProjection(g);
  if(!p) return '';
  if(!p.hasRate) return '<div class="goal-proj">Guarde um valor regularmente pra ver uma previsão de quando você bate essa meta.</div>';
  var when = p.projDate.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  return '<div class="goal-proj">No ritmo atual (~' + fmtMoney(p.avgMonthly) + '/mês), você bate essa meta em ' +
    p.monthsToGo + (p.monthsToGo === 1 ? " mês" : " meses") + ' · por volta de ' + when + '</div>';
}

var fixedForm = { type: "despesa", description: "", category: "Outros", value: "", dayOfMonth: "1" };

function normDesc(s){
  return (s || "").trim().toLowerCase().replace(/\s+/g, " ");
}

function checkPriceAnomaly(type, description, value, excludeId){
  if(type !== "despesa") return;
  var prior = state.txs.filter(function(t){
    return t.id !== excludeId && t.type === type && normDesc(t.description) === normDesc(description);
  });
  if(prior.length < 2) return;
  var avg = prior.reduce(function(s,t){ return s + Number(t.value); }, 0) / prior.length;
  if(avg <= 0) return;
  var diff = value - avg;
  if(diff / avg < 0.25 || diff < 5) return;
  var pct = Math.round((diff / avg) * 100);
  state.priceAlert = { description: description, value: value, avg: avg, pct: pct };
}

function getDismissedRecurring(){
  try { return JSON.parse(localStorage.getItem("finn_dismissed_recurring") || "[]"); }
  catch(e){ return []; }
}

function dismissRecurring(key){
  var list = getDismissedRecurring();
  if(list.indexOf(key) === -1) list.push(key);
  localStorage.setItem("finn_dismissed_recurring", JSON.stringify(list));
  render();
}

function detectRecurringCandidates(){
  var groups = {};
  state.txs.forEach(function(t){
    if(!t.date) return;
    var key = t.type + "|" + normDesc(t.description);
    (groups[key] = groups[key] || []).push(t);
  });
  var alreadyFixed = {};
  state.fixed.forEach(function(f){ alreadyFixed[f.type + "|" + normDesc(f.description)] = true; });
  var candidates = [];
  Object.keys(groups).forEach(function(key){
    if(alreadyFixed[key]) return;
    var byMonth = {};
    groups[key].forEach(function(t){
      var mk = t.date.slice(0,7);
      (byMonth[mk] = byMonth[mk] || []).push(t);
    });
    var monthKeys = Object.keys(byMonth);
    if(monthKeys.length < 3) return;
    var occ = monthKeys.map(function(mk){
      var arr = byMonth[mk];
      var tx = arr[arr.length - 1];
      return { day: new Date(tx.date + "T00:00:00").getDate(), value: Number(tx.value), tx: tx };
    });
    var days = occ.map(function(o){ return o.day; });
    var values = occ.map(function(o){ return o.value; });
    var dayMin = Math.min.apply(null, days), dayMax = Math.max.apply(null, days);
    var valMin = Math.min.apply(null, values), valMax = Math.max.apply(null, values);
    if(dayMax - dayMin > 5) return;
    if(valMin <= 0 || (valMax - valMin) / valMin > 0.25) return;
    var avgDay = Math.round(days.reduce(function(s,d){ return s + d; }, 0) / days.length);
    var avgValue = values.reduce(function(s,v){ return s + v; }, 0) / values.length;
    var last = occ[occ.length - 1].tx;
    candidates.push({ key: key, type: last.type, description: last.description, category: last.category, day: avgDay, value: avgValue, months: monthKeys.length });
  });
  return candidates.sort(function(a,b){ return b.months - a.months; });
}

function renderRecurringSuggestions(){
  var dismissed = getDismissedRecurring();
  var candidates = detectRecurringCandidates().filter(function(c){ return dismissed.indexOf(c.key) === -1; });
  if(!candidates.length) return '';
  return '<div class="card">' +
    '<div class="eyebrow" style="color:var(--fp)">Gastos recorrentes detectados</div>' +
    '<div style="font-size:12px;color:var(--fm);margin-bottom:10px">Esses lançamentos se repetem todo mês. Quer transformar em conta fixa, com aviso de vencimento?</div>' +
    candidates.map(function(c){

      var sign = c.type === "receita" ? "+" : "-";

        '<button type="button" class="fixed-del" data-dismissrecurring="' + escapeHtml(c.key) + '">✕</button>' +
      '</div>';
    }).join("") +
  '</div>';
}

function currentInvoicePeriod(closingDay){
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  // Fecha em dias 29-31 não existem em todo mês (fev, e abr/jun/set/nov com
  // 30 dias) — sem o clamp, new Date(y, m, 31) num mês de 30 dias transborda
  // pro dia 1 do mês seguinte e desloca o período da fatura inteiro.
  var closeThis = Math.min(closingDay, daysInMonth(y, m));
  var start, end;
  if(d <= closeThis){
    end = new Date(y, m, closeThis);
    start = new Date(y, m - 1, Math.min(closingDay, daysInMonth(y, m - 1)) + 1);
  } else {
    start = new Date(y, m, closeThis + 1);
    end = new Date(y, m + 1, Math.min(closingDay, daysInMonth(y, m + 1)));
  }
  return { start: localDateStr(start), end: localDateStr(end) };
}

function cardInvoiceTotal(cardId, closingDay){
  var period = currentInvoicePeriod(closingDay);
  return state.txs.filter(function(t){

  }).reduce(function(s,t){ return s + Number(t.value); }, 0);
}

// Quantas parcelas faltam, e em que mês termina.
//
// Se a pessoa preencheu "Parcelas totais" na hora de cadastrar, usa isso
// direto — parcelas pagas = parcelas totais × % já quitado (mesmo % da
// barra de progresso), sem estimativa nenhuma. Sem esse campo, cai pra
// simulação mês-a-mês (mesma da Análise de quitação, com 1 dívida só e sem
// extra), que já lida com juro comendo o pagamento (maxedOut) sozinha.
function debtParcelasRestantes(d){
  var total = Number(d.total_value) || 0;
  var remaining = Number(d.remaining_value) || 0;
  var totalParcelas = parseInt(d.total_installments, 10);
  if(totalParcelas > 0){
    var pct = total > 0 ? Math.min(1, Math.max(0, (total - remaining) / total)) : 0;
    var pagas = Math.round(totalParcelas * pct);
    var restantes = Math.max(0, totalParcelas - pagas);
    var terminaManual = new Date();
    terminaManual.setMonth(terminaManual.getMonth() + restantes);
    return { meses: restantes, termina: terminaManual, manual: true, pagas: pagas, totalParcelas: totalParcelas };
  }
  var payment = Number(d.monthly_payment) || 0;
  if(payment <= 0) return null;
  var r = simulateDebtPayoff([d], 0, "avalanche");
  if(r.maxedOut) return { travada: true };
  var termina = new Date();
  termina.setMonth(termina.getMonth() + r.months);
  return { meses: r.months, termina: termina };
}

// Simula o pagamento das dívidas mês a mês: aplica juros, paga a parcela
// mínima de cada uma, e joga toda sobra (extra + parcelas já quitadas) na
// dívida prioritária da estratégia. Isso é o método real de "bola de neve"/
// "avalanche" — o orçamento mensal total fica fixo, só a ordem de ataque muda.
function simulateDebtPayoff(debtsInput, extraMonthly, strategy){
  var debts = debtsInput.map(function(d){
    return { name: d.name, remaining: Number(d.remaining_value), rate: Number(d.interest_rate)/100, minPayment: Number(d.monthly_payment) };
  }).filter(function(d){ return d.remaining > 0; });
  if(!debts.length) return { months: 0, totalInterest: 0, order: [], maxedOut: false };

  var totalBudget = debts.reduce(function(s,d){ return s + d.minPayment; }, 0) + Number(extraMonthly || 0);
  var order = debts.slice().sort(function(a,b){
    return strategy === "avalanche" ? (b.rate - a.rate) : (a.remaining - b.remaining);
  });

  var totalInterest = 0, months = 0, payoffOrder = [];
  var maxMonths = 600;

  while(order.some(function(d){ return d.remaining > 0.01; }) && months < maxMonths){
    months++;
    order.forEach(function(d){
      if(d.remaining > 0){
        var interest = d.remaining * d.rate;
        totalInterest += interest;
        d.remaining += interest;
      }
    });
    var budgetLeft = totalBudget;
    order.forEach(function(d){
      if(d.remaining > 0){
        var pay = Math.min(d.minPayment, d.remaining, budgetLeft);
        d.remaining -= pay;
        budgetLeft -= pay;
      }
    });
    for(var i=0;i<order.length && budgetLeft>0.01;i++){
      var d = order[i];
      if(d.remaining > 0){
        var pay = Math.min(d.remaining, budgetLeft);
        d.remaining -= pay;
        budgetLeft -= pay;
      }
    }
    // Passo separado, fora do for acima: uma dívida pode ter zerado só com o
    // pagamento mínimo (antes do extra) e o for de orçamento extra pode nem
    // chegar a visitá-la (se acabar o budget antes ou se extraMonthly for 0) —
    // sem isso, ela quitava mas nunca entrava no payoffOrder.
    order.forEach(function(d){
      if(d.remaining <= 0.01 && payoffOrder.indexOf(d.name) === -1) payoffOrder.push(d.name);
    });
  }
  return { months: months, totalInterest: totalInterest, order: payoffOrder, maxedOut: months>=maxMonths };
}

function runDebtSimulation(){
  var extra = desmascararDinheiro(state.debtExtraPayment) || 0;
  var activeDebts = state.debts.filter(function(d){ return Number(d.remaining_value) > 0; });
  var avalanche = simulateDebtPayoff(activeDebts, extra, "avalanche");
  var snowball = simulateDebtPayoff(activeDebts, extra, "snowball");
  var best = avalanche.maxedOut && snowball.maxedOut ? null :
    (avalanche.maxedOut ? "snowball" : snowball.maxedOut ? "avalanche" : (avalanche.totalInterest <= snowball.totalInterest ? "avalanche" : "snowball"));
  state.debtSim = { avalanche: avalanche, snowball: snowball, best: best };
  render();
}

function saveDebt(){
  var name = (debtForm.name || "").trim();
  var total = desmascararDinheiro(debtForm.totalValue) || 0;
  var remaining = debtForm.remainingValue === "" ? total : (desmascararDinheiro(debtForm.remainingValue) || 0);
  var rate = parseFloat(debtForm.interestRate) || 0;
  var payment = desmascararDinheiro(debtForm.monthlyPayment) || 0;
  var dueDay = parseInt(debtForm.dueDay, 10);
  var totalInstallments = debtForm.totalInstallments === "" ? null : parseInt(debtForm.totalInstallments, 10);
  if(!name || total <= 0 || remaining < 0 || remaining > total || rate < 0 || payment < 0){ render(); return; }
  if(totalInstallments !== null && (!isFinite(totalInstallments) || totalInstallments <= 0)) totalInstallments = null;
  var payload = {
    user_id: uid(), name: name, category: debtForm.category, total_value: total,
    remaining_value: remaining, interest_rate: rate, monthly_payment: payment,
    due_day: (dueDay >= 1 && dueDay <= 31) ? dueDay : null,
    total_installments: totalInstallments
  };
  state.debtSaveError = null;
  db("debts", "POST", payload).then(function(rows){
    if(rows && rows[0]) state.debts.push(rows[0]);
    resetDebtForm();
    state.debtSim = null;
    render();
  }).catch(function(err){
    state.debtSaveError = (err && err.message) || "Erro desconhecido";
    render();
  });
}

}

function splitEqually(){
  var total = desmascararDinheiro(splitForm.total) || 0;
  var n = splitForm.participants.length;
  if(!total || !n) return;
  var base = Math.floor(total / n * 100) / 100;
  var sum = 0;
  splitForm.participants.forEach(function(p, i){
    if(i === n - 1){
      p.value = (total - sum).toFixed(2);
    } else {
      p.value = base.toFixed(2);
      sum += base;
    }
  });
}

function saveSplit(){
  var total = desmascararDinheiro(splitForm.total);
  var valid = splitForm.participants.filter(function(p){ return p.name && desmascararDinheiro(p.value) > 0; });
  if(!splitForm.description || !total || total <= 0 || !valid.length){ render(); return; }
  var payload = {
    user_id: uid(), description: splitForm.description, category: splitForm.category,
    total_value: total, date: splitForm.date
  };
  state.splitError = null;
  db("splits", "POST", payload).then(function(rows){
    var split = rows && rows[0];
    if(!split) return Promise.reject(new Error("Falha ao criar a racha"));
    var participantsPayload = valid.map(function(p){
      return { user_id: uid(), split_id: split.id, name: p.name, value: desmascararDinheiro(p.value) };
    });
    return db("split_participants", "POST", participantsPayload).then(function(prows){
      state.splits.unshift(split);
      state.splitParticipants = state.splitParticipants.concat(prows || []);
      resetSplitForm();
      render();
    }).catch(function(err){
      // A racha foi criada mas os participantes falharam — desfaz pra não
      // sobrar uma racha órfã sem ninguém, e pra permitir tentar de novo
      // sem risco de duplicar a racha em si.
      return db("splits", "DELETE", null, { id: "eq." + split.id, user_id: "eq." + uid() }).catch(function(){}).then(function(){
        throw err;
      });
    });
  }).catch(function(err){
    state.splitError = (err && err.message) || "Erro desconhecido";
    render();
  });
}

function toggleParticipantPaid(id){
  var p = state.splitParticipants.filter(function(x){ return x.id === id; })[0];
  if(!p) return;
  var prevPaid = p.paid;
  p.paid = !p.paid;
  render();
  db("split_participants", "PATCH", { paid: p.paid }, { id: "eq." + id, user_id: "eq." + uid() }).catch(function(err){
    p.paid = prevPaid;
    state.splitError = "Não consegui atualizar (" + ((err && err.message) || "erro") + "). Tenta de novo.";
    render();
  });
}

function deleteSplit(id){
  var existing = state.splits.filter(function(s){ return s.id === id; })[0];
  if(!existing) return;
  var existingParticipants = state.splitParticipants.filter(function(p){ return p.split_id === id; });
  state.splits = state.splits.filter(function(s){ return s.id !== id; });
  state.splitParticipants = state.splitParticipants.filter(function(p){ return p.split_id !== id; });
  render();
  db("splits", "DELETE", null, { id: "eq." + id, user_id: "eq." + uid() }).catch(function(err){
    state.splits.push(existing);
    state.splitParticipants = state.splitParticipants.concat(existingParticipants);
    state.splitError = "Não consegui apagar a racha (" + ((err && err.message) || "erro") + "). Tenta de novo.";
    render();
  });
}

function inlineMd(s){
  return s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

function renderMarkdownLite(text){
  var lines = escapeHtml(text || "").split("\n");
  var html = "";
  var listType = null;
  function closeList(){ if(listType){ html += "</" + listType + ">"; listType = null; } }
  lines.forEach(function(line){
    var trimmed = line.trim();
    if(trimmed === ""){ closeList(); return; }
    if(/^-{3,}$/.test(trimmed)){ closeList(); html += "<hr>"; return; }
    var h = trimmed.match(/^(#{1,6})\s+(.*)/);
    if(h){
      closeList();
      var level = Math.min(h[1].length + 2, 6);
      html += "<h" + level + ">" + inlineMd(h[2]) + "</h" + level + ">";
      return;
    }
    var ol = trimmed.match(/^\d+\.\s+(.*)/);
    var ul = trimmed.match(/^[-*]\s+(.*)/);
    if(ol){
      if(listType !== "ol"){ closeList(); html += "<ol>"; listType = "ol"; }
      html += "<li>" + inlineMd(ol[1]) + "</li>";
      return;
    }
    if(ul){
      if(listType !== "ul"){ closeList(); html += "<ul>"; listType = "ul"; }
      html += "<li>" + inlineMd(ul[1]) + "</li>";
      return;
    }
    closeList();
    html += "<p>" + inlineMd(trimmed) + "</p>";
  });
  closeList();
  return html;
}

function buildFinanceSummary(){
  var ym = thisMonth();
  var txs = txsOfMonth(ym);
  var receita = txs.filter(function(t){return t.type==="receita" && isFlowTx(t);}).reduce(function(s,t){return s+Number(t.value);},0);
  var despesa = txs.filter(function(t){return t.type==="despesa" && isFlowTx(t);}).reduce(function(s,t){return s+Number(t.value);},0);
  var byCat = {};
  txs.filter(function(t){return t.type==="despesa" && isFlowTx(t);}).forEach(function(t){ byCat[t.category] = (byCat[t.category]||0) + Number(t.value); });
  var catLines = Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a];})
    .map(function(c){ return "- " + c + ": R$ " + byCat[c].toFixed(2); }).join("\n") || "- (sem despesas)";
  var limLines = state.limits.map(function(l){
    return "- " + l.category + ": gastou R$ " + monthSpentByCat(l.category).toFixed(2) + " de R$ " + Number(l.monthly_limit).toFixed(2);
  }).join("\n") || "- (nenhum limite definido)";
  var goalLines = state.goals.map(function(g){
    return "- " + g.name + ": R$ " + Number(g.saved).toFixed(2) + " de R$ " + Number(g.target).toFixed(2);
  }).join("\n") || "- (nenhuma meta)";
  return "Mês: " + ym + "\nReceita total: R$ " + receita.toFixed(2) + "\nDespesa total: R$ " + despesa.toFixed(2) +
    "\nSaldo: R$ " + (receita-despesa).toFixed(2) + "\n\nDespesas por categoria:\n" + catLines +
    "\n\nLimites:\n" + limLines + "\n\nMetas:\n" + goalLines;
}

    messages: [{ role: "user", content: "Aqui está o resumo das minhas finanças deste mês:\n\n" + summary + "\n\nMe dá uma análise com dicas." }]
  };

      if(res.status === 402){ state.aiError = (res.body && res.body.error && res.body.error.message) || "Finn IA é um recurso premium."; render(); return; }
      if(res.status === 401){ state.aiError = "Sua sessão expirou — recarregue a página e faça login de novo."; render(); return; }
      if(res.body && res.body.content && res.body.content[0] && res.body.content[0].text){

/* ── Bot do Telegram (beta fechado — ver telegramBotVisible) ── */
/* ── Confirmação de posse do número de WhatsApp ──
   Salvar o número em Configurações não prova nada: qualquer pessoa logada
   digitava o número de outra e o servidor aceitava, liberando os lançamentos
   feitos pelo bot daquela pessoa. Agora o app gera um código e a pessoa manda
   ele pro bot pelo próprio WhatsApp — quem não tem o aparelho não consegue. */
function renderWhatsAppLinkCard(meta){
  if(!whatsAppBotVisible()) return "";
  if(!meta.whatsapp) return "";

  if(state.waLinkVerified || meta.whatsapp_verified){
    return '<div class="card">' +
      '<div class="eyebrow">Bot do WhatsApp</div>' +
      '<div style="font-size:12.5px;color:var(--fd)">Número confirmado — o bot já está conectado à sua conta.</div>' +
    '</div>';
  }

  if(state.waLinkCode){
    return '<div class="card" style="border-color:var(--fp)">' +
      '<div class="eyebrow" style="color:var(--fp)">Confirme seu número</div>' +
      '<div style="font-size:12.5px;color:var(--fm);margin-bottom:10px">Mande este código pro bot no WhatsApp. A confirmação acontece sozinha.</div>' +
      '<div style="font-size:24px;font-weight:800;letter-spacing:.18em;text-align:center;padding:12px;border:1px dashed var(--fb);border-radius:10px;margin-bottom:12px">' + escapeHtml(state.waLinkCode) + '</div>' +
      '<a href="https://wa.me/' + WHATSAPP_BOT_NUMBER + '?text=' + encodeURIComponent(state.waLinkCode) + '" target="_blank" rel="noopener" class="btn-submit" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box">Abrir WhatsApp com o código</a>' +
      (state.waLinkMsg ? '<div class="ai-result" style="margin-top:10px">' + escapeHtml(state.waLinkMsg) + '</div>' : '') +
    '</div>';
  }

  return '<div class="card" style="border-color:var(--fp)">' +
    '<div class="eyebrow" style="color:var(--fp)">Confirme seu número</div>' +
    '<div style="font-size:12.5px;color:var(--fm);margin-bottom:12px">Pra proteger seus dados, o bot só responde e sincroniza depois que você provar que este número é seu.</div>' +
    '<button type="button" class="btn-submit" id="btnConnectWhatsApp"' + (state.waLinking ? " disabled" : "") + '>' + (state.waLinking ? "Gerando código…" : "Conectar WhatsApp") + '</button>' +
    (state.waLinkMsg ? '<div class="ai-result" style="margin-top:10px">' + escapeHtml(state.waLinkMsg) + '</div>' : '') +
  '</div>';
}

// síncrono, então a lista não pisca a cada render) e o servidor é atualizado
// em segundo plano. Se a rede falhar, a marcação continua valendo na hora e
// sobe na próxima vez — perder o progresso por causa de sinal ruim seria o
// pior desfecho pra um recurso que existe pra encorajar.
//
// Guardamos só o id da lição e a data. Nada de tempo de leitura ou rolagem:
// não é preciso pra função e é telemetria de comportamento a mais.
function aprenderKey(){ return "finn_aprender_" + (uid() || "anon"); }
function aprenderLidas(){
  try { return JSON.parse(localStorage.getItem(aprenderKey()) || "[]"); }
  catch(e){ return []; }
}
function aprenderSalvarLocal(lista){
  try { localStorage.setItem(aprenderKey(), JSON.stringify(lista)); } catch(e){}
}
function aprenderMarcar(id){
  var lidas = aprenderLidas();
  if(lidas.indexOf(id) === -1){
    lidas.push(id);
    aprenderSalvarLocal(lidas);
  }
  if(!uid()) return;
  // on_conflict: marcar de novo não pode virar erro nem linha duplicada.
  db("lesson_progress", "POST", { user_id: uid(), lesson_id: id }, { on_conflict: "user_id,lesson_id" })
    .catch(function(){ /* fica só no cache; sobe no próximo carregamento */ });
}
function aprenderDesmarcar(id){
  aprenderSalvarLocal(aprenderLidas().filter(function(x){ return x !== id; }));
  if(!uid()) return;
  db("lesson_progress", "DELETE", null, { user_id: "eq." + uid(), lesson_id: "eq." + id })
    .catch(function(){});
}
function aprenderLida(id){ return aprenderLidas().indexOf(id) !== -1; }

// Puxa o progresso do servidor e funde com o que está no aparelho. União, não
// substituição: quem leu no celular sem rede e depois abriu no computador não
// pode perder nem uma marcação nem a outra.
function carregarProgressoAprender(){
  if(!uid()) return Promise.resolve();
  return db("lesson_progress", "GET", null, { select: "lesson_id", user_id: "eq." + uid() })
    .then(function(linhas){
      var doServidor = (linhas || []).map(function(l){ return l.lesson_id; });
      var local = aprenderLidas();
      var unidas = doServidor.slice();
      var faltando = [];
      local.forEach(function(id){
        if(unidas.indexOf(id) === -1){ unidas.push(id); faltando.push(id); }
      });
      aprenderSalvarLocal(unidas);
      // O que só existia neste aparelho sobe agora.
      if(faltando.length){
        db("lesson_progress", "POST",
           faltando.map(function(id){ return { user_id: uid(), lesson_id: id }; }),
           { on_conflict: "user_id,lesson_id" }).catch(function(){});
      }
      if(state.tab === "aprender") render();
    })
    .catch(function(){ /* sem rede: segue com o cache local */ });
}

function aprenderLicaoPorId(id){
  for(var i = 0; i < APRENDER_TRILHAS.length; i++){
    var tr = APRENDER_TRILHAS[i];
    for(var j = 0; j < tr.licoes.length; j++){
      if(tr.licoes[j].id === id) return { trilha: tr, licao: tr.licoes[j], indice: j };
    }
  }
  return null;
}

// Caixa "no seu Finn": pega o conceito da lição e mostra com o dado real da
// pessoa. É o que a planilha e o blog não fazem — e o que faz a lição sair
// do abstrato. Cada tipo tem que degradar bem quando ainda não há dado.
function aprenderCaixaFinn(tipo){
  if(!tipo) return "";
  var txt = "", acao = "", aba = "";
  if(tipo === "streak"){
    var s = computeStreak();
    txt = s >= 2
      ? "Você está registrando há <b>" + s + " dias seguidos</b>. É exatamente o hábito desta lição."
      : "Você ainda não tem uma sequência de registro. Comece hoje — é o passo desta lição.";
    acao = "Ir para Adicionar"; aba = "adicionar";
  } else if(tipo === "saldo"){
    // Mesmo filtro isFlowTx do resto do app: sem ele, transferência entre
    // contas entraria como receita e a "sobra" viraria um número mentiroso.
    var txsMes = txsOfMonth(thisMonth());
    var rec = txsMes.filter(function(t){ return t.type === "receita" && isFlowTx(t); })
                    .reduce(function(a, t){ return a + Number(t.value); }, 0);
    var des = txsMes.filter(function(t){ return t.type === "despesa" && isFlowTx(t); })
                    .reduce(function(a, t){ return a + Number(t.value); }, 0);
    var sobra = rec - des;
    var pct = rec > 0 ? Math.round(sobra / rec * 100) : null;
    txt = (rec > 0 || des > 0)
      ? "Neste mês entraram " + fmtMoney(rec) + " e saíram " + fmtMoney(des) + ". Sua sobra é <b>" + fmtMoney(sobra) + "</b>" +
        (pct !== null ? ", ou seja, <b>" + pct + "%</b> do que entrou." : ".")
      : "Você ainda não lançou nada neste mês, então não dá pra calcular sua sobra.";
    acao = "Ver análises"; aba = "analises";
  } else if(tipo === "fixas"){
    var n = (state.fixed || []).length;
    txt = n > 0
      ? "Você tem <b>" + n + "</b> conta fixa cadastrada" + (n > 1 ? "s" : "") + ". Vale revisar uma por uma e perguntar: usei isso no último mês?"
      : "Você ainda não cadastrou contas fixas. É lá que as assinaturas esquecidas aparecem.";
    acao = "Ver contas fixas"; aba = "fixas";
  } else if(tipo === "cartoes"){
    txt = "Seus cartões e faturas ficam na aba Cartões — é onde dá pra ver o total já comprometido nos próximos meses.";
    acao = "Ver cartões"; aba = "cartoes";
  } else if(tipo === "dividas"){
    var d = (state.debts || []).length;
    txt = d > 0
      ? "Você tem <b>" + d + "</b> dívida cadastrada" + (d > 1 ? "s" : "") + ". O Finn calcula em quantos meses cada uma acaba no ritmo atual."
      : "Se você tem dívida, cadastre na aba Dívidas — o Finn mostra em quantos meses ela acaba e quanto o juro custa.";
    acao = "Ver dívidas"; aba = "dividas";
  } else if(tipo === "metas"){
    var m = (state.goals || []).length;
    txt = m > 0
      ? "Você tem <b>" + m + "</b> meta" + (m > 1 ? "s" : "") + " em andamento. O Finn mostra quanto falta e quanto guardar por mês."
      : "Você ainda não criou nenhuma meta. Comece pela reserva de emergência.";
    acao = "Ver metas"; aba = "metas";
  } else if(tipo === "limites"){
    var l = (state.limits || []).length;
    txt = l > 0
      ? "Você tem <b>" + l + "</b> limite definido" + (l > 1 ? "s" : "") + ". Limite não é proibição — é aviso antes de estourar."
      : "Você ainda não definiu limites por categoria. É a forma prática de aplicar um orçamento.";
    acao = "Ver limites"; aba = "limites";
  }
  if(!txt) return "";
  return '<div class="apr-finn">' +
    '<div class="apr-finn-tag">No seu Finn</div>' +
    '<div class="apr-finn-txt">' + txt + '</div>' +
    (aba ? '<button type="button" class="btn-ghost btn-inline" data-aprir="' + aba + '">' + escapeHtml(acao) + '</button>' : '') +
  '</div>';
}

function renderAprender(){
  // Lição aberta
  if(state.aprenderLicao){
    var achou = aprenderLicaoPorId(state.aprenderLicao);
    if(!achou) { state.aprenderLicao = null; return renderAprender(); }
    var lic = achou.licao, tr = achou.trilha;
    var lida = aprenderLida(lic.id);
    var proxima = tr.licoes[achou.indice + 1];

    var nvNome = (APRENDER_NIVEIS.filter(function(n){ return n.id === tr.nivel; })[0] || {}).nome || "";
    return '<div class="card">' +
      '<button type="button" class="btn-ghost btn-inline" id="btnAprVoltar" style="margin-bottom:12px">← Todas as lições</button>' +
      '<div class="eyebrow" style="margin:0">' + escapeHtml(tr.icone + " " + tr.nome) +
        (nvNome ? ' <span class="apr-nivel apr-nivel-' + tr.nivel + '">' + escapeHtml(nvNome) + '</span>' : '') + '</div>' +
      '<h2 style="font-size:20px;font-weight:800;color:var(--fd);margin:8px 0 4px;line-height:1.25">' + escapeHtml(lic.titulo) + '</h2>' +
      '<div style="font-size:12px;color:var(--fm);margin-bottom:16px">' + lic.minutos + ' min de leitura</div>' +
      (lic.video
        // Embutir (iframe) depende do dono do vídeo permitir incorporação —
        // canais institucionais (Banco Central, por ex.) costumam bloquear.
        // Miniatura clicável que abre no YouTube funciona sempre, pra
        // qualquer vídeo, sem essa dependência.
        ? '<a class="apr-video" href="https://www.youtube.com/watch?v=' + encodeURIComponent(lic.video) + '" target="_blank" rel="noopener">' +
            '<img src="https://img.youtube.com/vi/' + encodeURIComponent(lic.video) + '/hqdefault.jpg" alt="" loading="lazy">' +
            '<span class="apr-video-play">▶</span>' +
            '<span class="apr-video-tag">Assistir no YouTube ↗</span>' +
          '</a>'
        : '') +
      lic.corpo.map(function(p){
        return '<p class="apr-p">' + p + '</p>';
      }).join("") +
      (lic.pratica
        ? '<div class="apr-pratica"><div class="apr-pratica-tag">Pratique</div><div>' + escapeHtml(lic.pratica) + '</div></div>'
        : '') +
      aprenderCaixaFinn(lic.finn) +
      '<button type="button" class="' + (lida ? "btn-ghost" : "btn-submit") + '" id="btnAprLida" style="width:100%;margin-top:16px">' +
        (lida ? "✓ Lição concluída — desmarcar" : "Marcar como concluída") + '</button>' +
      (proxima
        ? '<button type="button" class="btn-ghost" id="btnAprProxima" data-apr="' + proxima.id + '" style="width:100%;margin-top:8px">Próxima: ' + escapeHtml(proxima.titulo) + ' →</button>'
        : '') +
    '</div>';
  }

  // Índice
  var lidas = aprenderLidas().length;
  var total = aprenderTotalLicoes();
  var pct = total ? Math.round(lidas / total * 100) : 0;

  var html = '<div class="card" style="background:var(--fdk);border-color:var(--fdk)">' +
    '<div class="eyebrow" style="color:var(--fp);margin-bottom:6px">Aprender · grátis pra sempre</div>' +
    '<div style="font-size:17px;font-weight:800;color:#fff;line-height:1.3">Educação financeira que ninguém te deu na escola</div>' +
    '<div style="font-size:13px;color:#CBD5E1;margin-top:8px;line-height:1.5">' +
      'Sem enrolação e sem vender nada. São ' + total + ' lições curtas, em português claro, ' +
      'ligadas aos seus próprios números.</div>' +
  '</div>';

  if(lidas > 0){
    html += '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">' +
        '<div class="eyebrow" style="margin:0">Seu progresso</div>' +
        '<div style="font-size:13px;font-weight:800;color:var(--fp)">' + lidas + ' de ' + total + '</div>' +
      '</div>' +
      '<div class="apr-barra"><div class="apr-barra-fill" style="width:' + pct + '%"></div></div>' +
    '</div>';
  }

  APRENDER_AREAS.forEach(function(area){
    var trilhasDaArea = APRENDER_TRILHAS.filter(function(t){ return t.area === area.id; });
    if(!trilhasDaArea.length) return;
    var licoesArea = trilhasDaArea.reduce(function(a, t){ return a + t.licoes.length; }, 0);
    var feitasArea = trilhasDaArea.reduce(function(a, t){
      return a + t.licoes.filter(function(l){ return aprenderLida(l.id); }).length;
    }, 0);

    html += '<div class="apr-area">' +
      '<span class="apr-area-ic">' + area.icone + '</span>' +
      '<span class="apr-area-txt">' +
        '<span class="apr-area-nome">' + escapeHtml(area.nome) + '</span>' +
        '<span class="apr-area-res">' + escapeHtml(area.resumo) + '</span>' +
      '</span>' +
      '<span class="apr-area-cnt">' + feitasArea + '/' + licoesArea + '</span>' +
    '</div>';

  trilhasDaArea.forEach(function(tr){
    var feitas = tr.licoes.filter(function(l){ return aprenderLida(l.id); }).length;
    var nvNome = (APRENDER_NIVEIS.filter(function(n){ return n.id === tr.nivel; })[0] || {}).nome || "";
    html += '<div class="card">' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">' +
        '<span style="font-size:22px;line-height:1">' + tr.icone + '</span>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-weight:800;font-size:15px;color:var(--fd)">' + escapeHtml(tr.nome) +
            (nvNome ? ' <span class="apr-nivel apr-nivel-' + tr.nivel + '">' + escapeHtml(nvNome) + '</span>' : '') + '</div>' +
          '<div style="font-size:12px;color:var(--fm)">' + escapeHtml(tr.resumo) + '</div>' +
        '</div>' +
        '<div style="font-size:11.5px;color:' + (feitas === tr.licoes.length ? "var(--fs)" : "var(--fm)") + ';font-weight:700;flex-shrink:0">' +
          feitas + '/' + tr.licoes.length + '</div>' +
      '</div>' +
      '<div style="margin-top:10px">' +
        tr.licoes.map(function(l){
          var ok = aprenderLida(l.id);
          return '<button type="button" class="apr-item" data-apr="' + l.id + '">' +
            '<span class="apr-check' + (ok ? " apr-check-ok" : "") + '">' + (ok ? "✓" : "") + '</span>' +
            '<span class="apr-item-txt">' +
              '<span class="apr-item-tit">' + escapeHtml(l.titulo) + '</span>' +
              '<span class="apr-item-min">' + l.minutos + ' min</span>' +
            '</span>' +
            '<span class="apr-seta">→</span>' +
          '</button>';
        }).join("") +
      '</div>' +
    '</div>';
  });
  });

  // Aviso obrigatório: educação, não consultoria. Fica no fim, sem alarde,
  // mas presente — o conteúdo fala de dívida e investimento, e a fronteira
  // entre explicar e recomendar precisa estar escrita em algum lugar.
  html += '<div class="card">' +
    '<div style="font-size:11.5px;color:var(--fm);line-height:1.6">' +
      '<b>Sobre este conteúdo.</b> É material educativo: explica como as coisas funcionam para você decidir melhor. ' +
      '<b>Não é recomendação de investimento, consultoria nem análise de valores mobiliários</b> — atividades reguladas ' +
      'pela CVM. O Finn não indica produto, corretora ou banco, não recebe comissão de nenhum deles, e nada aqui é ' +
      'sugestão de compra ou venda.' +
      '<br><br>' +
      'Os valores e taxas citados são exemplos para ilustrar o mecanismo. Regras tributárias, limites de isenção e ' +
      'coberturas mudam com frequência — confira sempre a regra vigente na fonte oficial antes de decidir.' +
    '</div>' +
  '</div>';

  return html;
}

// Cartão da Planilha Finn. O token vive só aqui e no Google Sheets da pessoa
// — nunca é gravado em lugar nenhum do app além do que a própria pessoa vê.
// A sincronização é do Pro. A compra única dá o arquivo, não o sync — e a
// tela precisa dizer isso com clareza pra quem comprou e não entende por que
// o botão de conectar não aparece.
function planilhaSyncLiberado(){
  if(!PREMIUM_ENFORCEMENT_ENABLED) return true;
  if(isMasterUser() && state.adminUnlocked) return true;
  return state.plan === "pro";
}

          (state.planilhaLoading ? "Gerando…" : "Conectar planilha") + '</button>') +

// Entrega da planilha. Dois caminhos, e a ORDEM importa: o link de cópia do
// Google Sheets deixa a planilha pronta e online em um clique, já com o
// script de sincronização junto. O .xlsx existe pra quem prefere Excel ou
// quer guardar o arquivo — mas exige subir no Drive na mão, então é o
// segundo caminho, não o primeiro.
function renderPlanilhaEntrega(){
  var tokenUrl = "/planilha/baixar?access_token=" +
    encodeURIComponent((currentSession && currentSession.access_token) || "");
  return '<div style="border:1px solid var(--fb);border-radius:12px;padding:14px;margin-top:10px">' +
    '<div style="font-weight:800;font-size:14px">Planilha Finn ✓</div>' +
    '<div style="font-size:12.5px;color:var(--fm);margin:4px 0 12px">Ela é sua para sempre. Pegue do jeito que preferir:</div>' +
    (state.planilhaCopia
      ? '<a href="' + escapeHtml(state.planilhaCopia) + '" target="_blank" rel="noopener" class="btn-submit" ' +
          'style="display:block;text-align:center;text-decoration:none;box-sizing:border-box;margin-bottom:8px">' +
          'Abrir no Google Sheets</a>' +
        '<div style="font-size:11.5px;color:var(--fm);margin:-2px 0 12px">' +
          'Um clique: o Google cria uma cópia sua, já online e pronta pra usar.</div>'
      : '<div style="font-size:11.5px;color:var(--fm);margin-bottom:12px">' +
          'A versão online (Google Sheets) ainda não está publicada. Use o arquivo abaixo: ' +
          'suba no Google Drive e abra com Google Planilhas — a conversão é automática.</div>') +
    '<a href="' + escapeHtml(tokenUrl) + '" class="btn-ghost" ' +
      'style="display:block;text-align:center;text-decoration:none;box-sizing:border-box">' +
      'Baixar em Excel (.xlsx)</a>' +
    '<div style="font-size:11.5px;color:var(--fm);margin-top:8px">' +
      'O .xlsx abre no Excel, no LibreOffice e no Google Sheets. As fórmulas são as mesmas.</div>' +
  '</div>';
}

function comprarPlanilha(){
  state.planilhaComprando = true;
  state.checkoutError = null;
  render();
  fetch("/billing/comprar-planilha", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ access_token: currentSession && currentSession.access_token })
  }).then(function(r){ return r.json().then(function(j){ return { status: r.status, body: j }; }); })
    .then(function(res){
      if(res.status === 200 && res.body && res.body.url){
        window.location.href = res.body.url;
        return;
      }
      state.planilhaComprando = false;
      state.checkoutError = (res.body && res.body.error) || "Não consegui abrir o pagamento.";
      // 409 = já comprou. Atualiza a tela em vez de só mostrar erro.
      if(res.status === 409){ state.planilhaComprou = true; state.checkoutError = null; }
      render();
    })
    .catch(function(){
      state.planilhaComprando = false;
      state.checkoutError = "Falha de conexão.";
      render();
    });
}

function carregarStatusPlanilha(){
  if(!currentSession) return;
  fetch("/billing/planilha-status?access_token=" + encodeURIComponent(currentSession.access_token))
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j || !j.ok) return;
      state.planilhaComprou = !!j.comprou;
      if(j.preco) state.planilhaPreco = j.preco;
      state.planilhaCopia = j.copia || null;
      render();
    })
    .catch(function(){});
}

function planilhaChamar(metodo){
  state.planilhaLoading = true; state.planilhaErro = null; state.planilhaMsg = null;
  render();
  fetch("/sheets/token", {
    method: metodo,
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ access_token: currentSession && currentSession.access_token })
  }).then(function(r){ return r.json().then(function(j){ return { status: r.status, j: j }; }); })
    .then(function(res){
      state.planilhaLoading = false;
      if(res.status !== 200){
        state.planilhaErro = "Não consegui agora. Tente de novo em instantes.";
      } else if(metodo === "DELETE"){
        state.planilhaToken = null;
        state.planilhaMsg = "Planilha desconectada. O token antigo não vale mais.";
      } else {
        state.planilhaToken = res.j.token;
        state.planilhaMsg = "Token gerado. Cole na aba Config da planilha.";
      }
      render();
    })
    .catch(function(){
      state.planilhaLoading = false;
      state.planilhaErro = "Falha de conexão.";
      render();
    });
}

function renderConteudo(){

  '</div>';

  // Disparo manual de story. Existe pra diagnóstico: o cron roda em horário

  html += '<div class="card">' +

        escapeHtml(state.storyTesteResultado.texto) + '</div>'
      : '') +

  // ── formulário de envio ──

    '<div class="eyebrow">Novo item</div>' +
    '<div class="form-row"><label>Tipo</label>' +
      '<select id="conteudoKind">' +
        '<option value="feed"' + (state.conteudoKind === "feed" ? " selected" : "") + '>Post no feed (quadrado, com legenda)</option>' +

    (state.conteudoKind === "reels"
      ? '<div class="form-row"><label>Capa (opcional)</label>' +
        '<input type="file" id="conteudoCapa" accept="image/png,image/jpeg,image/webp"></div>' +
        '<div style="font-size:12px;color:var(--fm);margin:-8px 0 12px">Sem capa, o Instagram escolhe um frame do próprio vídeo.</div>'
      : '') +
    (state.conteudoKind === "story"
      ? '<div style="font-size:12px;color:var(--fm);margin:-8px 0 12px">Story ignora legenda — o Instagram não mostra texto de caption nesse formato.</div>'
      : '<div class="form-row"><label>Legenda</label>' +
        '<textarea id="conteudoLegenda" rows="5" placeholder="Texto do post, com hashtags no fim">' + escapeHtml(state.conteudoLegenda) + '</textarea></div>') +
    '<button type="button" class="btn-submit" id="btnConteudoEnviar"' + (state.conteudoEnviando ? " disabled" : "") + '>' +
      (state.conteudoEnviando ? "Enviando…" : "Adicionar à fila") + '</button>' +
    (state.conteudoMsg ? '<div class="ai-result" style="margin-top:10px">' + escapeHtml(state.conteudoMsg) + '</div>' : '') +
    (state.conteudoErro ? '<div class="ai-error" style="margin-top:10px">' + escapeHtml(state.conteudoErro) + '</div>' : '') +
  '</div>';

  // ── republicar um post da campanha embutida ──
  // Um post apagado do Instagram (por erro de texto, por exemplo) não volta
  // sozinho: o contador da campanha só anda pra frente. Aqui ele entra na fila
  // do Supabase, que tem prioridade sobre a campanha — então sai no próximo
  // horário, com a arte já corrigida.
  var emb = state.embutidos;

    '<div class="eyebrow">Publicar de novo um post da campanha</div>' +
    '<div style="font-size:12.5px;color:var(--fm);margin-bottom:12px">Reenfileira o post <b>e o story dele</b> juntos, com a arte atual. Serve pra quando um post foi apagado do Instagram.</div>' +
    (emb
      ? '<div class="form-row"><label>Post</label><select id="embutidoSel">' +

          }).join('') +
        '</select></div>' +
        '<button type="button" class="btn-submit" id="btnReenfileirar"' + (state.reenfileirando ? " disabled" : "") + '>' +
          (state.reenfileirando ? "Colocando na fila…" : "Colocar na fila") + '</button>'

    (state.reenfileirarMsg

  // ── fila ──
