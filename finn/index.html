  var vb = screenerValorOrdenacao(b, chave);
  // Linha sem o dado vai sempre pro fim, nos dois sentidos: ordenar por P/L
  // não pode fazer quem não tem P/L "ganhar" o topo só por estar vazio.
  if(va === null && vb === null) return a.ticker < b.ticker ? -1 : 1;
  if(va === null) return 1;
  if(vb === null) return -1;
  return va < vb ? -dir : (va > vb ? dir : 0);
}

// Escala máxima da nota vinda do servidor. Lê a primeira linha que de fato tem
// nota: linhas[0] muda com a ordenação e uma linha de erro nunca chega a ler
// nota.escalaMaxima — nasce com o padrão 25 e faria o cabeçalho mentir se os
// pesos mudassem.
function screenerEscalaMaxima(linhas){
  for(var i = 0; i < (linhas || []).length; i++){
    if(linhas[i] && linhas[i].score !== null && linhas[i].score !== undefined && linhas[i].scoreMax) return linhas[i].scoreMax;
  }
  return (linhas && linhas[0] && linhas[0].scoreMax) || 25;
}

function screenerOrdenarPor(chave){
  var col = null;
  for(var i = 0; i < SCREENER_COLS.length; i++){
    if(SCREENER_COLS[i].key === chave) col = SCREENER_COLS[i];
  }
  if(!col) return;
  if(state.screenerSort === chave){
    state.screenerSortDir = state.screenerSortDir === "asc" ? "desc" : "asc";
  } else {
    state.screenerSort = chave;
    state.screenerSortDir = col.dir;
  }
  render();
}

function screenerAlternarDetalhe(ticker){
  state.screenerExpandedTicker = state.screenerExpandedTicker === ticker ? null : ticker;
  render();
}

function screenerAvisosHtml(){
  return '<div class="scr-note"><b>De onde vêm esses números:</b> são dados públicos de mercado da B3, buscados num provedor de cotações. Não têm nenhuma relação com o Open Finance nem com a sua conta bancária — o Finn não olha o seu dinheiro para montar esta lista.</div>' +
    '<div class="scr-note"><b>Isto é apoio, não é recomendação:</b> a nota é uma conta simples em cima de 5 indicadores públicos. Serve para você comparar papéis e saber o que pesquisar — não para decidir por você. Nada aqui é indicação de compra ou venda.</div>';
}

// Resumo curto de por que a nota não saiu, pra caber na célula. O texto
// completo do backend fica no detalhe — aqui só o suficiente pra separar
// "faltou dado" de "empresa ruim".
function screenerMotivoCurto(linha){
  // Cobertura incompleta é o caso comum e o mais informativo. Só vale quando
  // é MENOR que o total: escrever "só 5 de 5" seria confissão de que a tela
  // não sabe o motivo, disfarçada de explicação.
  if(linha.cobertura !== null && linha.cobertura !== undefined &&
     linha.coberturaTotal && linha.cobertura < linha.coberturaTotal){
    var falta = linha.notaMinimo !== null && linha.notaMinimo !== undefined ? (" (mínimo " + screenerFmtPontos(linha.notaMinimo) + ")") : "";
    return "só " + screenerFmtPontos(linha.cobertura) + " de " + screenerFmtPontos(linha.coberturaTotal) + " indicadores" + falta;
  }
  return linha.notaMotivo || "";
}

function screenerScoreHtml(linha){
  if(screenerEhFundo(linha)){
    return '<span class="scr-na" style="font-size:11.5px;font-weight:700">sem nota</span>' +
      '<div class="scr-name">fundo imobiliário</div>';
  }
  // Traço seco é a pior resposta possível: num screener o usuário lê "—" como
  // "empresa ruim" ou "app quebrado". O backend escreve o motivo em português
  // (nota.motivo) — mesmo padrão que o FII já usa logo acima.
  if(linha.score === null){
    var curto = screenerMotivoCurto(linha);
    // Sem nenhuma explicação vinda do servidor, o traço seco continua sendo a
    // resposta honesta — inventar um motivo seria pior que não dizer nada.
    if(!curto) return '<span class="scr-na">—</span>';
    return '<span class="scr-na" style="font-size:11.5px;font-weight:700">sem nota</span>' +
      '<div class="scr-name" title="' + escapeHtml(linha.notaMotivo || curto) + '">' + escapeHtml(curto) + '</div>';
  }
  var max = linha.scoreMax > 0 ? linha.scoreMax : 25;
  var pct = Math.max(0, Math.min(100, Math.round(linha.score / max * 100)));
  return '<span class="scr-scoreval">' + screenerFmtPontos(linha.score) + '/' + screenerFmtPontos(max) + '</span>' +
    '<div class="bar"><i style="width:' + Math.max(3, pct) + '%;background:' + screenerCor(pct) + '"></i></div>';
}

function screenerDetalheHtml(linha){
  if(linha.estado === "erro"){
    return '<div class="ai-error" style="margin-top:12px">' + escapeHtml(linha.erro || "Não consegui buscar este papel.") + '</div>';
  }
  if(linha.estado !== "ok"){
    return '<div class="scr-det-cob">Buscando os dados deste papel…</div>';
  }
  // Divisão igual só vale enquanto todos os indicadores pesam o mesmo. Quando
  // o backend manda pontosMaximos por indicador (que é o caso), é ele que
  // manda — senão um peso diferente faria a barra e o rótulo mentirem.
  var maxPadrao = (linha.scoreMax > 0 ? linha.scoreMax : 25) / SCREENER_INDICADORES.length;
  var html = '<div class="import-summary" style="margin-top:12px">Como a nota foi montada</div>';

  if(screenerEhFundo(linha)){
    html += '<div class="scr-note" style="margin-top:0"><b>Isto é um fundo imobiliário, não uma empresa.</b> Fundo não tem P/L, ROE nem margem no sentido de uma companhia: ele quase não tem dívida e a margem dele é perto de 100% por construção. Aplicar a nota de ações aqui daria pontuação alta de graça, por dois indicadores que o fundo ganha sem mérito nenhum. Por isso não damos nota — olhe o dividend yield e, quando existir, o P/VP.' +
      // O número existe (o backend calcula e só depois se recusa a publicá-lo
      // como nota) e mostrá-lo é o ponto: é ele que não vale.
      // NÃO exibir aqui uma "nota que daria": num FII, roe/margem/dívida são
      // zerados pelo backend, então a conta sobraria em cima de P/L e DY —
      // exatamente os dois que NÃO inflam a nota de fundo. Seria um número
      // fabricado numa tela de investimento, e contradiz o motivo de o fundo
      // não receber nota. O honesto é mostrar os indicadores e parar aí.
      '' +
    '</div>';
  } else if(linha.score === null && linha.notaMotivo){
    // Sem nota, o detalhe é o lugar de dizer o porquê por extenso.
    html += '<div class="scr-note neutro" style="margin-top:0"><b>Sem nota neste papel.</b> ' + escapeHtml(linha.notaMotivo) + '</div>';
  }

  SCREENER_INDICADORES.forEach(function(meta){
    var ind = linha.ind[meta.key] || {};
    var temPontos = ind.pontos !== null && ind.pontos !== undefined;
    var maxInd = (ind.pontosMax !== null && ind.pontosMax !== undefined && ind.pontosMax > 0) ? ind.pontosMax : maxPadrao;
    var pct = temPontos && maxInd > 0 ? Math.max(0, Math.min(100, Math.round(ind.pontos / maxInd * 100))) : 0;
    var porque;
    if(temPontos){
      porque = screenerFmtPontos(ind.pontos) + " de " + screenerFmtPontos(maxInd) + " pontos (" + screenerRotuloPontos(ind.pontos, maxInd) + ")";
      if(ind.faixa) porque += " · " + ind.faixa;
    } else if(ind.motivo){
      // O motivo do backend é o que separa "faltou dado" de "não se aplica a
      // este setor" — a frase mais útil do painel inteiro.
      porque = "Fora da conta da nota: " + ind.motivo;
    } else if(ind.valor === null || ind.valor === undefined){
      porque = "Sem dado — este indicador fica fora da conta da nota.";
    } else {
      porque = "O servidor não mandou os pontos deste indicador.";
    }
    if(ind.flag) porque += " · Atenção: " + screenerFlagTexto(ind.flag);
    // Discreto de propósito: a nota é confiável, isto só registra que a escala
    // saiu da mediana dos 15 e não foi confirmada no próprio papel.
    // Só quando o indicador TEM valor: o aviso de escala num indicador sem dado
    // ("fica fora da conta da nota · escala lida do conjunto…") é contraditório —
    // não há valor nenhum cuja escala tenha sido lida.
    if(ind.valor !== null && ind.valor !== undefined && screenerEscalaDoLote(linha, meta)) porque += " · escala lida do conjunto dos papéis, não deste papel sozinho.";
    html += '<div class="scr-det-item">' +
      '<div class="scr-det-head"><span class="scr-det-name">' + escapeHtml(meta.label) + '</span>' +
        '<span class="scr-det-val">' + escapeHtml(screenerFmtValor(meta, ind)) + '</span></div>' +
      '<div class="bar"><i style="width:' + (temPontos ? Math.max(3, pct) : 0) + '%;background:' + (temPontos ? screenerCor(pct) : "var(--fb)") + '"></i></div>' +
      '<div class="scr-det-why">' + escapeHtml(porque) + '</div>' +
      '<div class="scr-det-hint">' + escapeHtml(meta.leitura) + '</div>' +
    '</div>';
  });

  var cob = linha.cobertura === null ? 0 : linha.cobertura;
  html += '<div class="scr-det-cob">Cobertura: ' + escapeHtml(screenerFmtPontos(cob)) + ' de ' + escapeHtml(screenerFmtPontos(linha.coberturaTotal)) + ' indicadores entraram na conta. ' +
    (cob >= linha.coberturaTotal ? 'A nota viu tudo.' : 'O que faltou fica fora da conta — não conta como zero, mas a nota enxergou menos coisa.') + '</div>';

  if(linha.cacheStale){
    var idade = screenerIdadeTexto(linha.cacheIdade);
    html += '<div class="scr-note neutro"><b>Este número não é do momento.</b> É o último dado guardado' +
      (idade ? ', de ' + escapeHtml(idade) : '') + '.' +
      (linha.cacheMotivo ? ' Motivo: ' + escapeHtml(linha.cacheMotivo) + '.' : '') + '</div>';
  }

  if(linha.aviso) html += '<div class="scr-note neutro">' + escapeHtml(linha.aviso) + '</div>';
  return html;
}

function screenerTagHtml(linha){
  var tags = screenerEhFundo(linha) ? '<span class="scr-tag fundo">FII</span>' : "";
  // Preço de dado guardado (até 6 h) desenhado igual a preço de agora faz o
  // usuário comparar papéis achando que é tudo do mesmo instante. O selo com a
  // idade é o mínimo — o motivo completo fica no detalhe.
  if(linha.cacheStale){
    var idade = screenerIdadeTexto(linha.cacheIdade);
    tags += '<span class="scr-tag" title="' + escapeHtml(linha.cacheMotivo || "último dado guardado") + '">' +
      escapeHtml(idade || "dado guardado") + '</span>';
  }
  return tags;
}

function screenerTabelaHtml(linhas){
  var cabecalho = SCREENER_COLS.map(function(c){
    var ativa = state.screenerSort === c.key;
    return '<th class="' + (c.num ? "num" : "") + (ativa ? " on" : "") + '" data-scrsort="' + escapeHtml(c.key) + '">' +
      escapeHtml(c.label) +
      (ativa ? '<span class="scr-arrow">' + (state.screenerSortDir === "asc" ? "▲" : "▼") + '</span>' : '') +
    '</th>';
  }).join("");

  var corpo = linhas.map(function(l){
    var aberta = state.screenerExpandedTicker === l.ticker;
    var celulaPapel = '<td><span class="scr-tick">' + escapeHtml(l.ticker) + '</span>' + screenerTagHtml(l) +
      (l.nome ? '<div class="scr-name">' + escapeHtml(l.nome) + '</div>' : '') + '</td>';
    var tr = '<tr class="scr-row' + (aberta ? " on" : "") + '" data-scrticker="' + escapeHtml(l.ticker) + '">' + celulaPapel;
    if(l.estado === "erro"){
      tr += '<td class="scr-erro" colspan="' + (SCREENER_COLS.length - 1) + '">' + escapeHtml(l.erro || "Não consegui buscar este papel.") + '</td>';
    } else if(l.estado !== "ok"){
      tr += '<td class="scr-na" colspan="' + (SCREENER_COLS.length - 1) + '">buscando…</td>';
    } else {
      tr += '<td class="num">' + (l.preco === null ? '<span class="scr-na">—</span>' : escapeHtml(fmtMoney(l.preco))) + '</td>';
      SCREENER_INDICADORES.forEach(function(meta){
        var ind = l.ind[meta.key] || {};
        var texto = screenerFmtValor(meta, ind);
        tr += '<td class="num' + (texto === "—" ? " scr-na" : "") + '">' + escapeHtml(texto) + '</td>';
      });
      tr += '<td class="num scr-scorewrap">' + screenerScoreHtml(l) + '</td>';
    }
    tr += '</tr>';
    if(aberta){
      tr += '<tr class="scr-detrow"><td colspan="' + SCREENER_COLS.length + '">' + screenerDetalheHtml(l) + '</td></tr>';
    }
    return tr;
  }).join("");

  return '<table class="scr-table"><thead><tr>' + cabecalho + '</tr></thead><tbody>' + corpo + '</tbody></table>';
}

function screenerSortbarHtml(){
  return '<div class="scr-sortlbl">Ordenar por</div><div class="scr-sortbar">' + SCREENER_COLS.map(function(c){
    var ativa = state.screenerSort === c.key;
    return '<button type="button" class="' + (ativa ? "on" : "") + '" data-scrsort="' + escapeHtml(c.key) + '">' +
      escapeHtml(c.label) +
      (ativa ? '<span class="scr-arrow">' + (state.screenerSortDir === "asc" ? "▲" : "▼") + '</span>' : '') +
    '</button>';
  }).join("") + '</div>';
}

function screenerCardsHtml(linhas){
  return '<div class="scr-cards">' + linhas.map(function(l){
    var aberta = state.screenerExpandedTicker === l.ticker;
    var h = '<div class="scr-card' + (aberta ? " on" : "") + '">';
    // O clique fica no bloco de resumo, não no cartão inteiro: com o detalhe
    // aberto dentro do cartão, clicar em qualquer texto do detalhe fecharia
    // tudo de novo.
    h += '<div class="scr-card-btn" data-scrticker="' + escapeHtml(l.ticker) + '">';
    h += '<div class="scr-card-top"><div class="scr-card-id">' +
      '<span class="scr-tick">' + escapeHtml(l.ticker) + '</span>' + screenerTagHtml(l) +
      (l.nome ? '<div class="scr-name">' + escapeHtml(l.nome) + '</div>' : '') +
    '</div>' +
    '<div class="scr-card-preco">' + (l.preco === null ? '<span class="scr-na">—</span>' : escapeHtml(fmtMoney(l.preco))) + '</div></div>';
    if(l.estado === "erro"){
      h += '<div class="scr-erro" style="margin-top:8px">' + escapeHtml(l.erro || "Não consegui buscar este papel.") + '</div>';
    } else if(l.estado !== "ok"){
      h += '<div class="scr-na" style="margin-top:8px;font-size:11.5px">buscando…</div>';
    } else {
      h += '<div class="scr-card-grid">' + SCREENER_INDICADORES.map(function(meta){
        var ind = l.ind[meta.key] || {};
        return '<div class="scr-kv"><span class="scr-k">' + escapeHtml(meta.curto) + '</span>' +
          '<span class="scr-v">' + escapeHtml(screenerFmtValor(meta, ind)) + '</span></div>';
      }).join("") + '</div>';
      h += '<div class="scr-card-score">' + screenerScoreHtml(l) + '</div>';
    }
    h += '</div>';
    if(aberta) h += '<div class="scr-card-det">' + screenerDetalheHtml(l) + '</div>';
    return h + '</div>';
  }).join("") + '</div>';
}

function renderScreener(){
  if(!isMasterUser() || !state.adminUnlocked) return "";

  var html = '<div class="card">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:2px">' +
      '<div class="eyebrow" style="margin:0">Screener de ações</div>' +
      '<button type="button" class="btn-ghost" id="btnScreenerRefresh" style="padding:6px 12px;font-size:11.5px"' + (state.screenerLoading ? " disabled" : "") + '>' + (state.screenerLoading ? "Atualizando…" : "Atualizar agora") + '</button>' +
    '</div>' +
    '<div style="font-size:11.5px;color:var(--fm)">' + SCREENER_TICKERS.length + ' papéis da B3. Toque num papel para ver de onde saiu cada ponto da nota.</div>' +
    screenerAvisosHtml() +
  '</div>';

  if(state.screenerProgress){
    var feitos = state.screenerProgress.feitos;
    var total = state.screenerProgress.total;
    // No caminho de lote é uma requisição só: não há "N de 15" honesto pra
    // mostrar, e inventar um contador que anda sozinho seria pior que dizer a
    // verdade. A barra fica indeterminada (um terço) só pra tela não parecer
    // travada — são segundos de espera.
    var emLote = state.screenerProgress.lote === true;
    var pctProg = emLote ? 33 : (total > 0 ? Math.round(feitos / total * 100) : 0);
    html += '<div class="card">' +
      '<div class="scr-progress">' + (emLote ? ('Carregando os ' + total + ' papéis numa consulta só…') : ('Carregando ' + feitos + ' de ' + total + ' papéis…')) + '</div>' +
      '<div class="bar"><i style="width:' + Math.max(3, pctProg) + '%"></i></div>' +
    '</div>';
  }

  // Sem a chave do provedor nenhum papel carrega, então mostrar a tabela toda
  // vermelha só repetiria 15 vezes o mesmo recado.
  if(state.screenerTokenMissing){
    html += '<div class="card"><div class="eyebrow">Falta configurar o BRAPI_TOKEN</div>' +
      '<div class="ai-error" style="margin-top:0">O servidor respondeu que a chave do provedor de cotações não está configurada. Sem ela não dá pra buscar preço nem indicador nenhum.</div>' +
      '<div style="font-size:12px;color:var(--fm);margin-top:10px">Isso é configuração do worker (finn-serve), não é problema da sua conta: cadastre o segredo <b>BRAPI_TOKEN</b> e tente de novo.</div>' +
      '<button type="button" class="btn-submit" id="btnScreenerRetry" style="margin-top:10px">Tentar de novo</button></div>';
    return html;
  }

  if(!state.screenerData){
    if(state.screenerError){
      html += '<div class="card"><div class="ai-error" style="margin-top:0">' + escapeHtml(state.screenerError) + '</div>' +
        '<button type="button" class="btn-submit" id="btnScreenerRetry" style="margin-top:10px">Tentar de novo</button></div>';
    } else {
      html += '<div class="card"><div style="font-size:12.5px;color:var(--fm);margin-bottom:10px">Uma consulta só, com os ' + SCREENER_TICKERS.length + ' papéis juntos — carrega em poucos segundos. Vir tudo junto não é detalhe de velocidade: é o que permite decidir a escala de cada indicador comparando os papéis entre si.</div>' +
        '<button type="button" class="btn-submit" id="btnScreenerLoad">Carregar screener</button></div>';
    }
    return html;
  }

  if(!state.screenerData.length){
    html += '<div class="card"><div class="empty-state">Nenhum papel na lista do screener.</div></div>';
    return html;
  }

  // Erro global (nenhum papel carregou) aparece acima da tabela, mas não
  // substitui a tela: a linha de cada papel ainda diz o que aconteceu com ele.
  if(state.screenerError){
    html += '<div class="card"><div class="ai-error" style="margin-top:0">' + escapeHtml(state.screenerError) + '</div>' +
      '<button type="button" class="btn-submit" id="btnScreenerRetry" style="margin-top:10px">Tentar de novo</button></div>';
  }

  var linhas = state.screenerData.slice().sort(screenerCompara);
  var temFundo = false;
  var temVelho = false;
  linhas.forEach(function(l){
    if(screenerEhFundo(l)) temFundo = true;
    if(l.cacheStale) temVelho = true;
  });

  html += '<div class="card">' +
    '<p style="font-size:14px;font-weight:800;margin:0 0 2px">Comparativo</p>' +
    '<p style="font-size:12px;color:var(--fm);margin:0 0 12px">Nota de 0 a ' + escapeHtml(screenerFmtPontos(screenerEscalaMaxima(linhas))) + ', somando 5 indicadores. Toque no papel para abrir o detalhe.</p>' +
    // Aviso de dado velho ANTES da tabela: depois dela o usuário já comparou.
    (temVelho ? '<div class="scr-note neutro" style="margin-top:0;margin-bottom:12px"><b>Parte destes números não é do momento.</b> Os papéis marcados com a idade ao lado do código vêm do último dado guardado — a fonte de cotações não respondeu agora. Abra o papel para ver o motivo.</div>' : '') +
    screenerSortbarHtml() +
    '<div class="scr-tablewrap">' + screenerTabelaHtml(linhas) + '</div>' +
    screenerCardsHtml(linhas) +
    (temFundo ? '<div class="scr-note neutro"><b>Sobre os FII da lista:</b> MXRF11 e HGLG11 são fundos imobiliários e aparecem sem nota de propósito. Não é nota baixa — é que P/L, ROE e margem não querem dizer nada num fundo, e a conta de ações premiaria os dois de graça por não terem dívida. Para fundo, olhe o dividend yield.</div>' : '') +
    // O aviso completo está no topo da aba, a 200px de rolagem no celular —
    // e é aqui, ao lado das barras coloridas, que a tela mais parece dar uma
    // indicação. Por isso a versão curta se repete junto da nota.
    '<div class="scr-note"><b>Nota é comparação, não indicação:</b> ela ordena papéis por 5 indicadores públicos e não diz nada sobre comprar ou vender.</div>' +
  '</div>';

  return html;
}

function setAdminPlan(email, plan){
  state.adminError = null;
  fetch("/admin/subscriptions/set", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ access_token: currentSession && currentSession.access_token, target_email: email, plan: plan, admin_password: state.adminPassword })
  }).then(function(r){ return r.json().then(function(j){ return { status: r.status, body: j }; }); })
    .then(function(res){
      if(res.status === 200){
        loadAdminSubscriptions();
      } else {
        state.adminError = (res.body && res.body.error) || "Não consegui salvar.";
        render();
      }
    }).catch(function(){
      state.adminError = "Falha de conexão.";
      render();
    });
}

function saveProfileName(){
  var nameInput = document.getElementById("cfgName");
  var waInput = document.getElementById("cfgWhatsapp");
  var dailyDashboardInput = document.getElementById("cfgDailyDashboard");
  var name = (nameInput ? nameInput.value : "").trim();
  var whatsapp = normalizePhone(waInput ? waInput.value : "");
  if(!name) return;
  var metaFields = { full_name: name, whatsapp: whatsapp };
  if(dailyDashboardInput) metaFields.daily_dashboard_optin = dailyDashboardInput.checked;
  Auth.updateMetadata(currentSession.access_token, metaFields).then(function(user){
    if(user && user.id){
      currentSession.user = user;
      var stored = JSON.parse(localStorage.getItem(SESSION_KEY) || "{}");
      stored.user = user;
      localStorage.setItem(SESSION_KEY, JSON.stringify(stored));
    }
    state.configMsg = whatsapp ? "Salvo. Conectando o bot do WhatsApp aos seus dados..." : "Salvo.";
    render();
    return syncWhatsAppBot();
  }).then(function(){
    if(whatsapp){ state.configMsg = "Salvo. Bot do WhatsApp conectado."; render(); }
  }).catch(function(){
    state.configMsg = "Não consegui salvar agora.";
    render();
  });
}

function addCustomCategory(){
  var input = document.getElementById("cfgNewCat");
  var name = (input ? input.value : "").trim();
  if(!name) return;
  if(allCategories().some(function(c){ return c.toLowerCase() === name.toLowerCase(); })){
    state.configMsg = "Essa categoria já existe.";
    render();
    return;
  }
  db("categories", "POST", { user_id: uid(), name: name }).then(function(rows){
    if(rows && rows[0]) state.customCategories.push(rows[0]);
    state.configMsg = null;
    render();
  }).catch(function(err){
    state.configMsg = "Não consegui adicionar (" + (err && err.message ? err.message : "erro") + ").";
    render();
  });
}

function deleteCustomCategory(id){
  state.customCategories = state.customCategories.filter(function(c){ return c.id !== id; });
  render();
  db("categories", "DELETE", null, { id: "eq." + id, user_id: "eq." + uid() }).catch(function(){});
}

// Exclui só os lançamentos DE UM MÊS — pedido explícito, porque antes só
// existia apagar um lançamento por vez ou "Excluir todos" (Configurações,
// função abaixo). Mesmo padrão de dupla confirmação da exclusão total.
//
// Filtra pelos IDS já carregados no cliente, não por intervalo de data no
// servidor: db() usa URLSearchParams.set(), que só guarda UM valor por
// chave — "date gte X" e "date lt Y" na mesma chave "date" se
// sobrescreveriam. Com os ids em mãos (state.txs já tem o mês inteiro
// carregado), um filtro id=in.(...) resolve com uma chave só.
function deleteMonthTransactions(ym){
  var alvo = txsOfMonth(ym);
  if(!alvo.length) return;
  var label = ym.split("-").reverse().join("/");
  if(!window.confirm("Isso vai apagar os " + alvo.length + " lançamento(s) de " + label + " (receitas e despesas). Essa ação não pode ser desfeita. Continuar?")) return;
  if(!window.confirm("Tem certeza mesmo? Não tem como recuperar depois.")) return;
  var ids = alvo.map(function(t){ return t.id; });
  var receiptPaths = alvo.map(function(t){ return t.receipt_path; }).filter(Boolean);
  // Fatiado em lotes: os ids vao na QUERY STRING, e o URLSearchParams
  // percent-encoda cada virgula (%2C), dando ~39 bytes por lancamento. Quem
  // importa o extrato do banco fecha o mes com centenas de lancamentos — 250
  // ja passam de 10 KB de URL e o gateway do Supabase devolve 414 antes de
  // chegar no PostgREST. Ou seja: justamente quem mais precisa do "excluir o
  // mes" era quem nao conseguia usar.
  var LOTE = 100;
  var lotes = [];
  for(var i = 0; i < ids.length; i += LOTE) lotes.push(ids.slice(i, i + LOTE));
  lotes.reduce(function(cadeia, lote){
    return cadeia.then(function(){
      return db("transactions", "DELETE", null, { id: "in.(" + lote.join(",") + ")", user_id: "eq." + uid() });
    });
  }, Promise.resolve()).then(function(){
    state.txs = state.txs.filter(function(t){ return ids.indexOf(t.id) === -1; });
    state.txSaveError = null;
    render();
    receiptPaths.forEach(deleteReceiptObject);
  }).catch(function(err){
    state.txSaveError = "Não consegui apagar os lançamentos de " + label + " (" + (err && err.message ? err.message : "erro") + "). Tenta de novo.";
    render();
  });
}

function deleteAllTransactions(){
  if(!window.confirm("Isso vai apagar TODOS os seus lançamentos (receitas e despesas). Limites, metas, contas fixas e categorias não são afetados. Essa ação não pode ser desfeita. Continuar?")) return;
  if(!window.confirm("Tem certeza mesmo? Não tem como recuperar depois.")) return;
  var receiptPaths = state.txs.map(function(t){ return t.receipt_path; }).filter(Boolean);
  db("transactions", "DELETE", null, { user_id: "eq." + uid() }).then(function(){
    state.txs = [];
    state.configMsg = "Todos os lançamentos foram excluídos.";
    render();
    receiptPaths.forEach(deleteReceiptObject);
  }).catch(function(err){
    state.configMsg = "Não consegui apagar os lançamentos (" + (err && err.message ? err.message : "erro") + "). Tenta de novo.";
    render();
  });
}

function deleteAllData(){
  if(!window.confirm("Isso vai apagar TODOS os seus lançamentos, limites, metas, contas fixas, cartões, dívidas, rachas e categorias. Essa ação não pode ser desfeita. Continuar?")) return;
  if(!window.confirm("Tem certeza mesmo? Não tem como recuperar depois.")) return;
  var receiptPaths = state.txs.map(function(t){ return t.receipt_path; }).filter(Boolean);
  var tables = ["transactions", "spending_limits", "goals", "fixed_accounts", "splits", "categories", "debts"];
  Promise.all(tables.map(function(t){
    return db(t, "DELETE", null, { user_id: "eq." + uid() });
  })).then(function(){
    receiptPaths.forEach(deleteReceiptObject);
    return db("credit_cards", "DELETE", null, { user_id: "eq." + uid() }).catch(function(){});
  }).then(function(){
    return Auth.logout(currentSession.access_token);
  }).then(function(){
    currentSession = null;
    showLogin();
  }).catch(function(err){
    state.configMsg = "Não consegui apagar tudo (" + (err && err.message ? err.message : "erro") + "). Tenta de novo.";
    render();
  });
}

var lastRenderedTab = null;
function render(){
  document.querySelectorAll(".tab-btn").forEach(function(btn){
    btn.classList.toggle("active", btn.dataset.tab === state.tab);
  });
  // No modo admin as abas de finança pessoal saem do menu — a conta master
  // está ali pra gerir o produto, não pra lançar o próprio mercado. O botão
  // "Voltar pro Finn normal" traz tudo de volta.
  var emAdmin = adminModeAtivo();
  document.querySelectorAll(".nav-menu .tab-btn").forEach(function(btn){
    btn.style.display = emAdmin ? "none" : "";
  });
  // As telas de gestão só aparecem no modo admin (antes bastava estar
  // desbloqueado, e elas ficavam penduradas no menu normal).
  ["btnAdminHomeNav","btnAdminAssinaturasNav","btnAdminInstagramNav","btnAdminWhatsAppNav","btnAdminAnalyticsNav","btnAdminIaNav","btnScreenerNav","btnBetaAdminNav","btnMetaAdsNav","btnConteudoNav"].forEach(function(id){
    var b = document.getElementById(id);
    if(b) b.style.display = emAdmin ? "" : "none";
  });
  // O botão de alternar aparece pra master desbloqueada nos DOIS modos —
  // é a única porta de entrada e de saída.
  var btnToggleAdminMode = document.getElementById("btnToggleAdminMode");
  if(btnToggleAdminMode){
    var podeAlternar = isMasterUser() && state.adminUnlocked;
    btnToggleAdminMode.style.display = podeAlternar ? "" : "none";
    btnToggleAdminMode.textContent = emAdmin ? "Voltar pro Finn normal" : "Ir pro modo admin";
  }
  var btnGuiaNav = document.getElementById("btnGuiaNav");
  if(btnGuiaNav) btnGuiaNav.style.display = emAdmin ? "none" : "";
  var content = document.getElementById("content");
  if(state.loading){
    content.innerHTML = '<div class="empty-state">Carregando…</div>';
    return;
  }
  if(state.loadError){
    content.innerHTML = '<div class="card"><div class="ai-error">Não consegui carregar seus dados (' + escapeHtml(state.loadError) + ').</div>' +
      '<button type="button" class="btn-submit" id="btnRetryLoad" style="margin-top:10px">Tentar de novo</button></div>';
    var retry = document.getElementById("btnRetryLoad");
    if(retry) retry.addEventListener("click", function(){ loadData(); });
    return;
  }
  // Só reanima a troca de tela quando a aba muda de verdade — se animasse a
  // cada render() (também disparado por editar um lançamento, marcar uma
  // categoria etc.), o conteúdo ficaria piscando de opacidade a cada clique
  // dentro da mesma aba, que é o oposto de "mais leve".
  var tabChanged = state.tab !== lastRenderedTab;
  lastRenderedTab = state.tab;
  if(state.tab === "dashboard") content.innerHTML = renderDashboard();
  else if(state.tab === "adicionar") content.innerHTML = renderAdicionar();
  else if(state.tab === "analises") content.innerHTML = renderAnalises();
  else if(state.tab === "lancamentos") content.innerHTML = renderLancamentos();
  else if(state.tab === "limites") content.innerHTML = renderLimites();
  else if(state.tab === "metas") content.innerHTML = renderMetas();
  else if(state.tab === "fixas") content.innerHTML = renderFixas();
  else if(state.tab === "cartoes") content.innerHTML = renderCartoes();
  else if(state.tab === "dividas") content.innerHTML = renderDividas();
  else if(state.tab === "racha") content.innerHTML = renderRacha();
  else if(state.tab === "ia") content.innerHTML = renderIA();
  else if(state.tab === "aprender") content.innerHTML = renderAprender();
  else if(state.tab === "adminHome") content.innerHTML = renderAdminHome();
  else if(state.tab === "adminAssinaturas") content.innerHTML = renderAdminAssinaturas();
  else if(state.tab === "conteudo") content.innerHTML = renderConteudo();
  else if(state.tab === "adminInstagram") content.innerHTML = renderAdminInstagram();
  else if(state.tab === "adminWhatsApp") content.innerHTML = renderAdminWhatsApp();
  else if(state.tab === "adminAnalytics") content.innerHTML = renderAdminAnalytics();
  else if(state.tab === "adminIa") content.innerHTML = renderAdminIa();
  else if(state.tab === "screener") content.innerHTML = renderScreener();
  else if(state.tab === "adminBeta") content.innerHTML = renderAdminBeta();
  else if(state.tab === "metaAds") content.innerHTML = renderMetaAds();
  else content.innerHTML = renderConfig();
  if(tabChanged){
    window.scrollTo(0, 0);
    content.classList.remove("view-enter");
    void content.offsetWidth;
    content.classList.add("view-enter");
  }
  bindContentEvents();
}

/* ── transaction CRUD ── */
function saveTransaction(){
  var value = desmascararDinheiro(formState.value);
  // Chama render() mesmo saindo cedo — sem isso, o botão desabilitado no
  // clique (pra evitar duplo-envio) ficava travado pra sempre num valor
  // inválido, já que nenhum outro render() aconteceria depois.
  if(!value || value <= 0){ render(); return; }
  var fields = {
    type: formState.type,
    category: formState.category,
    description: formState.description || formState.category,
    value: value,
    date: formState.date
  };
  if(state.cards.length) fields.card_id = formState.type === "despesa" ? (formState.cardId || null) : null;
  state.txSaveError = null;
  if(formState.editingId){
    var id = formState.editingId;
    var original = state.txs.filter(function(t){ return t.id === id; })[0];
    var categoryChanged = original && original.category !== fields.category;
    db("transactions", "PATCH", fields, { id: "eq." + id, user_id: "eq." + uid() }).then(function(rows){
      var updated = (rows && rows[0]) ? rows[0] : null;
      state.txs = state.txs.map(function(t){
        return t.id === id ? (updated || Object.assign({}, t, fields)) : t;
      });
      sortTxs(); resetForm(); state.tab = "lancamentos";
      if(categoryChanged){
        var siblings = state.txs.filter(function(t){
          return t.id !== id && t.type === fields.type && normDesc(t.description) === normDesc(fields.description) && t.category !== fields.category;
        });
        if(siblings.length){
          state.bulkCatPrompt = { ids: siblings.map(function(t){ return t.id; }), description: fields.description, category: fields.category };
        }
      }
      checkPriceAnomaly(fields.type, fields.description, fields.value, id);
      render();
    }).catch(function(err){
      state.txSaveError = (err && err.message) || "Erro desconhecido";
      render();
    });
  } else {
    var payload = Object.assign({ user_id: uid() }, fields);
    db("transactions", "POST", payload).then(function(rows){
      if(rows && rows[0]) state.txs.unshift(rows[0]);
      sortTxs();
      formState.value = ""; formState.description = "";
      checkPriceAnomaly(fields.type, fields.description, fields.value, rows && rows[0] && rows[0].id);
      render();
    }).catch(function(err){
      state.txSaveError = (err && err.message) || "Erro desconhecido";
      render();
    });
  }
}

function fixInvestmentCategories(){
  var ids = [];
  state.txs.forEach(function(t){
    if(t.category === "Investimento") return;
    var guessed = guessCategory(t.description || "");
    if(guessed === "Investimento") ids.push(t.id);
  });
  if(!ids.length){
    state.configMsg = "Nenhum lançamento precisava de correção. Já está tudo certo.";
    render();
    return;
  }
  state.txs = state.txs.map(function(t){
    return ids.indexOf(t.id) !== -1 ? Object.assign({}, t, { category: "Investimento" }) : t;
  });
  state.configMsg = "Corrigindo " + ids.length + " lançamento(s)...";
  render();
  db("transactions", "PATCH", { category: "Investimento" }, { id: "in.(" + ids.join(",") + ")", user_id: "eq." + uid() }).then(function(){
    state.configMsg = ids.length + " lançamento(s) reclassificado(s) como Investimento.";
    render();
  }).catch(function(err){
    state.configMsg = "Reclassifiquei localmente, mas não consegui salvar tudo no banco (" + (err && err.message ? err.message : "erro") + "). Tenta de novo.";
    render();
  });
}

function deleteTransaction(id){
  var existing = state.txs.filter(function(t){ return t.id === id; })[0];
  if(!existing) return;
  if(existing.type === "despesa") incMaosDeTesoura();
  var receiptPath = existing.receipt_path;
  state.txs = state.txs.filter(function(t){ return t.id !== id; });
  if(formState.editingId === id) resetForm();
  render();
  db("transactions", "DELETE", null, { id: "eq." + id, user_id: "eq." + uid() }).then(function(){
    if(receiptPath) deleteReceiptObject(receiptPath);
  }).catch(function(err){
    state.txs.push(existing);
    sortTxs();
    // Desfaz tambem o contador do "Maos de tesoura": ele era incrementado
    // antes do DELETE e nao voltava atras, entao clicar em excluir sem rede
    // cinco vezes desbloqueava a conquista secreta sem nenhuma exclusao ter
    // acontecido de verdade.
    if(existing.type === "despesa") decMaosDeTesoura();
    state.txSaveError = "Não consegui apagar (" + ((err && err.message) || "erro") + "). Tenta de novo.";
    render();
  });
}

/* ── comprovante (foto/recibo) ── */
function deleteReceiptObject(path){
  var token = (currentSession && currentSession.access_token) || SUPA_KEY;
  fetch(SUPA_URL + "/storage/v1/object/receipts/" + path, {
    method: "DELETE",
    headers: { apikey: SUPA_KEY, Authorization: "Bearer " + token }
  }).catch(function(){});
}

function uploadReceipt(file, txId){
  state.receiptUploadingId = txId;
  state.receiptMsg = null;
  render();
  var path = uid() + "/" + txId + "-" + Date.now() + "-" + file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
  var token = (currentSession && currentSession.access_token) || SUPA_KEY;
  fetch(SUPA_URL + "/storage/v1/object/receipts/" + path, {
    method: "POST",
    headers: { apikey: SUPA_KEY, Authorization: "Bearer " + token, "Content-Type": file.type || "application/octet-stream" },
    body: file
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(t || ("Erro " + r.status)); });
    return db("transactions", "PATCH", { receipt_path: path }, { id: "eq." + txId, user_id: "eq." + uid() });
  }).then(function(rows){
    var updated = rows && rows[0];
    state.txs = state.txs.map(function(t){ return t.id === txId ? (updated || Object.assign({}, t, { receipt_path: path })) : t; });
    state.receiptUploadingId = null;
    render();
  }).catch(function(err){
    state.receiptUploadingId = null;
    state.receiptMsg = "Não consegui anexar o comprovante (" + (err && err.message ? err.message : "erro") + "). Tenta de novo.";
    render();
  });
}

function viewReceipt(path){
  var token = (currentSession && currentSession.access_token) || SUPA_KEY;
  fetch(SUPA_URL + "/storage/v1/object/sign/receipts/" + path, {
    method: "POST",
    headers: { apikey: SUPA_KEY, Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify({ expiresIn: 60 })
  }).then(function(r){ return r.json(); }).then(function(data){
    if(data && data.signedURL) window.open(SUPA_URL + "/storage/v1" + data.signedURL, "_blank");
    else { state.receiptMsg = "Não consegui abrir o comprovante."; render(); }
  }).catch(function(){
    state.receiptMsg = "Não consegui abrir o comprovante.";
    render();
  });
}

  };
  state.goalSaveError = null;
  db("goals", "POST", payload).then(function(rows){

    goalForm = { name: "", target: "", deadline: "" };
    render();

function addToGoal(id, amountStr, direction){
  var amount = desmascararDinheiro(amountStr);
  if(!amount || amount <= 0) return;
  var goal = state.goals.filter(function(g){ return g.id === id; })[0];
  if(!goal) return;
  var sub = direction === "sub";
  var delta = sub ? -amount : amount;
  var newSaved = Math.max(0, Number(goal.saved) + delta);
  var movedAmount = Math.abs(newSaved - Number(goal.saved));
  goal.saved = newSaved;
  render();
  db("goals", "PATCH", { saved: newSaved }, { id: "eq." + id, user_id: "eq." + uid() });
  if(movedAmount > 0){
    var mov = { user_id: uid(), goal_id: id, amount: movedAmount, type: sub ? "retirada" : "deposito", date: todayStr() };
    db("goal_movements", "POST", mov).then(function(rows){
      if(rows && rows[0]) state.goalMovements.unshift(rows[0]);
      render();
    });
  }
}

function deleteGoal(id){
  var existing = state.goals.filter(function(g){ return g.id === id; })[0];
  if(!existing) return;
  state.goals = state.goals.filter(function(g){ return g.id !== id; });
  render();
  db("goals", "DELETE", null, { id: "eq." + id, user_id: "eq." + uid() }).catch(function(err){
    state.goals.push(existing);
    state.goalSaveError = "Não consegui apagar (" + ((err && err.message) || "erro") + "). Tenta de novo.";
    render();
  });
}

  if(!candidate) return;
  var payload = {
    user_id: uid(), type: candidate.type, description: candidate.description,
    category: candidate.category, value: candidate.value, day_of_month: candidate.day
  };
  db("fixed_accounts", "POST", payload).then(function(rows){
    if(rows && rows[0]) state.fixed.push(rows[0]);
    dismissRecurring(key);
  });
}

function launchFixed(id){
  var f = state.fixed.filter(function(x){ return x.id === id; })[0];
  if(!f){ render(); return; }
  var ym = thisMonth();
  var months = (f.launched_months || []).concat([ym]);
  var txPayload = {
    user_id: uid(), type: f.type, category: f.category,
    description: f.description, value: Number(f.value), date: todayStr()
  };
  Promise.all([
    db("transactions", "POST", txPayload),
    db("fixed_accounts", "PATCH", { launched_months: months }, { id: "eq." + id, user_id: "eq." + uid() })
  ]).then(function(res){
    var newTx = res[0] && res[0][0];
    if(newTx) state.txs.unshift(newTx);
    f.launched_months = months;
    sortTxs();
    checkPriceAnomaly(f.type, f.description, Number(f.value), newTx && newTx.id);
    render();
  }).catch(function(err){
    state.fixedSaveError = "Não consegui lançar (" + ((err && err.message) || "erro") + "). Tenta de novo.";
    render();
  });
}

function deleteFixed(id){
  var existing = state.fixed.filter(function(f){ return f.id === id; })[0];
  if(!existing) return;
  state.fixed = state.fixed.filter(function(f){ return f.id !== id; });
  render();
  db("fixed_accounts", "DELETE", null, { id: "eq." + id, user_id: "eq." + uid() }).catch(function(err){
    state.fixed.push(existing);
    state.fixedSaveError = "Não consegui apagar (" + ((err && err.message) || "erro") + "). Tenta de novo.";
    render();
  });
}

// loadCards/loadDebts rodam em paralelo com loadData no login e podem
// terminar bem depois dela — se o usuário já começou a digitar em algum
// formulário quando a resposta chega, um render() aqui recriava o DOM
// inteiro da aba atual e derrubava o que a pessoa tinha acabado de digitar.
// Se o foco estiver num campo de formulário, adia o render: o estado já foi
// atualizado e aparece na próxima renderização natural (submit, troca de aba etc).
function isTypingInForm(){
  var el = document.activeElement;
  var content = document.getElementById("content");
  return !!el && !!content && content.contains(el) &&
    (el.tagName === "INPUT" || el.tagName === "SELECT" || el.tagName === "TEXTAREA");
}

function loadCards(){
  db("credit_cards", "GET", null, { user_id: "eq." + uid(), order: "created_at.asc" }).then(function(rows){
    state.cards = rows || [];
    state.cardsError = null;
    if(!isTypingInForm()) render();
  }).catch(function(err){
    state.cards = [];
    state.cardsError = (err && err.message) || "Erro desconhecido";
    if(!isTypingInForm()) render();
  });
}

// Busca todas as páginas: o limite de 1000 por requisição (padrão do
// PostgREST) cortava lançamentos antigos quando a conta passava de
// 1000 transações, sumindo com meses inteiros sem aviso nenhum.
function dbAll(table, query){
  var pageSize = 1000;
  var all = [];
  function fetchPage(offset){
    var q = Object.assign({}, query, { limit: String(pageSize), offset: String(offset) });
    return db(table, "GET", null, q).then(function(rows){
      rows = rows || [];
      all = all.concat(rows);
      if(rows.length === pageSize) return fetchPage(offset + pageSize);
      return all;
    });
  }
  return fetchPage(0);
}

function loadPlan(){

/* ── one-time purge of leftover service workers from old deploys ──
   A stale SW from a previous version could keep intercepting fetches
   (incl. the update-check below) forever. This now runs only once per
   browser (gated by localStorage) so a SW registered afterwards for
   push notifications isn't immediately killed on the next page load. */
if ("serviceWorker" in navigator && !localStorage.getItem("finn_sw_purge_v1")) {
  var wasSwControlled = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(reg){ reg.unregister(); });
    localStorage.setItem("finn_sw_purge_v1", "1");
    if (wasSwControlled && !sessionStorage.getItem("finn_sw_cleanup_done")) {
      sessionStorage.setItem("finn_sw_cleanup_done", "1");
      window.location.reload();
    }
  });
}
if (window.caches) {
  caches.keys().then(function(keys){
    keys.forEach(function(k){ caches.delete(k); });
  });
}

// Registro do service worker era feito só dentro do fluxo de ativar push —
// então quem nunca clicou em "Ativar notificações" nunca tinha um SW
// instalado, e o "Nova versão disponível" (avisado via postMessage do SW
// quando uma nova versão assume) nunca tinha chance de disparar. Registra
// incondicionalmente, além de deixar o app instalável/offline de verdade.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(function(){});
  navigator.serviceWorker.addEventListener("message", function(e){
    if (e.data && e.data.type === "SW_UPDATED") {
      document.getElementById("updateBanner").classList.add("show");
    }
  });
}

/* ── push notifications ── */
function urlBase64ToUint8Array(base64String){
  var padding = "=".repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  var rawData = atob(base64);
  var out = new Uint8Array(rawData.length);
  for(var i = 0; i < rawData.length; i++) out[i] = rawData.charCodeAt(i);
  return out;
}

function arrayBufferToBase64Url(buffer){
  var bytes = new Uint8Array(buffer);
  var bin = "";
  for(var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function enablePushNotifications(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window)){
    state.pushStatus = "Seu navegador não suporta notificações push.";
    render();
    return;
  }
  state.pushStatus = "Ativando…";
  render();
  navigator.serviceWorker.register("/sw.js").then(function(reg){
    return Notification.requestPermission().then(function(perm){
      if(perm !== "granted") throw new Error("Permissão de notificações negada.");
      return reg.pushManager.getSubscription().then(function(existing){
        return existing || reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
      });
    });
  }).then(function(sub){
    return fetch("/push/subscribe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        endpoint: sub.endpoint,
        keys: {
          p256dh: arrayBufferToBase64Url(sub.getKey("p256dh")),
          auth: arrayBufferToBase64Url(sub.getKey("auth"))
        },
        access_token: currentSession && currentSession.access_token
      })
    });
  }).then(function(r){ return r.json(); }).then(function(j){
    state.pushStatus = (j && j.ok) ? "Notificações ativadas! Você vai receber avisos de contas fixas vencendo." : "Não foi possível ativar agora. Tente de novo.";
    render();
  }).catch(function(err){
    state.pushStatus = "Erro: " + err.message;
    render();
  });
}

/* ── update banner ── */
var knownETag = null;
function checkForUpdate(){
  // cache:"no-store" só controla o cache HTTP do próprio navegador — um CDN/
  // proxy no meio do caminho (ex: domínio próprio atrás do Cloudflare) podia
  // servir uma resposta antiga e o ETag nunca parecia mudar. O parâmetro
  // aleatório força cada checagem a ser uma URL nova, sem chance de cache.
  var bustedUrl = window.location.pathname + "?_swcheck=" + Date.now();
  fetch(bustedUrl, { method: "HEAD", cache: "no-store" }).then(function(r){
    var et = r.headers.get("ETag");
    if(!et) return;
    if(knownETag === null){ knownETag = et; return; }
    if(et !== knownETag){
      document.getElementById("updateBanner").classList.add("show");
    }
  }).catch(function(){});
}
checkForUpdate();
setInterval(checkForUpdate, 5 * 60 * 1000);
document.addEventListener("visibilitychange", function(){
  if(!document.hidden) checkForUpdate();
});

  if(isStandaloneApp || localStorage.getItem("finn_install_dismissed")) return;
  if(isIOSDevice){
    document.getElementById("installBannerText").textContent = 'Instale o Finn: toque em Compartilhar e depois em "Adicionar à Tela de Início".';
    document.getElementById("btnInstallYes").style.display = "none";
  }

}

  e.preventDefault();

  showInstallBanner();
});

});
