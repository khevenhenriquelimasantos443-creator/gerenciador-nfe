    (naFila.length
      ? '<div style="display:flex;flex-direction:column;gap:12px;margin-top:10px">' +
        naFila.map(function(i, idx){
          var thumbSrc = i.kind === "reels"
            ? (i.cover_path ? CONTEUDO_BUCKET_URL + i.cover_path : null)
            : CONTEUDO_BUCKET_URL + i.image_path;
          return '<div class="cont-item">' +
            (thumbSrc
              ? '<img class="cont-thumb" src="' + escapeHtml(thumbSrc) + '" alt="" loading="lazy">'
              : '<div class="cont-thumb" style="display:flex;align-items:center;justify-content:center;font-size:20px">🎬</div>') +
            '<div class="cont-body">' +
              '<div class="cont-tags">' +
                (idx === 0 ? '<span class="cont-badge prox">Próximo</span>' : '') +
                '<span class="cont-badge">' + (i.kind === "story" ? "Story" : i.kind === "reels" ? "Reel" : "Post") + '</span>' +
              '</div>' +
              '<div class="cont-cap">' + escapeHtml(i.caption || "Story — sem legenda") + '</div>' +
              (i.erro ? '<div class="cont-erro">Última tentativa falhou: ' + escapeHtml(i.erro) + '</div>' : '') +
            '</div>' +
            '<button type="button" class="cont-del" data-delconteudo="' + escapeHtml(i.id) + '" title="Excluir da fila">✕</button>' +
          '</div>';
        }).join("") + '</div>'
      : '<div style="font-size:13px;color:var(--fm);margin-top:8px">Fila vazia — enquanto estiver assim, sai a campanha antiga que está embutida no código.</div>') +
  '</div>';

  if(publicados.length){
    html += '<div class="card">' +
      '<div class="eyebrow">Já publicados · ' + publicados.length + '</div>' +
      '<div class="cont-pub">' +
        publicados.slice(0, 24).map(function(i){
          var src = i.kind === "reels" ? i.cover_path : i.image_path;
          if(!src) return '<div title="' + escapeHtml(admDataHora(i.published_at)) + '" style="display:flex;align-items:center;justify-content:center;font-size:16px">🎬</div>';
          return '<img src="' + escapeHtml(CONTEUDO_BUCKET_URL + src) + '" title="' + escapeHtml(admDataHora(i.published_at)) + '" alt="" loading="lazy">';
        }).join("") +
      '</div></div>';
  }
  return html;
}

// Vai direto no worker do bot (é lá que ficam as credenciais do WhatsApp),
// autenticando com a sessão do Supabase + a senha master — o mesmo par que
// as outras rotas admin já usam. Nada de token pra copiar e colar.
//
// campo é o prefixo das chaves de state ("templateStatus" -> Loading e
// Resultado). Sempre mostra veredito em cima e resposta crua embaixo: o
// resumo é pra decidir, o cru é pra descobrir o motivo quando o resumo
// não basta.
function chamarWorkerAdmin(rota, campo, corpo){
  state[campo + "Loading"] = true;
  state[campo + "Resultado"] = null;
  render();
  var opcoes = {
    method: corpo ? "POST" : "GET",
    headers: {
      "Authorization": "Bearer " + ((currentSession && currentSession.access_token) || ""),
      "X-Admin-Password": state.adminPassword || ""
    }
  };
  if(corpo){
    opcoes.headers["Content-Type"] = "application/json";
    opcoes.body = JSON.stringify(corpo);
  }
  fetch(WHATSAPP_WORKER_URL + rota, opcoes)
    .then(function(r){ return r.text().then(function(t){ return { status: r.status, texto: t }; }); })
    .then(function(res){
      state[campo + "Loading"] = false;
      var ok = false, veredito = "";
      try {
        var j = JSON.parse(res.texto);
        ok = !!j.ok;
        if(j.veredito) veredito = j.veredito + "\n\n";
      } catch(e){}
      state[campo + "Resultado"] = { ok: ok, texto: veredito + "HTTP " + res.status + "\n\n" + res.texto };
      render();
    })
    .catch(function(err){
      state[campo + "Loading"] = false;
      state[campo + "Resultado"] = { ok: false, texto: "Falha de conexão com o worker do bot: " + ((err && err.message) || "erro") };
      render();
    });
}

function reenfileirarEmbutido(){
  var sel = document.getElementById("embutidoSel");
  var n = sel ? Number(sel.value) : 0;
  var item = ((state.embutidos && state.embutidos.itens) || []).filter(function(i){ return i.n === n; })[0];
  if(!item) return;
  state.reenfileirando = true;
  state.reenfileirarMsg = null;
  render();
  // O post e o story vão juntos, com a mesma posição: o cron do story publica
  // 25 min depois do post, e se só o post fosse reenfileirado o story do dia
  // seria o da campanha embutida — arte de um post diferente.
  var pos = Math.floor(Date.now() / 1000);
  db("social_posts", "POST", { kind: "feed",  image_path: item.post_url,  caption: item.legenda, posicao: pos })
    .then(function(){
      return db("social_posts", "POST", { kind: "story", image_path: item.story_url, caption: null, posicao: pos });
    })
    .then(function(){
      state.reenfileirando = false;
      state.reenfileirarMsg = { ok:true, texto: "Post " + n + " e o story dele entraram na fila. Saem no próximo horário (10h ou 18h)." };
      loadConteudo();
    })
    .catch(function(err){
      state.reenfileirando = false;
      state.reenfileirarMsg = { ok:false, texto: "Não consegui enfileirar (" + ((err && err.message) || "erro") + ")." };
      render();
    });
}

// Sobe um arquivo pro bucket público "social" e devolve o caminho salvo.
// Nome único: o bucket é cacheado pra sempre (immutable), então reaproveitar
// nome faria um arquivo novo aparecer com o conteúdo antigo.
function _subirArquivoConteudo(arquivo, prefixo){
  var ext = (arquivo.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "");
  var caminho = prefixo + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
  var token = (currentSession && currentSession.access_token) || SUPA_KEY;
  return fetch(SUPA_URL + "/storage/v1/object/social/" + caminho, {
    method: "POST",
    headers: { apikey: SUPA_KEY, Authorization: "Bearer " + token, "Content-Type": arquivo.type || "application/octet-stream" },
    body: arquivo
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(t || ("Erro " + r.status)); });
    return caminho;
  });
}

function enviarConteudo(){
  var arquivo = state.conteudoArquivo;
  var kind = state.conteudoKind;
  if(!arquivo){ state.conteudoErro = kind === "reels" ? "Escolhe um vídeo primeiro." : "Escolhe uma imagem primeiro."; render(); return; }
  if(kind !== "story" && !state.conteudoLegenda.trim()){
    state.conteudoErro = "Esse tipo precisa de legenda."; render(); return;
  }
  state.conteudoEnviando = true;
  state.conteudoErro = null;
  state.conteudoMsg = null;
  render();

  var capa = kind === "reels" ? state.conteudoCapa : null;

  _subirArquivoConteudo(arquivo, kind)
    .then(function(caminho){
      return (capa ? _subirArquivoConteudo(capa, "reelscapa") : Promise.resolve(null))
        .then(function(capaPath){
          return db("social_posts", "POST", {
            kind: kind,
            image_path: caminho,
            cover_path: capaPath,
            caption: kind === "story" ? null : state.conteudoLegenda.trim(),
            posicao: Math.floor(Date.now() / 1000)
          });
        });
    })
    .then(function(){
      state.conteudoEnviando = false;
      state.conteudoLegenda = "";
      state.conteudoArquivo = null;
      state.conteudoCapa = null;
      state.conteudoMsg = "Adicionado à fila.";
      loadConteudo();
    }).catch(function(err){
      state.conteudoEnviando = false;
      state.conteudoErro = "Não consegui enviar (" + ((err && err.message) || "erro") + ").";
      render();
    });
}

function excluirConteudo(id){
  var item = (state.conteudoLista || []).filter(function(i){ return i.id === id; })[0];
  if(!item) return;
  if(!window.confirm("Tirar este item da fila? A imagem também é apagada.")) return;
  db("social_posts", "DELETE", null, { id: "eq." + id }).then(function(){
    // Apaga o arquivo depois do registro: se a ordem fosse inversa e o DELETE
    // do banco falhasse, sobraria uma linha apontando pra imagem inexistente.
    var token = (currentSession && currentSession.access_token) || SUPA_KEY;
    fetch(SUPA_URL + "/storage/v1/object/social/" + item.image_path, {
      method: "DELETE", headers: { apikey: SUPA_KEY, Authorization: "Bearer " + token }
    }).catch(function(){});
    loadConteudo();
  }).catch(function(err){
    state.conteudoErro = "Não consegui excluir (" + ((err && err.message) || "erro") + ").";
    render();
  });
}

function admDataHora(iso){
  if(!iso) return "—";
  var d = new Date(iso);
  if(isNaN(d)) return "—";
  return d.toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

/* ── Exportar CSV (abre direto no Excel) ── */
// Dois detalhes que decidem se o arquivo abre certo ou vira lixo no Excel
// em português:
//   1. separador ";" — o Excel pt-BR usa ponto e vírgula como separador de
//      lista, porque a vírgula aqui é separador decimal. Com "," o arquivo
//      abre com a linha inteira espremida numa coluna só.
//   2. BOM no início — é o que faz o Excel reconhecer o arquivo como UTF-8.
//      Sem ele, todo acento vira caractere quebrado.
function baixarCSV(nomeArquivo, linhas){
  var conteudo = linhas.map(function(linha){
    return linha.map(function(celula){
      var s = (celula === null || celula === undefined) ? "" : String(celula);
      // Aspas escapam dobrando; envolve a célula sempre que ela contiver o
      // separador, aspas ou quebra de linha.
      return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(";");
  }).join("\r\n");
  var blob = new Blob(["﻿" + conteudo], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = nomeArquivo;
  // appendChild/removeChild em volta do click(): e o que o downloadCSV deste
  // mesmo arquivo ja faz, e alguns navegadores ignoram o clique numa ancora
  // que nao esta no documento.
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportarIntrusoesCSV(){
  var s = state.intrusions;
  if(!s || s.vazio) return;
  var linhas = [
    ["Finn - Tentativas de acesso"],
    ["Gerado em", admDataHora(new Date().toISOString())],
    [],
    ["RESUMO"],
    ["Ultimas 24h", s.ultimas24],
    ["Ultimos 7 dias", s.ultimos7d],
    ["Media diaria (7 dias)", s.mediaDiaria7d],
    ["Origens distintas", s.origens.length],
    [],
    ["POR TIPO"],
    ["Tipo", "Total"]
  ];
  s.porTipo.forEach(function(t){ linhas.push([TIPO_INTRUSAO[t.nome] || t.nome, t.total]); });
  linhas.push([], ["CAMINHOS MAIS TENTADOS"], ["Caminho", "Total"]);
  s.topCaminhos.forEach(function(c){ linhas.push([c.nome, c.total]); });
  linhas.push([], ["ORIGENS (endereco parcial)"], ["Origem", "Pais", "Tentativas", "Caminhos distintos", "Ultima tentativa"]);
  s.origens.forEach(function(o){ linhas.push([o.regiao, o.pais, o.total, o.caminhosDistintos, admDataHora(o.ultimaEm)]); });
  baixarCSV("finn-tentativas-acesso-" + todayStr() + ".csv", linhas);
}

function salvarPlanilhaLink(){
  var campo = document.getElementById("planilhaLinkInput");
  // Guarda o que foi digitado ANTES do render: sem isso o re-render recria o
  // input com o value antigo e o texto some enquanto salva.
  state.planilhaLinkRascunho = campo ? campo.value : "";
  state.planilhaLinkSalvando = true;
  state.planilhaLinkMsg = null;
  render();
  var hdrs = adminHeaders();
  hdrs["Content-Type"] = "application/json";
  fetch("/admin/planilha-link", {
    method: "POST", headers: hdrs,
    body: JSON.stringify({ url: state.planilhaLinkRascunho })
  })
    .then(function(r){ return r.json().then(function(j){ return { status: r.status, body: j }; }); })
    .then(function(res){
      state.planilhaLinkSalvando = false;
      if(res.status === 200 && res.body && res.body.ok){
        state.planilhaLink = res.body;
        state.planilhaLinkRascunho = "";
        state.planilhaLinkMsg = { ok: true, texto: res.body.aviso || "Salvo." };
      } else {
        state.planilhaLinkMsg = { ok: false, texto: (res.body && res.body.error) || "Não consegui salvar." };
      }
      render();
    }).catch(function(){
      state.planilhaLinkSalvando = false;
      state.planilhaLinkMsg = { ok: false, texto: "Falha de conexão." };
      render();
    });
}

// Desempenho REAL (alcance/curtidas/comentários/plays), puxado direto da API
// do Instagram — diferente do card acima, que só mostra se a publicação em
// si deu certo ou falhou. É o que responde "esse trabalho todo está dando
// retorno?".
function renderInstagramMetricsCard(){
  if(!isMasterUser() || !state.adminUnlocked) return "";
  var m = state.igMetrics;
  var html = '<div class="card">' +
    '<div class="eyebrow">Métricas do Instagram</div>' +
    '<div style="font-size:12.5px;color:var(--fm);margin-bottom:12px">Alcance, curtidas, comentários e salvamentos de cada post/reel publicado — puxado ao vivo da API. Stories só mostram dado enquanto ativos (24h); depois disso a Meta não devolve mais nada.</div>';

  html += '<button type="button" class="btn-ghost" id="btnLoadInstagramMetrics" style="width:100%"' + (state.igMetricsLoading ? " disabled" : "") + '>' +
    (state.igMetricsLoading ? "Carregando…" : (m ? "Atualizar" : "Carregar métricas")) + '</button>';

  if(state.igMetricsError){
    html += '<div class="ai-error" style="margin-top:10px">' + escapeHtml(state.igMetricsError) + '</div>';
  }

  if(m && m.itens){
    var comDados = m.itens.filter(function(i){ return i.metricas; });
    var comErro = m.itens.filter(function(i){ return i.erro; });
    var totalAlcance = comDados.reduce(function(s,i){ return s + (i.metricas.reach || 0); }, 0);
    var totalCurtidas = comDados.reduce(function(s,i){ return s + (i.metricas.likes || 0); }, 0);

    html += '<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">' +
      '<div class="total-box" style="flex:1;min-width:100px"><div style="font-size:11px;color:var(--fm)">ALCANCE TOTAL</div><div style="font-size:20px;font-weight:700">' + totalAlcance.toLocaleString("pt-BR") + '</div></div>' +
      '<div class="total-box" style="flex:1;min-width:100px"><div style="font-size:11px;color:var(--fm)">CURTIDAS TOTAL</div><div style="font-size:20px;font-weight:700">' + totalCurtidas.toLocaleString("pt-BR") + '</div></div>' +
      '<div class="total-box" style="flex:1;min-width:100px"><div style="font-size:11px;color:var(--fm)">COM DADOS</div><div style="font-size:20px;font-weight:700">' + comDados.length + '/' + m.itens.length + '</div></div>' +
    '</div>';

    if(comDados.length){
      html += '<div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">' +
        comDados.map(function(i){
          var tipoLabel = i.tipo === 'REELS' ? 'Reel' : i.tipo === 'STORY' ? 'Story' : 'Post';
          var partes = [];
          if(i.metricas.reach !== undefined) partes.push(i.metricas.reach.toLocaleString("pt-BR") + ' alcance');
          if(i.metricas.likes !== undefined) partes.push(i.metricas.likes + ' curtidas');
          if(i.metricas.comments !== undefined) partes.push(i.metricas.comments + ' comentários');
          if(i.metricas.saved !== undefined) partes.push(i.metricas.saved + ' salvos');
          if(i.metricas.plays !== undefined) partes.push(i.metricas.plays.toLocaleString("pt-BR") + ' plays');
          if(i.metricas.replies !== undefined) partes.push(i.metricas.replies + ' respostas');
          return '<div class="tx-item" style="flex-wrap:wrap">' +
            '<div class="tx-info" style="min-width:200px">' +
              '<div class="tx-desc">' + tipoLabel + (i.caption ? ' — ' + escapeHtml(i.caption) : '') + '</div>' +
              '<div class="tx-meta">' + (i.timestamp ? new Date(i.timestamp).toLocaleDateString("pt-BR") + ' · ' : '') + partes.join(' · ') + '</div>' +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>';
    }

    if(comErro.length){
      html += '<div style="font-size:11px;color:var(--fm);margin-top:14px">' + comErro.length + ' sem dados (story expirado ou fora do período que a API guarda).</div>';
    }
  }

  html += '</div>';
  return html;
}

// Credenciais de admin vão em header, nunca na URL: query string entra no log
// de acesso do servidor, no histórico do navegador e pode vazar via Referer —
// e o JWT da master junto com a senha é acesso admin completo.
function adminHeaders(){
  return {
    "Authorization": "Bearer " + ((currentSession && currentSession.access_token) || ""),
    "X-Admin-Password": state.adminPassword || ""
  };
}

function loadInstagramStatus(){
  state.igStatusLoading = true;
  render();
  fetch("/admin/instagram-status", { headers: adminHeaders() })
    .then(function(r){ return r.json(); })
    .then(function(j){
      state.igStatusLoading = false;
      state.igStatus = j;
      render();
    }).catch(function(){
      state.igStatusLoading = false;
      render();
    });
}

function testInstagramPublish(){
  state.igPublishLoading = true;
  state.igPublishResult = null;
  render();
  fetch("/admin/instagram-publish-next", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ access_token: currentSession && currentSession.access_token, admin_password: state.adminPassword })
  }).then(function(r){ return r.json().then(function(j){ return { status: r.status, body: j }; }); })
    .then(function(res){
      state.igPublishLoading = false;
      if(res.status === 200 && res.body && res.body.ok){
        state.igPublishResult = "Post " + res.body.index + " publicado com sucesso! (media_id: " + res.body.media_id + ")";
      } else {
        state.igPublishResult = "Falhou: " + JSON.stringify((res.body && (res.body.body || res.body.reason || res.body.error)) || res.body);
      }
      loadInstagramStatus();
    }).catch(function(){
      state.igPublishLoading = false;
      state.igPublishResult = "Falha de conexão.";
      render();
    });
}

function unlockAdmin(){
  var input = document.getElementById("adminPasswordInput");
  var password = input ? input.value : "";
  if(!password) return;
  state.adminLoginLoading = true;
  state.adminLoginError = null;
  render();
  fetch("/admin/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ access_token: currentSession && currentSession.access_token, password: password })
  }).then(function(r){ return r.json().then(function(j){ return { status: r.status, body: j }; }); })
    .then(function(res){
      state.adminLoginLoading = false;
      if(res.status === 200 && res.body && res.body.ok){
        state.adminUnlocked = true;
        state.adminPassword = password;
        loadPlan(); // já aplica o bypass pra Pro imediatamente, sem precisar recarregar
        loadAdminSubscriptions();
        // syncTelegramBot/pullBotTransactions já rodaram uma vez logo após
        // loadData() — mas nesse momento adminUnlocked ainda era false (a
        // master só desbloqueia DEPOIS que o app já carregou), então
        // telegramBotVisible() bloqueava tudo e o bot da master nunca
        // chegava a sincronizar de verdade. Roda de novo agora que a
        // master está desbloqueada (syncWhatsAppBot não depende mais disso).
        syncWhatsAppBot();
        syncTelegramBot();
        pullBotTransactions();
        // Desbloqueou a senha de admin = quer gerenciar. Cai direto no modo
        // admin em vez de continuar no Finn normal com as telas de gestão
        // escondidas no fim do menu.
        setAdminMode(true);
        loadAdminAnalytics();
      } else {
        state.adminLoginError = (res.body && res.body.error) || "Senha incorreta.";
        render();
      }
    }).catch(function(){
      state.adminLoginLoading = false;
      state.adminLoginError = "Falha de conexão.";
      render();
    });
}

function loadAdminSubscriptions(){
  state.adminLoading = true;
  state.adminError = null;
  render();
  fetch("/admin/subscriptions", { headers: adminHeaders() })
    .then(function(r){ return r.json().then(function(j){ return { status: r.status, body: j }; }); })
    .then(function(res){
      state.adminLoading = false;
      if(res.status === 200 && res.body && res.body.subscriptions){
        state.adminSubs = res.body.subscriptions;
      } else {
        state.adminError = (res.body && res.body.error) || "Não consegui carregar.";
      }
      render();
    }).catch(function(){
      state.adminLoading = false;
      state.adminError = "Falha de conexão.";
      render();
    });
}

// Painel de uso ao vivo (só a master): /admin/analytics roda no finn-serve
// (Supabase — usuários, lançamentos, adoção de recursos) e /admin/bot-stats
// roda no finn-worker (KV — a única fonte de dados do bot). Busca os dois em
// paralelo, sem cache — cada visita ao painel reflete o estado atual.
function loadAdminAnalytics(){
  state.analyticsLoading = true;
  state.analyticsError = null;
  render();
  var hdrs = adminHeaders();
  Promise.all([
    fetch("/admin/analytics", { headers: hdrs }).then(function(r){ return r.json().then(function(j){ return { status: r.status, body: j }; }); }),
    fetch(WHATSAPP_WORKER_URL + "/admin/bot-stats", { headers: hdrs }).then(function(r){ return r.json().then(function(j){ return { status: r.status, body: j }; }); }).catch(function(){ return { status: 0, body: null }; })
  ]).then(function(res){
    state.analyticsLoading = false;
    var mainRes = res[0], botRes = res[1];
    if(mainRes.status === 200 && mainRes.body && mainRes.body.ok){
      state.analyticsData = mainRes.body;
      state.analyticsData.botStats = (botRes.status === 200 && botRes.body && botRes.body.ok) ? botRes.body : null;
    } else {
      state.analyticsError = (mainRes.body && mainRes.body.error) || "Não consegui carregar o painel.";
    }
    render();
  }).catch(function(){
    state.analyticsLoading = false;
    state.analyticsError = "Falha de conexão.";
    render();
  });
}

// Busca as respostas do questionário (/admin/beta-questionario) e as
// inscrições confirmadas do /beta (/admin/beta-signups) em paralelo — a
// segunda rota já existia, mas nunca teve tela nenhuma pra mostrar os dados.
function loadAdminBeta(){
  state.betaAdminLoading = true;
  state.betaAdminError = null;
  render();
  var hdrs = adminHeaders();
  Promise.all([
    fetch("/admin/beta-questionario", { headers: hdrs }).then(function(r){ return r.json().then(function(j){ return { status: r.status, body: j }; }); }),
    fetch("/admin/beta-signups", { headers: hdrs }).then(function(r){ return r.json().then(function(j){ return { status: r.status, body: j }; }); })
  ]).then(function(res){
    state.betaAdminLoading = false;
    var respRes = res[0], signRes = res[1];
    if(respRes.status === 200 && respRes.body && Array.isArray(respRes.body.respostas)){
      state.betaAdminData = {
        respostas: respRes.body.respostas,
        signups: (signRes.status === 200 && signRes.body && Array.isArray(signRes.body.signups)) ? signRes.body.signups : []
      };
    } else {
      state.betaAdminError = (respRes.body && respRes.body.error) || "Não consegui carregar as respostas.";
    }
    render();
  }).catch(function(){
    state.betaAdminLoading = false;
    state.betaAdminError = "Falha de conexão.";
    render();
  });
}

// Painel de uso da Finn IA (/admin/ai-usage no finn-serve): quantidade de
// chamadas, custo estimado por chamada, e uma nota explicando por que
// "saldo" não aparece — a Anthropic não expõe isso por API, só no Console.
function loadAdminIa(){
  state.adminIaLoading = true;
  state.adminIaError = null;
  render();
  fetch("/admin/ai-usage", { headers: adminHeaders() }).then(function(r){
    return r.json().then(function(j){ return { status: r.status, body: j }; });

      state.adminIaData = res.body;
    } else {
      state.adminIaError = (res.body && res.body.error) || "Não consegui carregar o painel de IA.";
    }
    render();
  }).catch(function(){
    state.adminIaLoading = false;
    state.adminIaError = "Falha de conexão.";

}

var BETAQ_ORGANIZA = { planilha: "Planilha", papel: "Papel/caderno", outro_app: "Outro app", nao_organizo: "Não organiza hoje" };
var BETAQ_TEMPO = { so_olhar: "Só vai olhar", algumas_vezes: "Algumas vezes/semana", todo_dia: "Todo dia" };
var BETAQ_CANAL = { whatsapp: "WhatsApp", email: "E-mail", formulario: "Formulário" };
var BETAQ_DISPOSITIVO = { celular: "Celular", computador: "Computador", ambos: "Celular e computador" };
var BETAQ_FOLLOWUP = { sim: "Topa enquete depois", talvez: "Talvez toda enquete", nao: "Não quer enquete" };
function betaqRotulo(mapa, chave){
  var v = Object.prototype.hasOwnProperty.call(mapa, chave) ? mapa[chave] : chave;
  return escapeHtml(v || "—");
}

function renderAdminBeta(){
  if(!isMasterUser() || !state.adminUnlocked) return "";

  if(state.betaAdminLoading && !state.betaAdminData){
    return '<div class="card"><div class="eyebrow">Questionário do beta</div><div style="font-size:13px;color:var(--fm)">Carregando respostas…</div></div>';
  }
  if(state.betaAdminError && !state.betaAdminData){
    return '<div class="card"><div class="eyebrow">Questionário do beta</div>' +
      '<div class="ai-error">' + escapeHtml(state.betaAdminError) + '</div>' +
      '<button type="button" class="btn-submit" id="btnRetryBetaAdmin" style="margin-top:10px">Tentar de novo</button></div>';
  }
  if(!state.betaAdminData){
    return '<div class="card"><div class="eyebrow">Questionário do beta</div>' +
      '<button type="button" class="btn-submit" id="btnLoadBetaAdmin">Carregar respostas</button></div>';
  }

  var d = state.betaAdminData;
  var respostas = d.respostas.slice().sort(function(a,b){ return String(b.created_at).localeCompare(String(a.created_at)); });
  var signups = d.signups || [];

  // Cruza por e-mail (minúsculo) pra saber quem respondeu o questionário mas
  // ainda não completou a inscrição de verdade — é a lista de quem vale a
  // pena cutucar.
  var emailsInscritos = {};
  signups.forEach(function(s){ if(s.email) emailsInscritos[String(s.email).toLowerCase()] = s; });
  var respondeuMasNaoInscreveu = respostas.filter(function(r){ return !emailsInscritos[String(r.email || "").toLowerCase()]; });
  var confirmados = signups.filter(function(s){ return s.confirmed; }).length;

  var html = '<div class="card">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:2px">' +
      '<div class="eyebrow" style="margin:0">Questionário do beta</div>' +
      '<button type="button" class="btn-ghost" id="btnRefreshBetaAdmin" style="padding:6px 12px;font-size:11.5px"' + (state.betaAdminLoading ? " disabled" : "") + '>' + (state.betaAdminLoading ? "Atualizando…" : "Atualizar agora") + '</button>' +
    '</div>' +
    '<div style="font-size:11.5px;color:var(--fm)">Respostas ao /beta-questionario e inscrições ao /beta, lado a lado.</div>' +
  '</div>';

  html += '<div class="adm-kpis">' +
    '<div class="adm-kpi"><div class="adm-kpi-label">Responderam</div><div class="adm-kpi-value">' + respostas.length + '</div><div class="adm-kpi-sub">o questionário</div></div>' +
    '<div class="adm-kpi"><div class="adm-kpi-label">Se inscreveram</div><div class="adm-kpi-value">' + signups.length + '</div><div class="adm-kpi-sub">' + confirmados + ' confirmaram o e-mail</div></div>' +
    '<div class="adm-kpi"><div class="adm-kpi-label">Faltam se inscrever</div><div class="adm-kpi-value">' + respondeuMasNaoInscreveu.length + '</div><div class="adm-kpi-sub">responderam, não se inscreveram ainda</div></div>' +
  '</div>';

  if(respondeuMasNaoInscreveu.length){
    html += '<div class="card"><p style="font-size:14px;font-weight:800;margin:0 0 10px">Vale cutucar</p>' +
      respondeuMasNaoInscreveu.map(function(r){
        return '<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--fb);font-size:12.5px">' +
          '<span><b>' + escapeHtml(r.name || "—") + '</b> · ' + escapeHtml(r.email || "—") + '</span>' +
          '<span style="color:var(--fm);white-space:nowrap">' + admDataHora(r.created_at) + '</span></div>';
      }).join("") +
    '</div>';
  }

  html += '<div class="card"><p style="font-size:14px;font-weight:800;margin:0 0 10px">Respostas do questionário (' + respostas.length + ')</p>';
  if(!respostas.length){
    html += '<div style="font-size:12.5px;color:var(--fm)">Ninguém respondeu ainda.</div>';
  } else {
    html += respostas.map(function(r){
      var jaInscrito = !!emailsInscritos[String(r.email || "").toLowerCase()];
      return '<div style="border-top:1px solid var(--fb);padding:12px 0">' +
        '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px">' +
          '<div><b style="font-size:13.5px">' + escapeHtml(r.name || "—") + '</b><div style="font-size:11.5px;color:var(--fm)">' + escapeHtml(r.email || "—") + '</div></div>' +
          '<div style="text-align:right"><span style="font-size:11px;color:var(--fm)">' + admDataHora(r.created_at) + '</span>' +
          (jaInscrito ? '<div class="cat-pill" style="font-size:10.5px;margin-top:3px;background:#ECFDF5;border:1px solid var(--fs);color:var(--fs)">já inscrito</div>' : '') + '</div>' +
        '</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">' +
          '<span class="cat-pill" style="font-size:11px">' + betaqRotulo(BETAQ_ORGANIZA, r.organiza) + '</span>' +
          '<span class="cat-pill" style="font-size:11px">' + escapeHtml(r.banco || "—") + '</span>' +
          '<span class="cat-pill" style="font-size:11px">' + betaqRotulo(BETAQ_TEMPO, r.tempo) + '</span>' +
          '<span class="cat-pill" style="font-size:11px">' + betaqRotulo(BETAQ_CANAL, r.canal) + '</span>' +
          '<span class="cat-pill" style="font-size:11px">' + betaqRotulo(BETAQ_DISPOSITIVO, r.dispositivo) + '</span>' +
          '<span class="cat-pill" style="font-size:11px">' + betaqRotulo(BETAQ_FOLLOWUP, r.followup) + '</span>' +
        '</div>' +
        '<div style="font-size:12.5px;color:var(--fd)">' + escapeHtml(r.dor || "—") + '</div>' +
      '</div>';
    }).join("");
  }
  html += '</div>';

  html += '<div class="card"><p style="font-size:14px;font-weight:800;margin:0 0 10px">Inscrições no /beta (' + signups.length + ')</p>';
  if(!signups.length){
    html += '<div style="font-size:12.5px;color:var(--fm)">Ninguém se inscreveu ainda.</div>';
  } else {
    html += '<div class="adm-tbl-wrap"><table class="adm-table"><thead><tr>' +
      '<th>Nome</th><th>E-mail</th><th>Contato</th><th>Status</th><th>Quando</th>' +
    '</tr></thead><tbody>' +
    signups.slice().sort(function(a,b){ return String(b.created_at).localeCompare(String(a.created_at)); }).map(function(s){
      return '<tr><td><span class="name">' + escapeHtml(s.name || "—") + '</span></td>' +
        '<td>' + escapeHtml(s.email || "—") + '</td>' +
        '<td>' + escapeHtml(s.contact || "—") + '</td>' +
        '<td>' + (s.confirmed ? '<span class="cat-pill" style="font-size:10.5px;background:#ECFDF5;border:1px solid var(--fs);color:var(--fs)">confirmado</span>' : '<span class="cat-pill" style="font-size:10.5px">aguardando e-mail</span>') + '</td>' +
        '<td>' + admDataHora(s.created_at) + '</td></tr>';
    }).join("") + '</tbody></table></div>';
  }
  html += '</div>';

  return html;
}

/* ── painel de uso da Finn IA (admin) ── */
// Custo por chamada é ESTIMADO a partir do preço por token publicado da
// Anthropic (ver AI_PRECOS_POR_MILHAO no finn-serve) — não é uma cobrança
// confirmada. Rotulado como estimativa em toda a tela de propósito.
function fmtMoneyPrecisa(v){
  return "R$ " + Number(v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 4, maximumFractionDigits: 4 });
}
function renderAdminIa(){
  if(!isMasterUser() || !state.adminUnlocked) return "";

  if(state.adminIaLoading && !state.adminIaData){
    return '<div class="card"><div class="eyebrow">Uso da Finn IA</div><div style="font-size:13px;color:var(--fm)">Carregando…</div></div>';
  }
  if(state.adminIaError && !state.adminIaData){
    return '<div class="card"><div class="eyebrow">Uso da Finn IA</div>' +
      '<div class="ai-error">' + escapeHtml(state.adminIaError) + '</div>' +
      '<button type="button" class="btn-submit" id="btnRetryAdminIa" style="margin-top:10px">Tentar de novo</button></div>';
  }
  if(!state.adminIaData){
    return '<div class="card"><div class="eyebrow">Uso da Finn IA</div>' +
      '<button type="button" class="btn-submit" id="btnLoadAdminIa">Carregar painel</button></div>';
  }

  var d = state.adminIaData;
  var html = '<div class="card">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:2px">' +
      '<div class="eyebrow" style="margin:0">Uso da Finn IA</div>' +
      '<button type="button" class="btn-ghost" id="btnRefreshAdminIa" style="padding:6px 12px;font-size:11.5px"' + (state.adminIaLoading ? " disabled" : "") + '>' + (state.adminIaLoading ? "Atualizando…" : "Atualizar agora") + '</button>' +
    '</div>' +
    '<div style="font-size:11.5px;color:var(--fm)">Toda chamada bem-sucedida ao proxy /ai (Claude), com custo ESTIMADO a partir do preço por token — não é a cobrança oficial da Anthropic.</div>' +
  '</div>';

  html += '<div class="card" style="background:#FFFBEB;border-color:#FDE68A">' +
    '<div style="font-size:12.5px;color:#92400E"><b>Saldo da conta:</b> ' + escapeHtml(d.saldo_nota || "não disponível por API.") + '</div>' +
  '</div>';

  html += '<div class="adm-kpis">' +
    '<div class="adm-kpi"><div class="adm-kpi-label">Chamadas</div><div class="adm-kpi-value">' + (d.total_chamadas || 0) + '</div><div class="adm-kpi-sub">' + (d.truncado ? "cortado em " + d.limite_aplicado : "no total") + '</div></div>' +
    '<div class="adm-kpi"><div class="adm-kpi-label">Custo estimado</div><div class="adm-kpi-value" style="font-size:19px">' + escapeHtml(fmtMoney(d.custo_total_estimado || 0)) + '</div><div class="adm-kpi-sub">acumulado no log</div></div>' +
    '<div class="adm-kpi"><div class="adm-kpi-label">Por chamada</div><div class="adm-kpi-value" style="font-size:16px">' + escapeHtml(fmtMoneyPrecisa(d.custo_medio_por_chamada || 0)) + '</div><div class="adm-kpi-sub">média</div></div>' +
  '</div>';

  var modelos = Object.keys(d.por_modelo || {});
  html += '<div class="card"><p style="font-size:14px;font-weight:800;margin:0 0 10px">Por modelo</p>';
  if(!modelos.length){
    html += '<div style="font-size:12.5px;color:var(--fm)">Nenhuma chamada registrada ainda.</div>';
  } else {
    html += '<div class="adm-tbl-wrap"><table class="adm-table"><thead><tr><th>Modelo</th><th>Chamadas</th><th>Custo estimado</th><th>Por chamada</th></tr></thead><tbody>' +
      modelos.sort(function(a,b){ return d.por_modelo[b].chamadas - d.por_modelo[a].chamadas; }).map(function(m){
        var mm = d.por_modelo[m];
        return '<tr><td>' + escapeHtml(m) + '</td><td>' + mm.chamadas + '</td><td>' + escapeHtml(fmtMoney(mm.custo)) + '</td>' +
          '<td>' + escapeHtml(fmtMoneyPrecisa(mm.chamadas ? mm.custo / mm.chamadas : 0)) + '</td></tr>';
      }).join("") + '</tbody></table></div>';
  }
  html += '</div>';

  var porDia = (d.por_dia || []).slice().reverse();
  html += '<div class="card"><p style="font-size:14px;font-weight:800;margin:0 0 10px">Últimos 30 dias com uso</p>';
  if(!porDia.length){
    html += '<div style="font-size:12.5px;color:var(--fm)">Sem uso nos últimos dias.</div>';
  } else {
    html += '<div class="adm-tbl-wrap"><table class="adm-table"><thead><tr><th>Dia</th><th>Chamadas</th><th>Custo estimado</th></tr></thead><tbody>' +
      porDia.map(function(p){
        return '<tr><td>' + escapeHtml(p.dia.split("-").reverse().join("/")) + '</td><td>' + p.chamadas + '</td><td>' + escapeHtml(fmtMoney(p.custo)) + '</td></tr>';
      }).join("") + '</tbody></table></div>';
  }
  html += '</div>';

  var recentes = d.recentes || [];
  html += '<div class="card"><p style="font-size:14px;font-weight:800;margin:0 0 10px">Chamadas recentes (' + recentes.length + ')</p>';
  if(!recentes.length){
    html += '<div style="font-size:12.5px;color:var(--fm)">Nenhuma chamada registrada ainda.</div>';
  } else {
    html += '<div class="adm-tbl-wrap"><table class="adm-table"><thead><tr><th>Quando</th><th>Modelo</th><th>Tokens (in/out)</th><th>Custo estimado</th></tr></thead><tbody>' +
      recentes.map(function(l){
        return '<tr><td>' + admDataHora(l.created_at) + '</td><td>' + escapeHtml(l.model || "—") + '</td>' +
          '<td>' + (l.input_tokens || 0) + ' / ' + (l.output_tokens || 0) + '</td>' +
          '<td>' + escapeHtml(fmtMoneyPrecisa(l.cost_estimate || 0)) + '</td></tr>';
      }).join("") + '</tbody></table></div>';
  }
  html += '</div>';

  return html;
}

/* ── painel de anúncios (Meta Ads, admin) ── */
function loadMetaAds(){
  state.metaAdsLoading = true;
  state.metaAdsError = null;
  render();
  fetch("/admin/meta-ads", { headers: adminHeaders() })
    .then(function(r){ return r.text().then(function(t){
      var body = null; try { body = JSON.parse(t); } catch(e){}
      return { status: r.status, body: body };
    }); })
    .then(function(res){
      state.metaAdsLoading = false;
      if(res.status === 200 && res.body && res.body.ok){
        state.metaAdsData = res.body;
      } else {
        var msg = (res.body && res.body.erro && res.body.erro.mensagem) || (res.body && res.body.motivo);
        if(res.status === 401 || res.status === 403) msg = "Acesso negado. Desbloqueie o painel de admin de novo em Configurações.";
        state.metaAdsError = msg || ("Não consegui carregar os anúncios (erro " + res.status + ").");
        // 503 "não configurado" ainda guarda o corpo, pra tela distinguir de
        // um erro de rede — mostra a mensagem de configuração em vez do erro genérico.
        if(res.body && res.body.configurado === false) state.metaAdsData = res.body;
      }
      render();
    }).catch(function(){
      state.metaAdsLoading = false;
      state.metaAdsError = "Falha de conexão.";
      render();
    });
}

var META_ADS_STATUS_LABEL = { active: "Ativa", paused: "Pausada", deleted: "Excluída", archived: "Arquivada" };
function metaAdsStatusTexto(s){
  var k = String(s || "").toLowerCase();
  return Object.prototype.hasOwnProperty.call(META_ADS_STATUS_LABEL, k) ? META_ADS_STATUS_LABEL[k] : escapeHtml(s || "—");
}
function metaAdsFmtPct(v){
  if(v === null || v === undefined || isNaN(v)) return "—";
  return Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
}
function metaAdsFmtNum(v){
  if(v === null || v === undefined || isNaN(v)) return "—";
  return Number(v).toLocaleString("pt-BR");
}
function metaAdsFmtMoneyOuTraco(v){
  return (v === null || v === undefined || isNaN(v)) ? "—" : escapeHtml(fmtMoney(Number(v)));
}

function renderMetaAds(){
  if(!isMasterUser() || !state.adminUnlocked) return "";

  if(state.metaAdsLoading && !state.metaAdsData){
    return '<div class="card"><div class="eyebrow">Anúncios</div><div style="font-size:13px;color:var(--fm)">Carregando dados do Meta…</div></div>';
  }
  if(state.metaAdsError && !state.metaAdsData){
    return '<div class="card"><div class="eyebrow">Anúncios</div>' +
      '<div class="ai-error">' + escapeHtml(state.metaAdsError) + '</div>' +
      '<button type="button" class="btn-submit" id="btnRetryMetaAds" style="margin-top:10px">Tentar de novo</button></div>';
  }
  if(!state.metaAdsData){
    return '<div class="card"><div class="eyebrow">Anúncios</div>' +
      '<button type="button" class="btn-submit" id="btnLoadMetaAds">Carregar anúncios</button></div>';
  }

  var d = state.metaAdsData;

  if(d.configurado === false){
    return '<div class="card"><div class="eyebrow">Anúncios</div>' +
      '<div style="font-size:12.5px;color:var(--fm)">' + escapeHtml((d.erro && d.erro.mensagem) || "O painel de anúncios ainda não está configurado.") + '</div></div>';
  }

  var campanhas = (d.campanhas || []).slice().sort(function(a,b){ return (b.gasto || 0) - (a.gasto || 0); });
  var t = d.totais;

  var html = '<div class="card">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:2px">' +
      '<div class="eyebrow" style="margin:0">Anúncios</div>' +
      '<button type="button" class="btn-ghost" id="btnRefreshMetaAds" style="padding:6px 12px;font-size:11.5px"' + (state.metaAdsLoading ? " disabled" : "") + '>' + (state.metaAdsLoading ? "Atualizando…" : "Atualizar agora") + '</button>' +
    '</div>' +
    '<div style="font-size:11.5px;color:var(--fm)">Últimos 30 dias' + (d.cache && d.cache.hit ? " · dado em cache (até " + Math.round(d.cache.ttlSegundos / 60) + " min)" : "") + '. Só leitura — nada aqui cria, edita ou pausa campanha.</div>' +
  '</div>';

  if(d.insightsIndisponivel){
    html += '<div class="card"><div class="ai-error" style="margin:0">Consegui a lista de campanhas, mas as métricas (gasto, cliques…) não vieram agora. Tenta atualizar de novo em instantes.</div></div>';
  }

  if(t){
    html += '<div class="adm-kpis">' +
      '<div class="adm-kpi"><div class="adm-kpi-label">Gasto</div><div class="adm-kpi-value">' + metaAdsFmtMoneyOuTraco(t.gasto) + '</div><div class="adm-kpi-sub">nos últimos 30 dias</div></div>' +
      '<div class="adm-kpi"><div class="adm-kpi-label">Cliques</div><div class="adm-kpi-value">' + metaAdsFmtNum(t.cliques) + '</div><div class="adm-kpi-sub">CPC médio ' + metaAdsFmtMoneyOuTraco(t.cpc) + '</div></div>' +
      '<div class="adm-kpi"><div class="adm-kpi-label">CTR</div><div class="adm-kpi-value">' + metaAdsFmtPct(t.ctr) + '</div><div class="adm-kpi-sub">' + metaAdsFmtNum(t.impressoes) + ' impressões</div></div>' +
    '</div>';
  }

  html += '<div class="card"><p style="font-size:14px;font-weight:800;margin:0 0 10px">Campanhas (' + campanhas.length + ')</p>';
  if(!campanhas.length){
    html += '<div style="font-size:12.5px;color:var(--fm)">Nenhuma campanha na conta.</div>';
  } else {
    html += '<div class="adm-tbl-wrap"><table class="adm-table"><thead><tr>' +
      '<th>Campanha</th><th>Status</th><th class="num">Gasto</th><th class="num">Cliques</th><th class="num">CTR</th><th class="num">CPC</th>' +
    '</tr></thead><tbody>' +
    campanhas.map(function(c){
      return '<tr><td><span class="name">' + escapeHtml(c.nome) + '</span></td>' +
        '<td>' + metaAdsStatusTexto(c.status) + '</td>' +
        '<td class="num">' + metaAdsFmtMoneyOuTraco(c.gasto) + '</td>' +
        '<td class="num">' + metaAdsFmtNum(c.cliques) + '</td>' +
        '<td class="num">' + metaAdsFmtPct(c.ctr) + '</td>' +
        '<td class="num">' + metaAdsFmtMoneyOuTraco(c.cpc) + '</td></tr>';
    }).join("") + '</tbody></table></div>';
  }
  html += '</div>';

  html += '<div style="font-size:11.5px;color:var(--fm);margin-top:12px">Não mostra quantos cliques viraram inscrição de verdade — isso exigiria instalar rastreamento de conversão, que ainda não está ligado.</div>';

  return html;
}

/* ── screener de ações (admin) ── */

// Lista fixa de 15 papéis líquidos da B3, cobrindo setores diferentes (bancos,
// energia, varejo, saúde, commodities, locação) e incluindo 2 FIIs de
// propósito — são justamente eles que mostram onde a nota de ação não vale
// (ver screenerEhFundo). É lista fixa e não busca livre porque cada papel é
// uma cotação a mais na cota do provedor: busca aberta viraria rate limit na
// primeira digitação.
//
// ESTA LISTA É ESPELHO da SCREENER_TICKERS de finn-serve/build.js — conferida
// papel a papel. Mexer aqui sem mexer lá faz o papel voltar como erro
// permanente na tabela (já aconteceu com RDOR3 e HAPV3). A rota de lote
// devolve o ticker de cada papel, então uma divergência futura aparece na tela
// em vez de sumir: ver screenerAplicaLote.
var SCREENER_TICKERS = ["ITUB4","BBAS3","BBDC4","PETR4","VALE3","TAEE11","ELET3","MGLU3","LREN3","WEGE3","RDOR3","HAPV3","MXRF11","HGLG11","RENT3"];
// Fundos imobiliários da lista, em código. É rede de segurança: se o backend
// não mandar o tipo do papel, mesmo assim não damos nota de ação pra fundo.
// Terminar em 11 não serve de teste — TAEE11 é unit de uma empresa normal.
var SCREENER_FUNDOS = ["MXRF11","HGLG11"];
// Concorrência do CAMINHO DE FALLBACK (um papel por requisição). O caminho
// normal hoje é uma chamada só em GET /api/stocks; isto aqui só roda quando o
// servidor publicado ainda não tem a rota de lote.
var SCREENER_LOTE = 4;

// Colunas da tabela. "dir" é o sentido em que a coluna abre no primeiro
// clique: P/L e dívida são "quanto menor melhor", então abrem em asc; nota,
// DY, ROE e margem abrem em desc. Abrir tudo em asc faria o primeiro clique
// em "Nota" mostrar as piores empresas no topo.
var SCREENER_COLS = [
  { key: "ticker", label: "Papel", num: false, dir: "asc" },
  { key: "preco", label: "Preço", num: true, dir: "desc" },
  { key: "pl", label: "P/L", num: true, dir: "asc" },
  { key: "dy", label: "DY", num: true, dir: "desc" },
  { key: "roe", label: "ROE", num: true, dir: "desc" },
  { key: "dividaEbitda", label: "Dív/EBITDA", num: true, dir: "asc" },
  { key: "margem", label: "Margem", num: true, dir: "desc" },
  { key: "score", label: "Nota", num: true, dir: "desc" }
];

// Os apelidos existem porque o backend do screener está sendo escrito em
// paralelo: se ele chamar o campo de "margemLiquida" em vez de "margem", a
// coluna some da tela sem erro nenhum e ninguém percebe. "leitura" é o texto
// fixo que explica a direção do indicador — aparece no detalhe mesmo quando o
// backend não manda a faixa.
//
// "escalaPadrao" é o contrato escrito do backend (indicadores.escala:
// "dy, roe e margem em FRAÇÃO; pl e dividaEbitda em número puro"). Serve pra
// tela PARAR DE ADIVINHAR escala por limiar: cada detalhe da nota já vem com
// "escala" própria, e quando ele não vier vale o contrato — não o chute.
var SCREENER_INDICADORES = [
  { key: "pl", label: "P/L", curto: "P/L", fmt: "num", escalaPadrao: "numero",
    leitura: "Quanto menor, menos você paga por cada real de lucro. P/L negativo quer dizer prejuízo nos últimos 12 meses.",
    aliases: ["pl","p_l","precoLucro","preco_lucro","precoSobreLucro","priceEarnings","pe"] },
  { key: "dy", label: "Dividend yield", curto: "DY", fmt: "pct", escalaPadrao: "fracao",
    leitura: "Quanto maior, mais dividendo por real investido — mas yield muito alto costuma ser preço despencando ou provento extraordinário, não empresa boa.",
    aliases: ["dy","dividendYield","dividend_yield","dividendyield","yield"] },
  { key: "roe", label: "ROE", curto: "ROE", fmt: "pct", escalaPadrao: "fracao",
    leitura: "Retorno sobre o patrimônio dos sócios. Quanto maior, melhor: abaixo do juro básico, o risco de ação não se paga.",
    aliases: ["roe","returnOnEquity","return_on_equity","retornoPatrimonio","retorno_patrimonio"] },
  { key: "dividaEbitda", label: "Dívida líquida / EBITDA", curto: "Dív/EBITDA", fmt: "mult", escalaPadrao: "numero",
    leitura: "Quantos anos de geração de caixa pagariam a dívida. Quanto menor, melhor; negativo quer dizer mais caixa do que dívida.",
    aliases: ["dividaEbitda","divida_ebitda","dividaLiquidaEbitda","divida_liquida_ebitda","dividaLiquidaSobreEbitda","debtToEbitda","debt_to_ebitda","netDebtToEbitda","divEbitda"] },
  { key: "margem", label: "Margem líquida", curto: "Margem", fmt: "pct", escalaPadrao: "fracao",
    leitura: "Quanto sobra de lucro em cada real vendido. Quanto maior, mais folga a empresa tem pra aguentar aumento de custo.",
    aliases: ["margem","margemLiquida","margem_liquida","margemliquida","profitMargins","profitMargin","netMargin","net_margin"] }
];

// Os "flag" do backend são apelidos curtos ('extremo', 'armadilha'), não frase
// pra usuário: imprimir o apelido cru daria "Atenção: nao_operacional". Aqui
// cada um vira a frase que explica o que aquilo quer dizer. Flag desconhecida
// cai no texto cru mesmo (escapado) — melhor mostrar algo do que engolir.
var SCREENER_FLAGS = {
  extremo: "número fora de qualquer faixa plausível. Não sai da conta: pontua zero, porque dado absurdo não é dado faltando.",
  suspeito: "número suspeito — costuma ser lucro não recorrente inflando o índice.",
  armadilha: "possível armadilha de yield: dividendo muito alto costuma ser preço despencando ou provento extraordinário.",
  inflado: "índice inflado por patrimônio pequeno — parece melhor do que é.",
  // Chave SEM underscore de propósito: screenerFlagTexto normaliza a flag com
  // scrChaveNorm, que remove tudo que não é [a-z0-9]. Com "nao_operacional" aqui,
  // a busca por "naooperacional" não achava e a tela imprimia o slug cru.
  naooperacional: "resultado provavelmente não operacional (venda de ativo, evento único)."
};

// hasOwnProperty em vez de acesso direto pelo mesmo motivo de catColor(): um
// campo herdado do Object.prototype ("constructor", "toString") devolveria uma
// função em vez de undefined e o fallback nunca dispararia.
function scrPick(obj, names){
  if(!obj || typeof obj !== "object") return undefined;
  for(var i = 0; i < names.length; i++){
    if(Object.prototype.hasOwnProperty.call(obj, names[i])){
      var v = obj[names[i]];
      if(v !== undefined && v !== null) return v;
    }
  }
  return undefined;
}

// O corpo pode vir chapado ({symbol, preco, ...}) ou embrulhado
// ({ok:true, data:{...}}). Procurar nos dois níveis custa três linhas e evita
// a tela inteira aparecer vazia só porque o outro lado embrulhou a resposta.
function scrCampo(body, names){
  var v = scrPick(body, names);
  if(v !== undefined) return v;
  var dentro = scrPick(body, ["data","dados","acao","ativo","stock","resultado","result","quote"]);
  if(dentro && typeof dentro === "object" && !Array.isArray(dentro)) return scrPick(dentro, names);
  return undefined;
}

// Converte o que vier em número. Já vi API financeira devolver número puro,
// string "38,42", string "28.5%" e objeto {raw, fmt} — aceitar os quatro é
// mais barato que descobrir em produção que a coluna inteira virou "—".
function scrNum(v){
  if(v === null || v === undefined) return null;
  if(typeof v === "object") return scrNum(scrPick(v, ["valor","value","raw","num"]));
  if(typeof v === "string"){
    var s = v.replace(/[R$%\s]/g, "");
    if(!s) return null;
    // "1.234,56" (pt-BR) x "1234.56" (en-US): só trata como pt-BR quando tem
    // vírgula, senão "38.42" viraria 3842.
    if(s.indexOf(",") >= 0) s = s.replace(/\./g, "").replace(",", ".");
    v = parseFloat(s);
  }
  if(typeof v !== "number" || !isFinite(v)) return null;
  return v;
}

// Primeiro campo da lista que seja texto de verdade. O padrão
// {error:true, message:"..."} é comum em API financeira: pegar o "error"
// booleano deixaria a linha com a mensagem genérica em vez do motivo real.
//
// Desce um nível quando o campo é OBJETO porque o backend manda o erro
// aninhado: { erro: { tipo, mensagem } }. Lendo só campo chapado, toda frase
// escrita com cuidado do outro lado ("Não achamos o papel ITUB4 na B3 agora")
// era jogada fora e a tela mostrava "Não consegui buscar (erro 404)".
function screenerPrimeiroTexto(body, names){
  for(var i = 0; i < names.length; i++){
    var v = scrCampo(body, [names[i]]);
    if(typeof v === "string" && v) return v;
    if(v && typeof v === "object" && !Array.isArray(v)){
      var dentro = scrPick(v, ["mensagem","message","texto","detalhe","detail","descricao","motivo","erro","error"]);
      if(typeof dentro === "string" && dentro) return dentro;
    }
  }
  return "";
}

function scrChaveNorm(s){
  return String(s === null || s === undefined ? "" : s).toLowerCase().replace(/[^a-z0-9]/g, "");
}

function scrBateChave(chave, aliases){
  var alvo = scrChaveNorm(chave);
  if(!alvo) return false;
  for(var i = 0; i < aliases.length; i++){
    if(scrChaveNorm(aliases[i]) === alvo) return true;
  }
  return false;
}

function screenerFmtDec(v){
  return v.toFixed(2).replace(".", ",");
}

// A ESCALA VEM DO BACKEND, não é mais adivinhada. Cada detalhe da nota traz
// "escala" ('fracao' | 'percentual' | 'numero') e o contrato da resposta diz
// que dy/roe/margem saem em fração — é o que escalaPadrao guarda.
//
// O limiar fixo de 1,5 que existia aqui só sobrou como último recurso, pra
// resposta de servidor antigo que não manda escala nenhuma. Ele ERRA em
// margem derivada: lucro 500 sobre receita 100 dá margem 5 (500%), e o limiar
// lia isso como "já está em percentual" e mostrava 5,0% — uma das melhores
// margens da lista virava a pior da tabela.
function screenerFmtPct(v, escala){
  var pct;
  if(escala === "fracao") pct = v * 100;
  else if(escala === "percentual") pct = v;
  else pct = Math.abs(v) <= 1.5 ? v * 100 : v;
  return pct.toFixed(1).replace(".", ",") + "%";
}

function screenerFmtValor(meta, ind){
  if(ind && ind.texto) return ind.texto;
  var v = ind ? ind.valor : null;
  if(v === null || v === undefined) return "—";
  if(meta.fmt === "pct") return screenerFmtPct(v, (ind && ind.escala) || meta.escalaPadrao);
  if(meta.fmt === "mult") return screenerFmtDec(v) + "x";
  return screenerFmtDec(v);
}

// Flag em frase de gente. Desconhecida volta como veio (quem imprime escapa).
function screenerFlagTexto(flag){
  if(!flag) return "";
  var k = scrChaveNorm(flag);
  if(Object.prototype.hasOwnProperty.call(SCREENER_FLAGS, k)) return SCREENER_FLAGS[k];
  return String(flag);
}

// Idade do dado guardado em texto curto pro selo da linha. Arredonda pra baixo
// de propósito: prometer "1h" num dado de 1h59 é mentir a favor do app.
function screenerIdadeTexto(seg){
  if(seg === null || seg === undefined || !isFinite(seg) || seg < 0) return "";
  // Só entra aqui quando a linha está marcada como dado guardado. Nesse caso
  // "agora há pouco" contradiz o próprio aviso de dado velho — e acontece de
  // verdade: o backend converte idade desconhecida (null) em 0. Sem idade
  // confiável, o honesto é dizer "dado guardado" e não inventar um relógio.
  if(seg < 90) return "dado guardado";
  var min = Math.floor(seg / 60);
  if(min < 60) return min + " min atrás";
  var h = Math.floor(min / 60);
  return h + "h atrás";
}

function screenerFmtPontos(n){
  if(n === null || n === undefined) return "—";
  return n === Math.round(n) ? String(n) : n.toFixed(1).replace(".", ",");
}

// Mesmo semáforo que os limites de gasto já usam (renderLimitList): verde bom,
// âmbar em cima da linha, vermelho ruim. Nenhuma cor nova entra no app por
// causa do screener.
function screenerCor(pct){
  return pct >= 70 ? "var(--fs)" : (pct >= 40 ? "var(--fa)" : "var(--fe)");
}

function screenerRotuloPontos(p, max){
  if(p === null || p === undefined || !max) return "";
  var r = p / max;
  if(r >= 0.9) return "ótimo";
  if(r >= 0.7) return "bom";
  if(r >= 0.5) return "na média";
  if(r >= 0.3) return "fraco";
  if(r > 0) return "ruim";
  return "pior faixa";
}

function screenerEhFundo(linha){
  if(linha.tipo === "fii") return true;
  return SCREENER_FUNDOS.indexOf(linha.ticker) >= 0;
}

function screenerLinhaVazia(ticker){
  return {
    ticker: ticker, estado: "pendente", nome: "", preco: null, tipo: "acao",
    ind: {}, score: null, scoreMax: 25, cobertura: null,
    coberturaTotal: SCREENER_INDICADORES.length, aviso: "", erro: null, tokenMissing: false,
    // Por que a nota não saiu (texto do backend) — sem isso a coluna Nota é um
    // traço mudo, e traço mudo o usuário lê como "empresa ruim".
    notaMotivo: "", notaMinimo: null,
    // Nota que a conta de ações daria, guardada só pra explicar por que ela
    // NÃO vale em fundo imobiliário.
    notaBruta: null,
    // Indicadores cuja escala foi decidida pelo conjunto dos 15, não pelo
    // próprio papel (diagnostico.escalaPorLote).
    escalaPorLote: [],
    // Preço/indicador podem vir de dado guardado de até 6 h. Sem marcar isso a
    // tela mistura número de agora com número de 6 h atrás sem avisar.
    cacheStale: false, cacheIdade: null, cacheMotivo: ""
  };
}

// "Token não configurado" é problema de configuração do worker, não da conta
// do usuário — merece tela própria em vez de virar "não consegui carregar".
//
// A checagem por contrato vem PRIMEIRO: o backend responde 503 com
// configurado:false e erro.tipo:'nao_configurado'. A caça a palavra em texto
// continua embaixo só como rede pra servidor antigo — era só ela que existia
// aqui, e ela não enxergava o 503 real (o campo vinha aninhado em "erro"),
// então a tela dedicada era código morto. "token inválido" de propósito não
// cai aqui (exige também uma palavra de ausência).
function screenerTokenAusente(status, body){
  if(!body || typeof body !== "object" || Array.isArray(body)) return false;
  if(body.configurado === false) return true;
  var erroObj = scrCampo(body, ["erro","error"]);
  if(erroObj && typeof erroObj === "object" && !Array.isArray(erroObj)){
    var tipo = scrPick(erroObj, ["tipo","type","codigo","code"]);
    if(typeof tipo === "string" && scrChaveNorm(tipo) === "naoconfigurado") return true;
  }
  var codigo = screenerPrimeiroTexto(body, ["code","codigo","error_code","erro_code"]);
  var msg = screenerPrimeiroTexto(body, ["error","erro","message","mensagem","detail","detalhe","motivo"]);
  var alvo = (codigo + " " + msg).toLowerCase();
  if(alvo.indexOf("brapi_token") >= 0 || alvo.indexOf("token_missing") >= 0 || alvo.indexOf("missing_token") >= 0) return true;
  if(alvo.indexOf("token") < 0) return false;
  return alvo.indexOf("configurad") >= 0 || alvo.indexOf("ausente") >= 0 ||
    alvo.indexOf("faltando") >= 0 || alvo.indexOf("missing") >= 0 || alvo.indexOf("não definido") >= 0;
}

// Lê um indicador aceitando as três formas plausíveis: objeto indexado por
// chave, array de {chave, valor, pontos, faixa}, ou o valor solto no topo da
// resposta. Campo que falta vira null e sai da conta — nunca vira 0, que é a
// pior nota e distorceria o ranking inteiro.
function screenerLeIndicador(fonte, meta, body){
  var bruto;
  if(Array.isArray(fonte)){
    for(var i = 0; i < fonte.length; i++){
      var it = fonte[i];
      if(!it || typeof it !== "object") continue;
      var k = scrPick(it, ["chave","key","id","indicador","nome","name","campo"]);
      if(scrBateChave(k, meta.aliases)){ bruto = it; break; }
    }
  } else if(fonte && typeof fonte === "object"){
    bruto = scrPick(fonte, meta.aliases);
  }
  if(bruto === undefined && body) bruto = scrCampo(body, meta.aliases);
  var ind = {
    valor: null, texto: "", pontos: null, pontosMax: null,
    faixa: "", motivo: "", flag: "", escala: "",
    // achou = "esta fonte tem alguma coisa a dizer sobre este indicador".
    // Diferente de "tem valor": o detalhe de um indicador ausente é justamente
    // a fonte que explica POR QUE ele está ausente.
    achou: false, disponivel: null
  };
  if(bruto === undefined || bruto === null) return ind;
  ind.achou = true;
  if(typeof bruto === "object" && !Array.isArray(bruto)){
    ind.valor = scrNum(scrPick(bruto, ["valor","value","v","num","raw"]));
    var texto = scrPick(bruto, ["texto","formatado","label","fmt","exibicao"]);
    ind.texto = typeof texto === "string" ? texto : "";
    ind.pontos = scrNum(scrPick(bruto, ["pontos","score","points","nota"]));
    ind.pontosMax = scrNum(scrPick(bruto, ["pontosMaximos","pontos_maximos","pontosMax","maxPontos","max"]));
    // "faixa" e "motivo" são coisas DIFERENTES no backend e antes caíam no
    // mesmo campo, com o primeiro apagando o outro: faixa diz em que trecho da
    // régua o valor caiu ("P/L entre 6 e 10"); motivo diz por que o indicador
    // ficou fora da conta ("fundo imobiliário — ROE de empresa não se aplica").
    var faixa = scrPick(bruto, ["faixa","explicacao","descricao","justificativa","criterio","range"]);
    ind.faixa = typeof faixa === "string" ? faixa : "";
    var motivo = scrPick(bruto, ["motivo","razao","porque"]);
    ind.motivo = typeof motivo === "string" ? motivo : "";
    var flag = scrPick(bruto, ["flag","aviso","observacao","alerta"]);
    ind.flag = typeof flag === "string" ? flag : "";
    var escala = scrPick(bruto, ["escala","scale","unidade"]);
    ind.escala = typeof escala === "string" ? escala : "";
    var disp = scrPick(bruto, ["disponivel","available"]);
    if(typeof disp === "boolean") ind.disponivel = disp;
  } else {
    ind.valor = scrNum(bruto);
  }
  return ind;
}

// Transforma a resposta crua de um papel na linha que a tela sabe desenhar.
// Toda a defesa contra formato inesperado mora aqui: a partir daqui o render
// só lida com números, strings e null.
function screenerLinha(ticker, status, body){
  var linha = screenerLinhaVazia(ticker);
  linha.estado = "erro";

  if(screenerTokenAusente(status, body)){
    linha.tokenMissing = true;
    linha.erro = "Chave do provedor de cotações não configurada no servidor.";
    return linha;
  }
  if(status === 401 || status === 403){
    linha.erro = "Acesso negado. Desbloqueie o painel de admin de novo em Configurações.";
    return linha;
  }
  if(status === 429){
    linha.erro = "O provedor limitou as consultas agora. Tente de novo em alguns minutos.";
    return linha;
  }
  if(!body || typeof body !== "object" || Array.isArray(body)){
    // Resposta que não é JSON de objeto normalmente é página de erro de proxy
    // ou rota que ainda não existe — vale dizer isso em vez de "erro".
    linha.erro = status === 200 ? "O servidor respondeu num formato que não sei ler." : ("Não consegui buscar (erro " + status + ").");
    return linha;
  }

  var erroCampo = scrCampo(body, ["error","erro"]);
  var msgErro = screenerPrimeiroTexto(body, ["error","erro","message","mensagem","detail","detalhe","motivo"]);
  var falhou = status !== 200 || body.ok === false || erroCampo === true || (typeof erroCampo === "string" && erroCampo !== "");
  if(falhou){
    linha.erro = msgErro || (status === 200 ? "O servidor não conseguiu buscar este papel." : ("Não consegui buscar (erro " + status + ")."));
    return linha;
  }

  // Casar a resposta com o pedido pelo símbolo, nunca pela ordem de chegada:
  // se vier outro papel, é melhor marcar erro do que exibir o número da VALE3
  // na linha da PETR4 — num app de investimento esse é o pior bug possível.
  var symbol = scrCampo(body, ["symbol","ticker","simbolo","codigo","papel"]);
  if(typeof symbol === "string" && symbol && symbol.toUpperCase() !== ticker.toUpperCase()){
    linha.erro = "O servidor respondeu com outro papel (" + symbol + ").";
    return linha;
  }

  var nome = scrCampo(body, ["shortName","short_name","nome","name","longName","long_name","empresa"]);
  linha.nome = typeof nome === "string" ? nome : "";
  linha.preco = scrNum(scrCampo(body, ["preco","price","regularMarketPrice","preco_atual","precoAtual","cotacao"]));
  var aviso = scrCampo(body, ["aviso","disclaimer","aviso_dados","avisoDados","observacao"]);
  linha.aviso = typeof aviso === "string" ? aviso : "";

  var tipo = scrCampo(body, ["tipo","type","categoria","classe"]);
  if(typeof tipo === "string" && /fii|fundo|fund|imobili/i.test(tipo)) linha.tipo = "fii";

  var fonteScore = scrCampo(body, ["nota","score","pontuacao"]);
  var ehObjScore = fonteScore !== undefined && fonteScore !== null && typeof fonteScore === "object" && !Array.isArray(fonteScore);
  // A LISTA DE DETALHES É A FONTE PRINCIPAL, o objeto chapado é só complemento.
  // Só nota.detalhes traz pontos, faixa, flag e o motivo da ausência — que é
  // exatamente o que o painel "Como a nota foi montada" existe pra mostrar.
  // Lendo body.indicadores primeiro, o painel escrevia cinco vezes "o servidor
  // não mandou os pontos" com a resposta certa na mão.
  var detalhes = ehObjScore ? scrPick(fonteScore, ["detalhes","detalhe","itens","breakdown","componentes"]) : undefined;
  var fonteInd = scrCampo(body, ["indicadores","indicators","metricas","metrics","fundamentos"]);
  if(detalhes === undefined && ehObjScore) detalhes = scrPick(fonteScore, ["indicadores"]);
  if(!fonteInd && !detalhes) fonteInd = scrCampo(body, ["detalhe","detalhes"]);

  if(ehObjScore){
    linha.score = scrNum(scrPick(fonteScore, ["total","valor","score","pontos","nota"]));
  } else {
    linha.score = scrNum(fonteScore);
  }
  if(linha.score === null) linha.score = scrNum(scrCampo(body, ["score_total","scoreTotal","nota_total","notaTotal","pontos"]));
  // "escalaMaxima" é o nome que o backend usa de verdade. Sem ele aqui, o dia
  // em que alguém mexer em SCORE_PESOS a tela passa a dividir por 25 uma nota
  // que vai até 30: barra saturada em 100% e rótulo "27/25".
  var max = scrNum(scrCampo(body, ["escalaMaxima","escala_maxima","scoreMax","score_max","maxScore","notaMax","nota_max","total_possivel"]));
  if(max === null && ehObjScore) max = scrNum(scrPick(fonteScore, ["escalaMaxima","escala_maxima","max","total_possivel","maximo"]));
  if(max !== null && max > 0) linha.scoreMax = max;

  // Por que a nota não saiu, nas palavras do backend.
  if(ehObjScore){
    var motivoNota = scrPick(fonteScore, ["motivo","razao","explicacao"]);
    linha.notaMotivo = typeof motivoNota === "string" ? motivoNota : "";
    linha.notaMinimo = scrNum(scrPick(fonteScore, ["minimoIndicadores","minimo_indicadores","minimo"]));
    // Quanto a conta de AÇÃO daria neste papel. Só serve pra explicar, no
    // detalhe do FII, qual é o número que estamos nos recusando a dar.
    var brutos = scrNum(scrPick(fonteScore, ["pontosBrutos","pontos_brutos"]));
    var maximos = scrNum(scrPick(fonteScore, ["pontosMaximos","pontos_maximos"]));
    if(brutos !== null && maximos !== null && maximos > 0){
      linha.notaBruta = Math.round(brutos / maximos * linha.scoreMax * 10) / 10;
    }
  }

  var disponiveis = 0;
  SCREENER_INDICADORES.forEach(function(meta){
    var ind = screenerLeIndicador(detalhes, meta, null);
    if(!ind.achou){
      ind = screenerLeIndicador(fonteInd, meta, body);
    } else if(ind.valor === null && ind.disponivel !== false){
      // Detalhe existe mas sem o número (formato antigo, ou valor só no objeto
      // chapado): completa o VALOR e mantém pontos/faixa/motivo do detalhe.
      // Quando disponivel === false não completa de propósito — aquele valor é
      // justamente o que a nota DESCARTOU, e exibi-lo faria a coluna mostrar
      // "45,00x" para um indicador que não entrou em conta nenhuma.
      var extra = screenerLeIndicador(fonteInd, meta, body);
      if(extra.valor !== null){ ind.valor = extra.valor; if(!ind.texto) ind.texto = extra.texto; }
    }
    if(!ind.escala) ind.escala = meta.escalaPadrao || "";
    linha.ind[meta.key] = ind;
    if(ind.disponivel === true || (ind.disponivel === null && (ind.valor !== null || ind.pontos !== null))) disponiveis++;
  });

  // Cobertura pode vir como número (4), objeto ({disponiveis, total}) ou texto
  // ("4 de 5"). Se não vier nada, conta na mão o que chegou — dizer quantos
  // indicadores a nota enxergou é o que separa um screener honesto de um que
  // parece preciso e não é.
  //
  // A COBERTURA DA NOTA VEM PRIMEIRO. Recontar aqui a partir do objeto chapado
  // dá o número errado: ele ainda tem o valor que a nota descartou, e a tela
  // dizia "5 de 5, a nota viu tudo" com a nota tendo visto 4.
  var cob = ehObjScore ? scrPick(fonteScore, ["cobertura","coverage","disponiveis"]) : undefined;
  if(cob === undefined) cob = scrCampo(body, ["cobertura","coverage","indicadores_disponiveis"]);
  if(ehObjScore){
    var totalNota = scrNum(scrPick(fonteScore, ["totalIndicadores","total_indicadores"]));
    if(totalNota !== null && totalNota > 0) linha.coberturaTotal = totalNota;
  }
  if(cob !== undefined && typeof cob === "object"){
    linha.cobertura = scrNum(scrPick(cob, ["disponiveis","disponivel","count","n","valor","total"]));
    var totalCob = scrNum(scrPick(cob, ["total","de","max","maximo"]));
    if(totalCob !== null && totalCob > 0) linha.coberturaTotal = totalCob;
  } else if(typeof cob === "string"){
    var m = cob.match(/(\d+)\D+(\d+)/);
    if(m){ linha.cobertura = Number(m[1]); linha.coberturaTotal = Number(m[2]); }
    else linha.cobertura = scrNum(cob);
  } else if(cob !== undefined){
    linha.cobertura = scrNum(cob);
  }
  if(linha.cobertura === null || linha.cobertura === undefined) linha.cobertura = disponiveis;

  // Dado guardado: o servidor serve registro de até 6 h quando a fonte cai ou
  // o limite estoura. Preço velho sem marca, num app de investimento, é pior
  // que preço ausente — o usuário compara papéis achando que é tudo do mesmo
  // instante. O backend estampa a idade justamente pra ela ser mostrada.
  var cache = scrCampo(body, ["cache"]);
  if(cache && typeof cache === "object" && !Array.isArray(cache)){
    linha.cacheStale = scrPick(cache, ["stale","vencido"]) === true;
    linha.cacheIdade = scrNum(scrPick(cache, ["idadeSegundos","idade_segundos","idade","ageSeconds"]));
    var motivoCache = scrPick(cache, ["motivo","razao","reason"]);
    linha.cacheMotivo = typeof motivoCache === "string" ? motivoCache : "";
  }

  // Indicadores cuja escala (fração x percentual) só foi resolvida porque os
  // 15 papéis vieram juntos. A nota é confiável; o usuário só merece saber que
  // a escala foi inferida do conjunto e não confirmada no próprio papel.
  var diag = scrCampo(body, ["diagnostico","diagnostics"]);
  var porLote = diag && typeof diag === "object" ? scrPick(diag, ["escalaPorLote","escala_por_lote"]) : undefined;
  if(Array.isArray(porLote)){
    linha.escalaPorLote = porLote.filter(function(k){ return typeof k === "string"; });
  }

  linha.estado = "ok";
  return linha;
}

// O indicador teve a escala decidida pelo conjunto, e não pelo próprio papel?
function screenerEscalaDoLote(linha, meta){
  var lista = linha.escalaPorLote || [];
  for(var i = 0; i < lista.length; i++){
    if(scrBateChave(lista[i], meta.aliases)) return true;
  }
  return false;
}

// Uma promessa por papel que NUNCA rejeita: um ticker que falha vira linha com
// erro na tabela, e os outros 14 continuam aparecendo.
function screenerBuscaTicker(ticker){
  return fetch("/api/stocks/" + encodeURIComponent(ticker), { headers: adminHeaders() })
    .then(function(r){
      // Lê como texto e faz o parse aqui: se a rota ainda não existir ou um
      // proxy devolver HTML, o r.json() lançaria e derrubaria o lote inteiro.
      return r.text().then(function(t){
        var corpo = null;
        try { corpo = JSON.parse(t); } catch(e){ corpo = null; }
        return { status: r.status, body: corpo };
      });
    })
    .then(function(res){ return screenerLinha(ticker, res.status, res.body); })
    .catch(function(){
      var linha = screenerLinhaVazia(ticker);
      linha.estado = "erro";
      linha.erro = "Falha de conexão.";
      return linha;
    });
}

// Só redesenha se o usuário ainda estiver no screener: as 15 respostas chegam
// espalhadas no tempo e um render() fora da aba recriaria o DOM de outra tela
// no meio de uma digitação (mesmo motivo do isTypingInForm nos loads de fundo).
function screenerRender(){
  if(state.tab === "screener") render();
}

// Transforma a resposta do LOTE nas 15 linhas da tela.
//
// Casa por TICKER, nunca por posição: o servidor pode devolver em outra ordem,
// e trocar a posição faria a linha da PETR4 exibir os números da VALE3 — o
// pior bug possível num app de investimento. Papel da nossa lista que não veio
// vira erro na própria linha; papel que veio e não está na nossa lista entra
// no fim, pra divergência entre as duas listas APARECER em vez de sumir (foi
// exatamente assim que RDOR3 e HAPV3 ficaram meses em vermelho).
function screenerAplicaLote(papeis){
  var porTicker = {};
  for(var i = 0; i < papeis.length; i++){
    var p = papeis[i];
    if(!p || typeof p !== "object") continue;
    var t = scrCampo(p, ["ticker","symbol","simbolo","codigo","papel"]);
    // Mesmo formato que o backend exige na allowlist dele. Não é defesa contra
    // XSS (todo ticker sai escapado), é defesa de layout: um "ticker" de 5 mil
    // caracteres viraria uma linha que empurra a tabela inteira pra fora.
    if(typeof t !== "string" || !/^[A-Z0-9]{4,6}$/.test(t.toUpperCase())) continue;
    porTicker[t.toUpperCase()] = p;
  }

  var linhas = SCREENER_TICKERS.map(function(ticker){
    if(!Object.prototype.hasOwnProperty.call(porTicker, ticker)){
      var vazia = screenerLinhaVazia(ticker);
      vazia.estado = "erro";
      vazia.erro = "O servidor não devolveu este papel na lista.";
      return vazia;
    }
    var corpo = porTicker[ticker];
    delete porTicker[ticker];
    // status 200 porque o lote já respondeu 200: o que diz se este papel deu
    // certo é o ok/erro DELE, e screenerLinha já sabe ler os dois.
    return screenerLinha(ticker, 200, corpo);
  });

  Object.keys(porTicker).forEach(function(extra){
    linhas.push(screenerLinha(extra, 200, porTicker[extra]));
  });
  return linhas;
}

// Uma chamada só, em GET /api/stocks. NUNCA rejeita: devolve o que deu.
function screenerBuscaLote(){
  return fetch("/api/stocks", { headers: adminHeaders() })
    .then(function(r){
      // Texto + parse na mão: rota inexistente ou proxy devolvendo HTML faria
      // r.json() lançar e derrubar a tela inteira.
      return r.text().then(function(t){
        var corpo = null;
        try { corpo = JSON.parse(t); } catch(e){ corpo = null; }
        return { status: r.status, body: corpo };
      });
    })
    .catch(function(){ return { status: 0, body: null }; });
}

// Carrega a lista inteira numa requisição só.
//
// O motivo é de CORREÇÃO, não de desempenho: a escala fração-vs-percentual da
// fonte não tem como ser resolvida com um papel só na mão. Com os 15 juntos, a
// mediana de cada campo decide a escala; papel a papel, três indicadores caem
// por "escala ambígua" e a maioria da lista fica SEM NOTA. Por isso a rota de
// lote é o caminho normal, e a busca papel a papel só sobra como fallback pra
// servidor publicado antes dela existir.
function loadScreener(){
  if(state.screenerLoading) return;
  state.screenerLoading = true;
  state.screenerError = null;
  state.screenerTokenMissing = false;
  // Mesmo sendo uma chamada só, o estado de progresso continua: a resposta
  // demora os mesmos segundos (são 15 cotações do outro lado) e tela parada
  // sem nada escrito é indistinguível de tela quebrada.
  state.screenerProgress = { feitos: 0, total: SCREENER_TICKERS.length, lote: true };
  state.screenerData = SCREENER_TICKERS.map(function(t){ return screenerLinhaVazia(t); });
  screenerRender();

  screenerBuscaLote().then(function(res){
    var body = res.body;

    // Servidor publicado sem a rota de lote: cai pro caminho antigo em vez de
    // deixar a tela vazia.
    if(res.status === 404 || res.status === 405){
      state.screenerProgress = { feitos: 0, total: SCREENER_TICKERS.length, lote: false };
      screenerRender();
      screenerCarregaUmPorUm();
      return;
    }

    if(screenerTokenAusente(res.status, body)){
      state.screenerTokenMissing = true;
      state.screenerLoading = false;
      state.screenerProgress = null;
      screenerRender();
      return;
    }

    var papeis = body && typeof body === "object" ? scrCampo(body, ["papeis","papéis","itens","resultados","acoes","lista"]) : undefined;
    if(res.status !== 200 || !body || typeof body !== "object" || body.ok === false || !Array.isArray(papeis)){
      // Preferir SEMPRE a frase que o backend escreveu: ela diz o que fazer
      // ("os indicadores completos precisam de um plano de dados que ainda não
      // temos"), e "erro 503" não diz nada.
      var msg = body && typeof body === "object" ? screenerPrimeiroTexto(body, ["erro","error","message","mensagem","detail","detalhe","motivo"]) : "";
      // 401/403 é sessão de admin vencida, não falha de mercado: o texto do
      // servidor ("unauthorized") não diz ao usuário o que fazer.
      if(res.status === 401 || res.status === 403) msg = "Acesso negado. Desbloqueie o painel de admin de novo em Configurações.";
      else if(res.status === 429 && !msg) msg = "O provedor limitou as consultas agora. Tente de novo em alguns minutos.";
      if(!msg && res.status === 0) msg = "Falha de conexão ao buscar a lista.";
      if(!msg && res.status === 200) msg = "O servidor respondeu num formato que não sei ler.";
      if(!msg) msg = "Não consegui carregar a lista (erro " + res.status + ").";
      state.screenerError = msg;
      state.screenerData = null;
      state.screenerLoading = false;
      state.screenerProgress = null;
      screenerRender();
      return;
    }

    // Um papel que falhou não derruba os outros: cada um vira a sua linha, com
    // erro ou com número.
    state.screenerData = screenerAplicaLote(papeis);
    var falhas = 0;
    state.screenerData.forEach(function(l){
      if(l.tokenMissing) state.screenerTokenMissing = true;
      if(l.erro) falhas++;
    });
    state.screenerLoading = false;
    state.screenerProgress = null;
    if(state.screenerData.length && falhas >= state.screenerData.length && !state.screenerTokenMissing){
      state.screenerError = "Nenhum papel carregou. Pode ser o provedor de cotações fora do ar.";
    }
    screenerRender();
  }).catch(function(e){
    // .catch OBRIGATÓRIO: screenerLoading só era desligado dentro do .then, e o
    // callback chama render(), que redesenha o APP INTEIRO — uma exceção em
    // QUALQUER outra tela deixaria o screener preso em "carregando" até
    // recarregar a página. É exatamente o bug que já travou o botão de código
    // do WhatsApp em "Gerando código…".
    state.screenerLoading = false;
    state.screenerProgress = null;
    state.screenerError = "Algo quebrou ao montar a tela: " + ((e && e.message) || e);
    screenerRender();
  });
}

// FALLBACK: um papel por requisição, em lotes de SCREENER_LOTE. Só roda quando
// GET /api/stocks não existe no servidor publicado. Sem a visão do conjunto, a
// escala de dy/roe/margem pode ficar ambígua e vários papéis saem sem nota —
// é o preço de rodar contra um deploy antigo, e o motivo aparece na coluna.
function screenerCarregaUmPorUm(){
  var proximo = 0;
  var feitos = 0;
  var falhas = 0;

  function dispara(){
    if(proximo >= SCREENER_TICKERS.length) return;
    var indice = proximo;
    proximo++;
    screenerBuscaTicker(SCREENER_TICKERS[indice]).then(function(linha){
      // Grava pelo índice do pedido, não pela ordem de chegada: os lotes
      // terminam fora de ordem e trocar a posição faria uma linha exibir os
      // números de outro papel.
      if(state.screenerData && state.screenerData[indice]) state.screenerData[indice] = linha;
      if(linha.tokenMissing) state.screenerTokenMissing = true;
      if(linha.erro) falhas++;
      feitos++;
      if(state.screenerProgress) state.screenerProgress.feitos = feitos;
      if(feitos >= SCREENER_TICKERS.length){
        state.screenerLoading = false;
        state.screenerProgress = null;
        if(falhas >= SCREENER_TICKERS.length && !state.screenerTokenMissing){
          state.screenerError = "Nenhum papel carregou. Pode ser o provedor de cotações fora do ar ou a rota /api/stocks ainda não estar publicada.";
        }
      }
      screenerRender();
      dispara();
    });
  }

  var lote = Math.min(SCREENER_LOTE, SCREENER_TICKERS.length);
  for(var i = 0; i < lote; i++) dispara();
}

function screenerValorOrdenacao(linha, chave){
  if(chave === "preco") return linha.preco;
  if(chave === "score") return screenerEhFundo(linha) ? null : linha.score;
  var ind = linha.ind && linha.ind[chave];
  return ind ? ind.valor : null;
}

function screenerCompara(a, b){
  var chave = state.screenerSort;
  var dir = state.screenerSortDir === "asc" ? 1 : -1;
  if(chave === "ticker"){
    return a.ticker < b.ticker ? -dir : (a.ticker > b.ticker ? dir : 0);
  }
  var va = screenerValorOrdenacao(a, chave);
